rum helps you move from accurate to idiomatic. Grammatically, they fall into patterns: adjective + noun, verb + noun, noun + verb, adverb + adjective, and verb + prepositional phrase."],collocs:[{term:"heavy rain",meaning:"a large amount of rain",example:"We were caught in heavy rain on the way to the office."},{term:"strong coffee",meaning:"coffee with intense flavour",example:"She prefers strong coffee before 8am."},{term:"make a decision",meaning:"to decide formally",example:"The board will make a decision by Friday."},{term:"deeply concerned",meaning:"very worried",example:"Investors are deeply concerned about volatility."},{term:"rancid butter",meaning:"butter that has gone bad",example:"A strong collocation — you wouldn't say rotten butter."},{term:"take responsibility",meaning:"to accept duty",example:"We take responsibility for the delay."}],examples:[{text:"Heavy rain is expected to curb construction output in the northern region this week.",bold:"Heavy rain",source:"Business Report • Weather & Operations"},{text:"It took three meetings to finally make a decision on the resource allocation.",bold:"make a decision",source:"McKinsey Quarterly • Archive"},{text:"The CEO said she was deeply concerned about the steady growth narrative masking risks.",bold:"deeply concerned",source:"FT Interview • 2023"},{text:"Strong coffee won't fix a weak collocation — learners need pattern awareness.",bold:"Strong coffee",source:"Applied Linguistics Blog"},{text:"They had to take responsibility for systems that failed to run smoothly.",bold:"take responsibility",source:"Incident Report"}],mistakes:[{wrong:"strong rain",correct:"heavy rain",note:"Rain collocates with heavy, light, torrential — never strong in standard use."},{wrong:"do a decision",correct:"make a decision",note:"Decision-making uses make. Do is for routine tasks (do homework, do business)."},{wrong:"very concerned",correct:"deeply concerned",note:"For emotional intensity, deeply / gravely beats very in formal collocations."}],gaps:[{id:"u1g1",sentence:"The forecast warned of ___ rain disrupting transport.",options:["strong","heavy","large"],answer:"heavy",explain:"heavy rain is the natural collocation for intense rainfall."},{id:"u1g2",sentence:"We need to ___ responsibility for the missed deadline.",options:["take","make","do"],answer:"take",explain:"take responsibility is a fixed verb + noun collocation."}],matches:[{id:"m1",left:"heavy",right:"rain / traffic / loss"},{id:"m2",left:"strong",right:"coffee / argument / evidence"},{id:"m3",left:"deeply",right:"concerned / rooted / divided"},{id:"m4",left:"rancid",right:"butter (strong, fixed)"}]},{id:2,title:"Time",subtitle:"How fluency manages time",duration:"14 min",intro:["Time collocations are deceptively simple and constantly misused. Native speakers don't save time the way they save money — the verb changes meaning slightly. You spend time like a resource, you waste it like a cost, and you kill it when you have too much.","Prepositional patterns matter: in the long term suggests a strategic horizon, ahead of time implies preparation, on time is punctuality. Short-term vs long-term is hyphenated as an adjective (short-term growth) but open as a noun phrase (in the short term)."],collocs:[{term:"spend time",meaning:"use time for an activity",example:"We spend time onboarding new managers."},{term:"save time",meaning:"reduce time needed",example:"This template will save time during audits."},{term:"in the long term",meaning:"over a long period",example:"In the long term, training pays off."},{term:"ahead of time",meaning:"early, with preparation",example:"Please submit reports ahead of time."},{term:"waste time",meaning:"use time badly",example:"Let's not waste time on low-impact tasks."},{term:"short-term plan",meaning:"plan for near future",example:"A short-term plan to curb inflation."}],examples:[{text:"Companies that spend time safeguarding interests see lower churn in the long term.",bold:"spend time",source:"HBR • Culture"},{text:"Automating allocation will save time and increase output across three factories.",bold:"save time",source:"Ops Report"},{text:"We submitted the earnings declaration ahead of time to avoid penalties.",bold:"ahead of time",source:"Finance Memo"},{text:"In the long term, stunting growth to protect margins is rarely sustainable.",bold:"in the long term",source:"Economist Briefing"}],mistakes:[{wrong:"in long term",correct:"in the long term",note:"Article 'the' is required. For adjective form: long-term (hyphenated)."},{wrong:"before time",correct:"ahead of time",note:"Before time is not idiomatic for early completion."}],gaps:[{id:"u2g1",sentence:"We need to ___ time if we want to launch before Q2.",options:["spend","save","waste"],answer:"save",explain:"Save time = reduce time needed, fits launch context."},{id:"u2g2",sentence:"___ of time, they prepared a remote access guide.",options:["Ahead","Before","In"],answer:"Ahead",explain:"Ahead of time = early, prepared."}],matches:[{id:"m1",left:"spend",right:"time / resources / budget"},{id:"m2",left:"ahead of",right:"time / schedule / curve"},{id:"m3",left:"in the long",right:"term / run / haul"},{id:"m4",left:"short-term",right:"growth / gain / thinking"}]},{id:3,title:"Business: People & Management",subtitle:"Leadership in fixed phrases",duration:"16 min",intro:["Business English is built on verb + noun collocations that signal authority and accountability. You take responsibility, you safeguard interests, you make a decision — you don't perform these actions with a generic verb. The precision is the point.","Management collocations often carry legal or operational weight. To safeguard interests implies fiduciary duty. To cut costs implies deliberate reduction, not accidental loss. Recognizing these nuances helps you avoid sounding tentative in high-stakes contexts."],collocs:[{term:"take responsibility",meaning:"accept accountability",example:"The manager took responsibility for the power cut."},{term:"safeguard interests",meaning:"protect stakeholders' welfare",example:"We must safeguard the interests of minority shareholders."},{term:"make a decision",meaning:"reach a conclusion",example:"We need to make a decision on resource allocation."},{term:"cut costs",meaning:"reduce expenses",example:"The plan will cut costs without stunting growth."},{term:"allocate resources",meaning:"distribute assets",example:"They allocate resources to thriving divisions."},{term:"building on success",meaning:"using prior success as foundation",example:"Building on success, we expanded to two new markets."}],examples:[{text:"When the systems crashed, the CTO took responsibility and published findings within 24 hours.",bold:"took responsibility",source:"Post-mortem • Tech Blog"},{text:"The clause exists to safeguard interests in case of rampant inflation.",bold:"safeguard interests",source:"Legal Review"},{text:"Building on success in logistics, the firm began to safely steer the economy of scale.",bold:"Building on success",source:"Annual Letter"},{text:"We cannot cut costs by increasing wear and tear on critical equipment.",bold:"cut costs",source:"Ops Meeting Notes"}],mistakes:[{wrong:"take a decision",correct:"make a decision",note:"In US/International Business English, make a decision is standard. Take a decision is UK-specific, formal."},{wrong:"save interests",correct:"safeguard interests",note:"Save is for money/time. Safeguard is for abstract protection."}],gaps:[{id:"u3g1",sentence:"Senior leaders must ___ the interests of all stakeholders.",options:["safeguard","save","keep"],answer:"safeguard",explain:"Safeguard interests = protect formally."},{id:"u3g2",sentence:"We need to ___ costs without affecting output.",options:["cut","curb","decrease"],answer:"cut",explain:"Cut costs is the fixed business collocation."}],matches:[{id:"m1",left:"take",right:"responsibility / charge / initiative"},{id:"m2",left:"safeguard",right:"interests / assets / data"},{id:"m3",left:"make",right:"a decision / an effort / progress"},{id:"m4",left:"cut",right:"costs / spending / corners"}]},{id:4,title:"Business: Operations",subtitle:"Output, growth and control",duration:"15 min",intro:["Operations vocabulary separates fluent managers from textbook learners. You increase output, you don't enlarge output. Systems run smoothly — they don't work smoothly in formal reports. Growth can be stunted, output can soar.","The difference is register and frequency. Corpus data shows run smoothly appears 12x more often than work smoothly in business contexts. Stunting growth is a strong negative collocation, often used with policy or underinvestment as the agent."],collocs:[{term:"increase output",meaning:"produce more",example:"Automation will increase output by 22%."},{term:"run smoothly",meaning:"operate without problems",example:"The plant has run smoothly since March."},{term:"stunting growth",meaning:"preventing growth",example:"Over-regulation is stunting growth."},{term:"soaring output",meaning:"rapidly increasing production",example:"Soaring output led to inventory glut."},{term:"allocate resources",meaning:"assign resources",example:"We allocate resources quarterly."},{term:"safely steer",meaning:"guide with caution",example:"We must safely steer the economy through volatility."}],examples:[{text:"Despite a power cut last week, operations continue to run smoothly thanks to redundancy.",bold:"run smoothly",source:"Ops Dashboard"},{text:"Bureaucracy is stunting growth in sectors that should be thriving.",bold:"stunting growth",source:"Policy Brief"},{text:"The initiative aims to increase output while reducing wear and tear.",bold:"increase output",source:"Factory Memo"},{text:"The central bank must safely steer the economy without curbing necessary investment.",bold:"safely steer",source:"Financial Times"}],mistakes:[{wrong:"work smoothly",correct:"run smoothly",note:"For systems/processes, run smoothly is idiomatic. Work smoothly is rare."},{wrong:"blocking growth",correct:"stunting growth",note:"Stunting growth implies gradual suppression, more precise for economics."}],gaps:[{id:"u4g1",sentence:"New robotics helped ___ output without extra shifts.",options:["increase","enlarge","raise up"],answer:"increase",explain:"Increase output is the standard collocation."},{id:"u4g2",sentence:"The migration was completed and now billing runs ___ .",options:["smoothly","smooth","smoothly enough"],answer:"smoothly",explain:"Run smoothly = operate well."}],matches:[{id:"m1",left:"increase",right:"output / efficiency / capacity"},{id:"m2",left:"run",right:"smoothly / efficiently / on schedule"},{id:"m3",left:"stunting",right:"growth / development / innovation"},{id:"m4",left:"soaring",right:"costs / output / demand"}]},{id:5,title:"Economy & Finance",subtitle:"Inflation, growth and the state",duration:"19 min",intro:["Economic collocations carry ideological weight. To curb inflation is a deliberate policy action; rampant inflation is its failure. Thriving industry suggests organic health, steady growth implies controlled progress, rising unemployment signals distress.","From the PDF source (p.34), pay attention to verb choice: governments levy taxes, they don't put taxes. Companies declare earnings, they don't announce earnings in formal filings. The collocation is the genre marker."],collocs:[{term:"curb inflation",meaning:"control price rises",example:"The bank moved to curb inflation."},{term:"rampant inflation",meaning:"uncontrolled inflation",example:"Rampant inflation eroded savings."},{term:"steady growth",meaning:"consistent, stable growth",example:"We project steady growth in Q3."},{term:"thriving industry",meaning:"successful, growing sector",example:"Tourism remains a thriving industry."},{term:"levy taxes",meaning:"impose taxes officially",example:"The state will levy taxes on windfall profits."},{term:"declared earnings",meaning:"officially reported profits",example:"Declared earnings beat estimates."},{term:"rising unemployment",meaning:"increasing joblessness",example:"Rising unemployment stunted consumption."}],examples:[{text:"Attempts to curb inflation have led to a credit squeeze and rising unemployment.",bold:"curb inflation",source:"Central Bank Minutes"},{text:"Despite rampant inflation, the region maintains a thriving black economy.",bold:"rampant inflation",source:"Market Analysis"},{text:"The finance ministry will levy taxes to fund initiatives tackling social exclusion.",bold:"levy taxes",source:"Budget Speech"},{text:"Declared earnings excluded undeclared cash flow from the informal sector.",bold:"Declared earnings",source:"Audit Report"},{text:"Steady growth is preferable to soaring output followed by a crash.",bold:"Steady growth",source:"Investor Letter"}],mistakes:[{wrong:"control inflation",correct:"curb inflation",note:"Curb is more formal/policy-specific than generic control."},{wrong:"put taxes",correct:"levy taxes",note:"Levy is the official verb for imposing taxes."},{wrong:"announced earnings",correct:"declared earnings",note:"In formal filings, declared is the collocation."}],gaps:[{id:"u5g1",sentence:"Fiscal tightening aims to ___ inflation before Q4.",options:["curb","cut","control"],answer:"curb",explain:"Curb inflation = formal policy collocation."},{id:"u5g2",sentence:"The government plans to ___ taxes on luxury imports.",options:["levy","put","charge"],answer:"levy",explain:"Levy taxes is the institutional phrase."},{id:"u5g3",sentence:"___ earnings showed a 12% increase despite power cuts.",options:["Declared","Announced","Said"],answer:"Declared",explain:"Declared earnings = officially reported."}],matches:[{id:"m1",left:"curb",right:"inflation / spending / excess"},{id:"m2",left:"rampant",right:"inflation / corruption / growth"},{id:"m3",left:"levy",right:"taxes / fines / tariffs"},{id:"m4",left:"steady",right:"growth / progress / decline"}]},{id:6,title:"Science & Technology",subtitle:"Frontiers, findings and failure modes",duration:"17 min",intro:["Scientific English relies on heroic verbs: we push back frontiers, we publish findings, we harness technology. These are not synonyms for explore or use — they frame science as advancement.","Technology also has its own failure lexicon. Systems crash, you don't say systems break down in formal IT. Power cuts are sudden; wear and tear is gradual. Cutting-edge design is praise; cutting costs is austerity. Context changes everything."],collocs:[{term:"push back frontiers",meaning:"extend limits of knowledge",example:"Research continues to push back frontiers."},{term:"publish findings",meaning:"release research results",example:"They will publish findings next month."},{term:"harness technology",meaning:"use tech effectively",example:"We harness technology to save time."},{term:"cutting-edge design",meaning:"most advanced design",example:"The lab features cutting-edge design."},{term:"wear and tear",meaning:"damage from use",example:"Machines suffer wear and tear."},{term:"systems crash",meaning:"systems fail suddenly",example:"Systems crash during power cuts."},{term:"power cut",meaning:"loss of electricity",example:"A power cut halted output."}],examples:[{text:"The team aims to push back frontiers in quantum computing while ensuring systems run smoothly.",bold:"push back frontiers",source:"Science Journal"},{text:"Researchers who harness technology to publish findings early gain citation advantage.",bold:"publish findings",source:"Nature Editorial"},{text:"Cutting-edge design means nothing if wear and tear is not accounted for.",bold:"cutting-edge design",source:"Product Review"},{text:"A power cut caused systems to crash and declared earnings to be delayed.",bold:"systems crash",source:"Incident Log"}],mistakes:[{wrong:"publish researches",correct:"publish findings",note:"Research is uncountable. Findings is the countable result."},{wrong:"system fell down",correct:"systems crash",note:"Crash is the tech-specific verb for failure."},{wrong:"newest design",correct:"cutting-edge design",note:"Cutting-edge conveys innovation, not just recency."}],gaps:[{id:"u6g1",sentence:"The grant helps us ___ back the frontiers of AI.",options:["push","put","take"],answer:"push",explain:"Push back frontiers = extend knowledge."},{id:"u6g2",sentence:"Repeated ___ and tear reduced efficiency.",options:["wear","ware","where"],answer:"wear",explain:"Wear and tear is fixed."},{id:"u6g3",sentence:"A sudden ___ cut triggered a systems crash.",options:["power","electric","energy"],answer:"power",explain:"Power cut is British standard; power outage US."}],matches:[{id:"m1",left:"push back",right:"frontiers / boundaries / limits"},{id:"m2",left:"publish",right:"findings / results / data"},{id:"m3",left:"cutting-edge",right:"design / technology / research"},{id:"m4",left:"systems",right:"crash / fail / reboot"}]},{id:7,title:"Technology in Life",subtitle:"The everyday interface",duration:"13 min",intro:["Domestic technology collocations are transactional and tactile. You swipe a card, you enter a PIN, you switch channels. These verbs are physical — swipe implies a motion, enter implies a code.","Financial technology brings its own cluster: online banking, remote access, Wi-Fi hotspots. Notice how flat-screen TV and remote control are noun + noun compounds that behave like collocations, fixed by usage, not logic."],collocs:[{term:"swipe a card",meaning:"pass card through reader",example:"Please swipe a card to pay."},{term:"enter PIN",meaning:"input personal code",example:"Enter PIN to confirm."},{term:"online banking",meaning:"banking via internet",example:"Online banking saves time."},{term:"remote access",meaning:"access from distance",example:"Remote access was disabled after the crash."},{term:"switch channels",meaning:"change TV channels",example:"He used the remote control to switch channels."},{term:"flat-screen TV",meaning:"thin TV type",example:"The flat-screen TV has cutting-edge design."},{term:"Wi-Fi hotspots",meaning:"places with wireless internet",example:"The campus offers Wi-Fi hotspots."}],examples:[{text:"Customers can swipe a card, enter PIN, and complete online banking in under 20 seconds.",bold:"swipe a card",source:"UX Study"},{text:"Remote access to trading terminals was revoked during the power cut.",bold:"remote access",source:"Security Advisory"},{text:"He used the remote control to switch channels on his flat-screen TV.",bold:"switch channels",source:"User Manual"},{text:"Hotels advertise Wi-Fi hotspots as part of thriving industry standards.",bold:"Wi-Fi hotspots",source:"Travel Blog"}],mistakes:[{wrong:"pass a card",correct:"swipe a card",note:"Swipe is the specific motion verb for card readers."},{wrong:"put PIN",correct:"enter PIN",note:"Enter is standard for codes and data input."}],gaps:[{id:"u7g1",sentence:"Please ___ a card and then enter your PIN.",options:["swipe","slide","pass"],answer:"swipe",explain:"Swipe a card is fixed."},{id:"u7g2",sentence:"The office provides ___ access for weekend work.",options:["remote","far","distant"],answer:"remote",explain:"Remote access is IT standard."}],matches:[{id:"m1",left:"swipe",right:"a card / to pay / left"},{id:"m2",left:"enter",right:"PIN / password / details"},{id:"m3",left:"remote",right:"access / control / work"},{id:"m4",left:"switch",right:"channels / providers / roles"}]},{id:8,title:"Social Issues",subtitle:"Language for public problems",duration:"15 min",intro:["Social policy English uses combative verbs: we tackle social exclusion, we curb spending, we safeguard interests. The verb tackle implies a difficult, active struggle — softer verbs sound evasive.","Value judgments also collocate strongly. Poor value for money is a fixed negative evaluation. Thriving black economy is an oxymoronic collocation that appears in audit reports — thriving is positive, black economy is illicit, together they describe informal resilience."],collocs:[{term:"tackle social exclusion",meaning:"address marginalization",example:"Programs to tackle social exclusion."},{term:"poor value for money",meaning:"not worth cost",example:"The service offers poor value for money."},{term:"thriving black economy",meaning:"active informal/illegal economy",example:"A thriving black economy distorts declared earnings."},{term:"safeguard interests",meaning:"protect vulnerable groups",example:"Policy must safeguard interests of low-income families."},{term:"rising unemployment",meaning:"growing joblessness",example:"Rising unemployment fuels exclusion."},{term:"levy taxes",meaning:"impose taxes for redistribution",example:"They levy taxes to fund inclusion."}],examples:[{text:"Initiatives that tackle social exclusion often fail to offer good value for money.",bold:"tackle social exclusion",source:"OECD Report"},{text:"Critics argue the scheme provides poor value for money while a thriving black economy grows.",bold:"poor value for money",source:"Audit UK"},{text:"Rampant inflation and rising unemployment make it harder to safeguard interests.",bold:"safeguard interests",source:"Policy Paper"},{text:"The city has a thriving black economy despite attempts to levy taxes more fairly.",bold:"thriving black economy",source:"Financial Investigation"}],mistakes:[{wrong:"fight social exclusion",correct:"tackle social exclusion",note:"Tackle is policy standard; fight is more rhetorical."},{wrong:"bad value for money",correct:"poor value for money",note:"Poor is fixed in this evaluation collocation."}],gaps:[{id:"u8g1",sentence:"The mayor pledged to ___ social exclusion in three districts.",options:["tackle","fight","solve"],answer:"tackle",explain:"Tackle social exclusion is the policy collocation."},{id:"u8g2",sentence:"The report found the service offered ___ value for money.",options:["poor","bad","low"],answer:"poor",explain:"Poor value for money is idiomatic."}],matches:[{id:"m1",left:"tackle",right:"social exclusion / poverty / issues"},{id:"m2",left:"poor",right:"value for money / performance / health"},{id:"m3",left:"thriving",right:"black economy / industry / sector"},{id:"m4",left:"rising",right:"unemployment / costs / tensions"}]},{id:9,title:"Language & Common Mistakes",subtitle:"Countable, uncountable, and false friends",duration:"16 min",intro:["The most persistent errors come from grammar colliding with collocation. Findings is always plural when it means results; research is always uncountable — you cannot have researches. These are not style choices, they are fixed.","Verb choice also misleads: you extend an opportunity, you don't expand an opportunity; you restrict access, you don't limit opportunity in formal registers. Declared vs undeclared is not just opposite — declared earnings is audited, undeclared is informal."],collocs:[{term:"publish findings",meaning:"release plural results",example:"We published findings in two journals."},{term:"conduct research",meaning:"do research (uncountable)",example:"They conduct research on inflation."},{term:"extend opportunity",meaning:"offer opportunity to more people",example:"We extend opportunity to underrepresented groups."},{term:"restrict access",meaning:"limit access formally",example:"We restrict access during power cuts."},{term:"declared earnings",meaning:"official earnings",example:"Declared earnings rose 8%."},{term:"undeclared income",meaning:"hidden earnings",example:"Undeclared income fuels black economy."}],examples:[{text:"The team will publish findings after they conduct research into rampant inflation.",bold:"publish findings",source:"Academic Style Guide"},{text:"We should extend opportunity without creating poor value for money.",bold:"extend opportunity",source:"HR Policy"},{text:"Declared earnings exclude undeclared income from thriving informal markets.",bold:"Declared earnings",source:"Tax Report"},{text:"Research shows that restricting access stunts growth more than cutting costs.",bold:"conduct research",source:"Working Paper"}],mistakes:[{wrong:"researches show",correct:"research shows",note:"Research is uncountable. Never add -s. Use studies if countable needed."},{wrong:"publish finding",correct:"publish findings",note:"Finding as result is almost always plural in academic collocations."},{wrong:"expand opportunity",correct:"extend opportunity",note:"Extend is idiomatic for opportunities; expand is for businesses."}],gaps:[{id:"u9g1",sentence:"Recent ___ shows a link between power cuts and systems crashing.",options:["research","researches","findings"],answer:"research",explain:"Research is uncountable."},{id:"u9g2",sentence:"They plan to ___ findings next quarter.",options:["publish","declare","announce"],answer:"publish",explain:"Publish findings is academic standard."}],matches:[{id:"m1",left:"conduct",right:"research / survey / interview"},{id:"m2",left:"publish",right:"findings / results / paper"},{id:"m3",left:"extend",right:"opportunity / invitation / deadline"},{id:"m4",left:"declared",right:"earnings / income / assets"}]},{id:10,title:"Intensifying Collocations",subtitle:"When very isn't enough",duration:"12 min",intro:["In premium writing, very is a missed opportunity. Intensifying collocations replace it with precision: highly recommended is stronger than very recommended (which is ungrammatical), deeply concerned is more formal than very worried, absolutely essential removes doubt.","These follow strict patterns: highly + past participle (highly recommended, highly volatile), deeply + emotional adjective (deeply concerned, deeply divided), absolutely + extreme adjective (absolutely essential, absolutely crucial). Mixing them sounds non-native."],collocs:[{term:"highly recommended",meaning:"strongly suggested",example:"This strategy is highly recommended."},{term:"deeply concerned",meaning:"very worried formally",example:"The board is deeply concerned."},{term:"absolutely essential",meaning:"completely necessary",example:"Remote access is absolutely essential."},{term:"strongly opposed",meaning:"firmly against",example:"Unions are strongly opposed to cuts."},{term:"utterly unacceptable",meaning:"totally unacceptable",example:"Poor value for money is utterly unacceptable."},{term:"bitterly disappointed",meaning:"extremely disappointed",example:"Investors were bitterly disappointed."}],examples:[{text:"The audit tool is highly recommended for tracking declared earnings.",bold:"highly recommended",source:"Product Hunt • Review"},{text:"Regulators are deeply concerned about wear and tear on critical infrastructure.",bold:"deeply concerned",source:"Regulatory Filing"},{text:"It is absolutely essential to publish findings ahead of time.",bold:"absolutely essential",source:"Editorial Guidelines"},{text:"Analysts were bitterly disappointed by steady growth projections.",bold:"bitterly disappointed",source:"Earnings Call"}],mistakes:[{wrong:"very recommended",correct:"highly recommended",note:"Recommended cannot take very. Use highly."},{wrong:"very essential",correct:"absolutely essential",note:"Essential is extreme; it takes absolutely, not very."},{wrong:"much concerned",correct:"deeply concerned",note:"Concerned collocates with deeply, not much."}],gaps:[{id:"u10g1",sentence:"This approach is ___ recommended for new managers.",options:["highly","very","much"],answer:"highly",explain:"Highly + past participle."},{id:"u10g2",sentence:"It is ___ essential to safeguard interests.",options:["absolutely","very","highly"],answer:"absolutely",explain:"Absolutely + extreme adjective."}],matches:[{id:"m1",left:"highly",right:"recommended / effective / unlikely"},{id:"m2",left:"deeply",right:"concerned / divided / rooted"},{id:"m3",left:"absolutely",right:"essential / crucial / vital"},{id:"m4",left:"bitterly",right:"disappointed / opposed / cold"}]},{id:11,title:"Verbs + Nouns Masterclass",subtitle:"Make vs Do, Take vs Have",duration:"18 min",intro:["Four verbs generate 60% of business collocation errors: make, do, take, have. Make is for creation and decisions (make a decision, make progress). Do is for tasks and duties (do research is wrong — conduct research, but do business is correct).","Take is for assumption and movement (take responsibility, take charge), have is for experience (have access, have an impact). The difference is not logical — it's statistical. Corpus frequency makes the choice."],collocs:[{term:"make a decision",meaning:"decide",example:"We must make a decision quickly."},{term:"do business",meaning:"trade",example:"We do business in 12 markets."},{term:"take responsibility",meaning:"accept blame/duty",example:"She took responsibility for the crash."},{term:"have an impact",meaning:"affect",example:"Power cuts have an impact on output."},{term:"make progress",meaning:"advance",example:"We made progress tackling exclusion."},{term:"take charge",meaning:"assume control",example:"He took charge after the outage."},{term:"have access",meaning:"be able to use",example:"Teams have remote access."}],examples:[{text:"Firms that take responsibility early make progress in safeguarding interests.",bold:"take responsibility",source:"Leadership Study"},{text:"Entering new markets means you do business differently and have an impact on local economies.",bold:"do business",source:"Expansion Memo"},{text:"We have access to cutting-edge design but still need to make a decision on allocation.",bold:"have access",source:"Tech Planning"},{text:"When systems crash, someone must take charge and make progress before earnings are declared.",bold:"take charge",source:"Incident Playbook"}],mistakes:[{wrong:"do a decision",correct:"make a decision",note:"Decision always with make."},{wrong:"make business",correct:"do business",note:"Business activities use do."},{wrong:"take an impact",correct:"have an impact",note:"Impact collocates with have."}],gaps:[{id:"u11g1",sentence:"We need to ___ a decision before the power cut ends.",options:["make","do","take"],answer:"make",explain:"Make a decision is fixed."},{id:"u11g2",sentence:"New regulations ___ an impact on declared earnings.",options:["have","take","make"],answer:"have",explain:"Have an impact."}],matches:[{id:"m1",left:"make",right:"a decision / progress / sense"},{id:"m2",left:"do",right:"business / homework / damage"},{id:"m3",left:"take",right:"responsibility / charge / time"},{id:"m4",left:"have",right:"access / impact / time"}]},{id:12,title:"Revision & Advanced Use",subtitle:"Opposites, building and steering",duration:"20 min",intro:["Advanced use means controlling opposites and metaphor. Soaring output vs stunting growth — both describe growth, one celebrates, one accuses. Building on success is constructive metaphor, safely steer the economy is navigational.","This unit synthesizes the 11 previous units into productive use. You will be tested on precise antonyms, metaphorical extension, and register awareness — the difference between a competent user and a premium one."],collocs:[{term:"soaring vs stunting",meaning:"rapid rise vs suppression",example:"Soaring output contrasts with stunting growth."},{term:"building on success",meaning:"using success as base",example:"Building on success, we entered Asia."},{term:"safely steer economy",meaning:"guide economy cautiously",example:"The bank must safely steer the economy."},{term:"curb vs rampant",meaning:"control vs uncontrolled",example:"To curb inflation vs rampant inflation."},{term:"declared vs undeclared",meaning:"official vs hidden",example:"Declared vs undeclared earnings."},{term:"increase vs allocate",meaning:"grow vs distribute",example:"Increase output, allocate resources."}],examples:[{text:"Building on success with online banking, the bank managed to safely steer the economy of trust.",bold:"Building on success",source:"Case Study • Final Unit"},{text:"Soaring output in Q1 masked stunting growth in R&D, a classic misread.",bold:"Soaring output",source:"Analyst Note"},{text:"The difference between declared and undeclared earnings explains the thriving black economy.",bold:"declared and undeclared",source:"Forensic Audit"},{text:"To
