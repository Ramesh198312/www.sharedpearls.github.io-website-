<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create your account | Shared Pearls of Wisdom</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --slate-900:#0F172A; --slate-700:#334155; --slate-500:#64748B;
    --slate-100:#F1F5F9; --amber-600:#D97706; --amber-500:#F59E0B;
    --paper:#FFFFFF; --border:#E2E8F0; --danger:#B91C1C; --ok:#15803D;
  }
  *{box-sizing:border-box}
  body{
    font-family:'Plus Jakarta Sans',sans-serif; margin:0; padding:2rem 1.25rem;
    background:linear-gradient(135deg,#F8FAFC 0%,#E2E8F0 100%);
    color:var(--slate-900); min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    background:var(--paper); width:100%; max-width:460px; border-radius:16px;
    padding:2.75rem 2.25rem; box-shadow:0 25px 50px -12px rgba(15,23,42,.15);
  }
  h1{font-family:'Playfair Display',serif; font-size:2.1rem; font-weight:600; margin:0 0 .4rem}
  .lede{color:var(--slate-700); font-size:.98rem; line-height:1.55; margin:0 0 1.75rem}
  .price-note{
    background:#FEF3C7; color:#92400E; border-radius:10px; padding:.75rem 1rem;
    font-size:.9rem; font-weight:600; margin-bottom:1.5rem;
  }
  .field{margin-bottom:1.1rem}
  label{display:block; font-size:.88rem; font-weight:600; color:var(--slate-700); margin-bottom:.4rem}
  input{
    width:100%; padding:.9rem 1rem; font-family:inherit; font-size:1rem;
    border:1px solid var(--border); border-radius:10px; background:#FCFDFE; color:var(--slate-900);
  }
  input:focus{outline:none; border-color:var(--amber-500); box-shadow:0 0 0 3px rgba(245,158,11,.18)}
  .btn{
    width:100%; padding:1.1rem 1rem; font-family:inherit; font-size:1.05rem; font-weight:700;
    color:#fff; background:linear-gradient(135deg,var(--amber-600),var(--amber-500));
    border:none; border-radius:12px; cursor:pointer; transition:transform .2s ease, box-shadow .2s ease;
    box-shadow:0 10px 20px -5px rgba(217,119,6,.4);
  }
  .btn:hover:not(:disabled){transform:translateY(-2px); box-shadow:0 15px 25px -5px rgba(217,119,6,.5)}
  .btn:disabled{opacity:.65; cursor:wait; transform:none}
  .btn:focus-visible{outline:3px solid var(--slate-900); outline-offset:3px}
  .provider{
    width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
    padding:.85rem 1rem; font-family:inherit; font-size:.98rem; font-weight:600;
    background:#fff; color:var(--slate-900); border:1px solid var(--border);
    border-radius:10px; cursor:pointer; margin-bottom:1rem;
  }
  .provider:hover{border-color:var(--slate-500)}
  .provider svg{width:20px;height:20px}
  .divider{display:flex; align-items:center; gap:12px; margin:1.3rem 0; color:var(--slate-500); font-size:.85rem}
  .divider::before,.divider::after{content:""; flex:1; height:1px; background:var(--border)}
  .msg{font-size:.92rem; margin:0 0 1rem; display:none; line-height:1.45}
  .msg.show{display:block}
  .msg.error{color:var(--danger)}
  .msg.ok{color:var(--ok)}
  .switch{font-size:.9rem; color:var(--slate-500); text-align:center; margin:1.3rem 0 0}
  .switch button{background:none; border:none; color:var(--amber-600); font-weight:700; font-family:inherit; font-size:.9rem; cursor:pointer; padding:0}
  .hint{font-size:.8rem; color:var(--slate-500); margin:.35rem 0 0}
  [hidden]{display:none !important}
</style>
</head>
<body>

<div class="card">
  <h1 id="title">Create your account</h1>
  <p class="lede" id="lede">Set up your account first. Payment comes next, and you land straight on the premium dashboard.</p>

  <div class="price-note">Mastery Pass — US$10/month. Cancel anytime.</div>

  <p class="msg" id="msg" role="alert"></p>

  <!-- Signed OUT -->
  <div id="authBlock">
    <button type="button" class="provider" id="googleBtn" hidden>
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59A14.5 14.5 0 0 1 9.77 24c0-1.6.27-3.15.76-4.59l-7.98-6.19A23.94 23.94 0 0 0 0 24c0 3.88.93 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continue with Google
    </button>

    <div class="divider" id="providerDivider" hidden>or use your email</div>

    <form id="authForm">
      <div class="field" id="emailField">
        <label for="email">Email address</label>
        <input type="email" id="email" autocomplete="email" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters">
        <p class="hint" id="pwHint">Use 8 characters or more.</p>
      </div>
      <button type="submit" class="btn" id="submitBtn">Create account and continue</button>
    </form>

    <p class="switch" id="forgotRow" hidden><button type="button" id="forgotBtn">Forgot password?</button></p>
    <p class="switch" id="switchRow">
      <span id="switchText">Already have an account? </span>
      <button type="button" id="switchBtn">Log in instead</button>
    </p>
  </div>

  <!-- Signed IN -->
  <div id="payBlock" hidden>
    <p class="lede" id="signedInAs"></p>
    <button type="button" class="btn" id="payBtn">Subscribe now — US$10/month</button>
    <p class="switch"><button type="button" id="manageBtn">Manage subscription</button></p>
    <p class="switch"><button type="button" id="logoutBtn">Log out</button></p>
  </div>
</div>

<script type="module" src="/assets/account.js"></script>

<noscript>Enable JavaScript to sign in and subscribe.</noscript>
</body>
</html>
