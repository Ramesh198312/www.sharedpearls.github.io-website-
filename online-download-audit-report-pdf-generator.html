 if(!result||busy)return;
 const btn=document.getElementById('manual-btn'),status=document.getElementById('status');
 if(typeof html2pdf!=='function'){status.textContent='The PDF library could not load. Check your connection and reload to try again. Your report remains available to preview.';return;}
 busy=true;btn.disabled=true;btn.textContent='Preparing your PDF…';
 try {
  await document.fonts.ready;
  const pages=[...document.querySelectorAll('.pdf-page')];let pdf;
  const options={margin:0,image:{type:'jpeg',quality:.96},html2canvas:{scale:1.5,logging:false,useCORS:true},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:[]}};
  // Render one designed page at a time: stable margins, no split rows or automatic blank pages.
  for(let i=0;i<pages.length;i++){
   status.textContent='Preparing page '+(i+1)+' of '+pages.length+'…';
   const worker=html2pdf().set(options).from(pages[i]).toContainer();
   const container=await worker.get('container');
   container.style.width='750px';container.style.height='1060px';
   container.firstElementChild.style.margin='0';
   // Draw running text as native PDF text to avoid canvas text-placement inconsistencies.
   for(const selector of ['.page-header','.footer']){const copy=container.querySelector(selector);copy.style.height=pages[i].querySelector(selector).getBoundingClientRect().height+'px';copy.innerHTML='';}
   await worker.toCanvas();
   if(i===0){pdf=await worker.toPdf().get('pdf');}
   else{const canvas=await worker.get('canvas');pdf.addPage();pdf.addImage(canvas.toDataURL('image/jpeg',.96),'JPEG',0,0,210,296.8);}
   const bounds=pages[i].getBoundingClientRect();
   pdf.setFont('helvetica','bold');pdf.setFontSize(7.5);pdf.setTextColor(112,16,32);
   pdf.text('SHARED PEARLS OF WISDOM',13.44,16);
   pdf.setFontSize(6.5);pdf.setTextColor(125,105,70);pdf.text(pages[i].querySelector('.page-header span').textContent,196.56,16,{align:'right'});
   pdf.setFont('helvetica','normal');pdf.setFontSize(6);pdf.setTextColor(119,109,99);
   pdf.text('PERSONAL ENGLISH LEARNING AUDIT / FREE REPORT',13.44,285);pdf.text((i+1)+' / '+pages.length,196.56,285,{align:'right'});
   pages[i].querySelectorAll('a.study-link').forEach(link=>{for(const rect of link.getClientRects()){pdf.link((rect.left-bounds.left)*210/750,(rect.top-bounds.top)*296.8/1060,rect.width*210/750,rect.height*296.8/1060,{url:new URL(link.getAttribute('href'),location.href).href});}});
  }
  pdf.save('Shared_Pearls_'+userLevel+'_'+userName.replace(/[^a-z0-9_-]/gi,'_')+'_Learning_Audit.pdf');
  status.textContent='Your PDF download has been requested. You can download another copy below.';
 }catch(error){status.textContent='We could not generate the PDF. Please try again. Your report is still available above.';console.error('PDF generation failed',error);}
 finally{busy=false;btn.disabled=false;btn.textContent='Download My Free Report';}
}
renderReport();
</script></body></html>
