<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="An interactive grammar lab for infinitives, -ing forms, and past participles." />
    <title>Infinitives Grammar Lab</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap');

      :root {
        --paper: #f7f5ef;
        --paper-2: #fcfbf8;
        --ink: #202b38;
        --muted: #69727c;
        --line: #dedbd2;
        --navy: #223142;
        --navy-2: #2b3c4d;
        --teal: #2f887e;
        --teal-soft: #e0f0ed;
        --coral: #c9634b;
        --gold: #d69d3a;
        --shadow: 0 14px 38px rgba(32, 43, 56, .08);
        --serif: 'Fraunces', Georgia, serif;
        --sans: 'DM Sans', Arial, sans-serif;
        --mono: 'DM Mono', monospace;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.6 var(--sans); }
      button, a, input { font: inherit; }
      button, a { -webkit-tap-highlight-color: transparent; }
      button { border: 0; cursor: pointer; }
      a { color: inherit; text-decoration: none; }

      .app { min-height: 100vh; }
      .sidebar {
        position: fixed; inset: 0 auto 0 0; z-index: 20; display: flex; width: 282px;
        flex-direction: column; padding: 24px 20px; background: var(--navy); color: #f7f5ef;
      }
      .brand { display: flex; align-items: center; gap: 12px; }
      .brand-mark { display: grid; width: 40px; height: 40px; place-items: center; border-radius: 12px; background: #3db7aa; color: #173332; font: 26px/1 var(--serif); }
      .brand-name { display: block; font: 600 19px/1 var(--serif); }
      .brand-sub { display: block; margin-top: 5px; color: rgba(247,245,239,.55); font: 9px var(--mono); letter-spacing: .22em; text-transform: uppercase; }
      .course-label { display: flex; justify-content: space-between; margin: 40px 8px 10px; color: rgba(247,245,239,.5); font: 10px var(--mono); letter-spacing: .18em; text-transform: uppercase; }
      .nav { min-height: 0; flex: 1; overflow: auto; }
      .nav-divider { height: 1px; margin: 14px 0; background: rgba(247,245,239,.14); }
      .nav-link { display: flex; align-items: flex-start; gap: 12px; width: 100%; padding: 9px 12px; border-radius: 10px; color: rgba(247,245,239,.7); font-size: 13px; line-height: 1.35; transition: .2s ease; }
      .nav-link:hover { background: var(--navy-2); color: #fff; }
      .nav-link.active { background: rgba(61,183,170,.18); color: #55c0b2; }
      .nav-num { min-width: 27px; color: rgba(247,245,239,.35); font: 10px var(--mono); }
      .nav-link.active .nav-num { color: #55c0b2; }
      .premium { margin-top: 18px; padding: 14px; border: 1px solid rgba(247,245,239,.13); border-radius: 12px; background: rgba(255,255,255,.04); }
      .premium-title { color: #55c0b2; font: 10px var(--mono); letter-spacing: .15em; text-transform: uppercase; }
      .premium p { margin: 8px 0 0; color: rgba(247,245,239,.56); font-size: 11px; line-height: 1.5; }

      .content { min-height: 100vh; margin-left: 282px; }
      .topbar { position: sticky; top: 0; z-index: 10; display: flex; height: 68px; align-items: center; justify-content: space-between; padding: 0 40px; border-bottom: 1px solid var(--line); background: rgba(247,245,239,.9); backdrop-filter: blur(14px); }
      .topbar-note, .saved { color: var(--muted); font: 10px var(--mono); letter-spacing: .16em; text-transform: uppercase; }
      .saved { display: flex; align-items: center; gap: 8px; letter-spacing: .1em; }
      .saved-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); }
      .mobile-menu { display: none; padding: 6px; background: none; color: var(--ink); font-size: 22px; }
      .page { max-width: 1180px; margin: 0 auto; padding: 42px 40px 70px; animation: rise .4s ease both; }
      .eyebrow { display: flex; align-items: center; gap: 12px; color: var(--teal); font: 10px var(--mono); letter-spacing: .2em; text-transform: uppercase; }
      .eyebrow::before { content: ''; width: 32px; height: 1px; background: currentColor; }
      h1, h2, h3 { margin: 0; font-family: var(--serif); font-weight: 600; letter-spacing: -.04em; }
      h1 { font-size: clamp(3rem, 7vw, 6.8rem); line-height: .92; }
      h2 { font-size: clamp(2rem, 4vw, 3.2rem); line-height: 1; }
      h3 { font-size: 1.35rem; line-height: 1.12; }
      .lede { max-width: 680px; margin: 26px 0 0; color: var(--muted); font-size: 18px; line-height: 1.7; }
      .accent-text { color: var(--teal); font-style: italic; }

      .overview-hero { display: grid; grid-template-columns: 1.08fr .92fr; gap: 36px; align-items: end; padding: 20px 0 80px; }
      .hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
      .button { display: inline-flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 10px; font-weight: 700; transition: .2s ease; }
      .button:hover { transform: translateY(-2px); }
      .button-primary { background: var(--teal); color: #fff; }
      .button-secondary { border: 1px solid var(--line); background: var(--paper-2); color: var(--ink); }
      .button:disabled { cursor: not-allowed; opacity: .45; transform: none; }
      .stats-card { position: relative; overflow: hidden; padding: 30px; border-radius: 18px; background: var(--navy); color: #f7f5ef; box-shadow: var(--shadow); }
      .stats-card::after { content: ''; position: absolute; right: -60px; top: -80px; width: 220px; height: 220px; border: 1px solid rgba(61,183,170,.27); border-radius: 50%; box-shadow: 0 0 0 26px rgba(61,183,170,.05), 0 0 0 52px rgba(61,183,170,.04); }
      .stats-label { color: rgba(247,245,239,.56); font: 10px var(--mono); letter-spacing: .18em; text-transform: uppercase; }
      .stats-number { position: relative; z-index: 1; display: flex; align-items: end; gap: 10px; margin-top: 42px; }
      .stats-number strong { color: #4db9ae; font: 64px/.85 var(--serif); }
      .stats-number span { color: rgba(247,245,239,.58); font-size: 13px; line-height: 1.35; }
      .progress-label { display: flex; justify-content: space-between; margin: 28px 0 7px; color: rgba(247,245,239,.55); font: 10px var(--mono); text-transform: uppercase; }
      .progress-track { height: 8px; overflow: hidden; border-radius: 99px; background: rgba(247,245,239,.15); }
      .progress-fill { height: 100%; border-radius: inherit; background: #4db9ae; transition: width .5s ease; }
      .stats-foot { display: flex; gap: 40px; margin-top: 28px; padding-top: 20px; border-top: 1px solid rgba(247,245,239,.14); }
      .stats-foot strong { display: block; font: 27px var(--serif); }
      .stats-foot span { color: rgba(247,245,239,.48); font: 9px var(--mono); letter-spacing: .12em; text-transform: uppercase; }

      .section-rule { padding-top: 30px; border-top: 1px solid var(--line); }
      .section-heading { display: flex; align-items: end; justify-content: space-between; gap: 30px; }
      .section-heading p { max-width: 360px; margin: 0; color: var(--muted); font-size: 14px; }
      .section-kicker { margin: 0 0 8px; color: var(--coral); font: 10px var(--mono); letter-spacing: .2em; text-transform: uppercase; }
      .lesson-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 34px; }
      .lesson-card { display: flex; min-height: 190px; flex-direction: column; justify-content: space-between; padding: 20px; border: 1px solid var(--line); border-radius: 13px; background: var(--paper-2); transition: .2s ease; }
      .lesson-card:hover { border-color: rgba(47,136,126,.55); box-shadow: var(--shadow); transform: translateY(-3px); }
      .card-top, .card-bottom { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .card-num { color: var(--muted); font: 11px var(--mono); }
      .card-check { display: grid; width: 20px; height: 20px; place-items: center; border-radius: 50%; background: var(--teal); color: #fff; font-size: 12px; }
      .card-bottom { color: var(--muted); font-size: 12px; }
      .card-arrow { color: var(--teal); font-size: 19px; transition: transform .2s ease; }
      .lesson-card:hover .card-arrow { transform: translateX(4px); }

      .lesson-top { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 34px; }
      .lesson-top .meta { color: var(--muted); font: 10px var(--mono); letter-spacing: .15em; text-transform: uppercase; }
      .worksheet { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--paper-2); color: var(--ink); font-size: 12px; font-weight: 700; }
      .worksheet:hover { background: #eeeae0; }
      .lesson-header { max-width: 900px; }
      .lesson-kicker { display: inline-block; margin-bottom: 18px; padding: 5px 11px; border-radius: 99px; background: var(--teal-soft); color: var(--teal); font: 10px var(--mono); letter-spacing: .17em; text-transform: uppercase; }
      .lesson-summary { max-width: 730px; margin: 24px 0 0; color: var(--muted); font-size: 18px; line-height: 1.7; }
      .concepts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 48px; padding: 26px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
      .concept { display: flex; gap: 12px; }
      .concept-number { color: var(--coral); font: 10px var(--mono); }
      .concept p { margin: 7px 0 0; color: var(--muted); font-size: 13px; line-height: 1.65; }
      .examples-layout { display: grid; grid-template-columns: .78fr 1.22fr; gap: 28px; margin-top: 48px; }
      .sub-label { display: flex; align-items: center; gap: 9px; color: var(--teal); font: 10px var(--mono); letter-spacing: .18em; text-transform: uppercase; }
      .sub-label::before { content: ''; width: 24px; height: 1px; background: currentColor; }
      .examples h2 { margin-top: 12px; font-size: 2.1rem; }
      .example-list { display: grid; gap: 10px; margin-top: 22px; }
      .example { padding: 13px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper-2); box-shadow: 0 5px 14px rgba(32,43,56,.04); font: 17px/1.45 var(--serif); }
      .note-box { padding: 28px; border-radius: 18px; background: #efe8dc; }
      .note-box blockquote { margin: 22px 0 0; font: 600 26px/1.25 var(--serif); }
      .note-box p { margin: 20px 0 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
      .practice { margin-top: 64px; padding-top: 30px; border-top: 1px solid var(--line); }
      .practice-heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; }
      .practice-heading h2 { margin-top: 12px; }
      .answered { color: var(--muted); font: 11px var(--mono); }
      .practice-progress { height: 6px; margin-top: 22px; overflow: hidden; border-radius: 99px; background: var(--line); }
      .practice-progress div { height: 100%; background: var(--teal); transition: width .3s ease; }
      .questions { display: grid; gap: 13px; margin-top: 28px; }
      .question { padding: 18px 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper-2); transition: .2s ease; }
      .question.correct { border-color: rgba(47,136,126,.6); }
      .question.incorrect { border-color: rgba(201,99,75,.65); }
      .question-row { display: flex; gap: 15px; }
      .question-number { color: var(--coral); font: 11px var(--mono); }
      .question-body { min-width: 0; flex: 1; }
      .question-prompt { margin: 0; font-weight: 600; line-height: 1.5; }
      .options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 14px; }
      .option { display: flex; align-items: flex-start; gap: 9px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); cursor: pointer; font-size: 13px; line-height: 1.4; transition: .2s ease; }
      .option:hover { background: #f0ede5; }
      .option.selected { border-color: var(--teal); background: var(--teal-soft); }
      .option input { margin-top: 3px; accent-color: var(--teal); }
      .rationale { margin: 14px 0 0; padding-top: 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; line-height: 1.6; }
      .feedback-row { display: flex; align-items: center; justify-content: space-between; gap: 15px; margin-top: 25px; }
      .feedback { padding: 10px 14px; border-radius: 9px; background: var(--teal-soft); color: var(--teal); font-size: 13px; font-weight: 700; }
      .lesson-nav { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
      .lesson-nav a:hover { color: var(--ink); }
      .lesson-nav small { display: block; margin-bottom: 3px; color: var(--coral); font: 9px var(--mono); letter-spacing: .14em; text-transform: uppercase; }

      .answer-intro { max-width: 750px; }
      .answer-list { display: grid; gap: 10px; margin-top: 44px; }
      .answer-item { border: 1px solid var(--line); border-radius: 12px; background: var(--paper-2); overflow: hidden; }
      .answer-summary { display: flex; align-items: center; gap: 15px; padding: 17px 20px; cursor: pointer; list-style: none; }
      .answer-summary::-webkit-details-marker { display: none; }
      .answer-summary::after { content: '›'; margin-left: auto; color: var(--muted); font-size: 22px; transition: transform .2s ease; }
      .answer-item[open] .answer-summary::after { transform: rotate(90deg); }
      .answer-summary .num { color: var(--coral); font: 11px var(--mono); }
      .answer-summary strong { font: 20px var(--serif); }
      .answer-content { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; padding: 0 20px 20px; border-top: 1px solid var(--line); }
      .answer-content h4 { margin: 18px 0 8px; color: var(--muted); font: 10px var(--mono); letter-spacing: .15em; text-transform: uppercase; }
      .answer-chips { display: flex; flex-wrap: wrap; gap: 7px; }
      .answer-chip { padding: 6px 8px; border-radius: 6px; background: #eeebe3; font: 11px var(--mono); }
      .answer-chip b { margin-right: 4px; color: var(--coral); }
      .answer-content p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }

      .empty { padding: 80px 0; text-align: center; }
      .empty h1 { font-size: 4rem; }
      .empty p { color: var(--muted); }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

      @media (max-width: 1050px) {
        .lesson-grid { grid-template-columns: repeat(3, 1fr); }
        .overview-hero { grid-template-columns: 1fr; }
      }
      @media (max-width: 800px) {
        .sidebar { width: 282px; transform: translateX(-100%); transition: transform .25s ease; }
        .sidebar.open { transform: translateX(0); }
        .content { margin-left: 0; }
        .topbar { padding: 0 20px; }
        .topbar-note { display: none; }
        .mobile-menu { display: inline-block; }
        .page { padding: 30px 20px 55px; }
        .lesson-grid { grid-template-columns: repeat(2, 1fr); }
        .concepts, .examples-layout { grid-template-columns: 1fr; }
        .examples-layout { gap: 25px; }
      }
      @media (max-width: 540px) {
        h1 { font-size: 3.35rem; }
        .lede, .lesson-summary { font-size: 16px; }
        .lesson-grid { grid-template-columns: 1fr; }
        .lesson-top { align-items: flex-start; flex-direction: column; }
        .lesson-top .worksheet { align-self: stretch; justify-content: center; }
        .options, .answer-content { grid-template-columns: 1fr; }
        .feedback-row { align-items: stretch; flex-direction: column; }
        .feedback-row .button { justify-content: center; }
        .lesson-nav { align-items: flex-start; flex-direction: column; }
      }
      @media print {
        .no-print, .sidebar, .topbar, .lesson-nav { display: none !important; }
        .content { margin-left: 0; }
        .page { max-width: none; padding: 18px; }
        body { background: #fff; color: #000; }
        .lesson-kicker, .note-box, .example, .question, .answer-item { break-inside: avoid; }
        .note-box { background: #f3f3f3; }
        .option { color: #000; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      const LESSONS = [
        {
          id: '1', title: 'Infinitives after verbs', kicker: 'Learn the essential forms and functions',
          summary: 'Explore the essential forms and functions of infinitives, -ing forms, and participles in English. Learn how these structures work as subjects, objects, and complements, when infinitives appear with or without to, how perfect infinitives are used, and how to choose between infinitive and -ing forms with confidence.',
          concepts: [['Verb + to-infinitive', 'Choose to + base verb after agree, decide, expect, hope, learn, manage, offer, promise, refuse, seem, and want.'], ['Verb + that-clause', 'Some verbs allow both forms: I expect to win / I expect that I will win.'], ['Negative infinitives', 'Put not before to: She decided not to answer.']],
          examples: ['The committee agreed to publish the findings.', 'I hope to hear from you before Friday.', 'They promised not to disclose the source.', 'The archive seems to contain a missing letter.'],
          questions: [
            ['The visiting scholar ___ to return next spring.', ['promised', 'promised returning', 'promised to return', 'promised that return'], 2, 'Promise is followed by to + base verb.'],
            ['We decided ___ the seminar until October.', ['to postpone', 'postponing', 'postpone', 'to postponing'], 0, 'Decide takes the to-infinitive.'],
            ['Mara hopes ___ the original manuscript.', ['locating', 'to locate', 'locate', 'that locate'], 1, 'Hope + to-infinitive expresses a future intention.'],
            ['The department agreed ___ the access rules.', ['revising', 'revise', 'to revise', 'to revising'], 2, 'Agree takes to + base verb.'],
            ['He refused ___ the confidential notes.', ['to share', 'sharing', 'share', 'to sharing'], 0, 'Refuse is followed by a to-infinitive.'],
            ['They expected ___ on time.', ['arriving', 'arrive', 'to arriving', 'to arrive'], 3, 'Expect + to-infinitive is the compact pattern.'],
            ['I managed ___ the citation before class.', ['to check', 'checking', 'check', 'to checking'], 0, 'Manage is followed by to + base verb.'],
            ['She promised ___ anyone about the change.', ['not tell', 'not to tell', 'to not telling', 'not telling'], 1, 'Not comes before to in a negative infinitive.'],
            ['Which sentence is also possible?', ['I hope that I pass.', 'I hope that pass.', 'I hope passing.', 'I hope to passing.'], 0, 'Hope can be followed by a that-clause as well as an infinitive.'],
            ['The result seems ___ the original hypothesis.', ['support', 'supporting', 'to support', 'to supporting'], 2, 'Seem + to-infinitive links the result to its apparent action.']
          ]
        },
        {
          id: '2', title: 'Verb + object + infinitive', kicker: 'When one person wants, asks, or expects another person to act',
          summary: 'When one person wants, asks, or expects another person to act, English places the object between the main verb and the infinitive.',
          concepts: [['The architecture', 'Verb + object + to-infinitive: She asked him to stay.'], ['Reporting and permission', 'Ask, advise, allow, encourage, expect, invite, remind, teach, tell, and want commonly use this frame.'], ['Bare infinitives', 'Let and make take object + base verb in active clauses; the passive uses to.']],
          examples: ['The tutor encouraged us to question the premise.', 'Please remind me to bring the sources.', 'The editor told the writer to cut the paragraph.', 'The rules let students work in pairs.'],
          questions: [
            ['The lecturer encouraged the class ___ the assumption.', ['question', 'to question', 'questioning', 'to questioning'], 1, 'Encourage + object + to-infinitive.'],
            ['I reminded Theo ___ his pass.', ['bring', 'bringing', 'to bring', 'to bringing'], 2, 'Remind takes an object followed by to + base verb.'],
            ['The dean advised us ___ early.', ['to register', 'registering', 'register', 'to registering'], 0, 'Advise + object + to-infinitive.'],
            ['They allowed visitors ___ photographs.', ['taking', 'take', 'to take', 'to taking'], 2, 'Allow + object + to-infinitive.'],
            ['She wants her assistant ___ the room.', ['to book', 'book', 'booking', 'to booking'], 0, 'Want + object + to-infinitive.'],
            ['The guide told everyone ___ behind the line.', ['stand', 'standing', 'to stand', 'to standing'], 2, 'Tell + object + to-infinitive.'],
            ['The policy lets students ___ recordings.', ['to make', 'making', 'make', 'to making'], 2, 'Let takes object + bare infinitive, without to.'],
            ['The schedule made us ___ late.', ['to work', 'working', 'work', 'to working'], 2, 'Make takes object + bare infinitive in active clauses.'],
            ['“They made him apologize” becomes passive as:', ['He was made apologize.', 'He was made to apologize.', 'He made to apologize.', 'He was making to apologize.'], 1, 'The passive of make restores to.'],
            ['Which sentence assigns the action to a different person?', ['I expected to Nina call.', 'I expected Nina to call.', 'I expected Nina calling.', 'I expected to call Nina.'], 1, 'Nina is the understood subject of to call.']
          ]
        },
        {
          id: '3', title: 'Try and…, go and…, etc.', kicker: 'Informal English with two base verbs',
          summary: 'Informal English sometimes pairs two base verbs with and. These vivid patterns are common in speech, while formal writing usually keeps to.',
          concepts: [['Try and + verb', 'Try and call me later means try to call me later.'], ['Go and + verb', 'Go and see what happened is a lively alternative to go to see what happened.'], ['Register', 'After do, did, and does, use the bare form. In academic prose, prefer the explicit infinitive.']],
          examples: ['Try and find a quieter place to read.', 'Go and ask the librarian for the folio.', 'Come and look at this marginal note.', 'Do try to keep the quotation intact.'],
          questions: [
            ['“Try and call me” means:', ['Try calling me never.', 'Try to call me.', 'Try call me before.', 'Try for calling me.'], 1, 'Try and + verb is informal try to + verb.'],
            ['Go and ___ whether the archive is open.', ['check', 'to check', 'checking', 'checked'], 0, 'Go and takes the base form.'],
            ['Come and ___ beside the window.', ['to sit', 'sitting', 'sit', 'sat'], 2, 'Come and + base verb is natural in conversation.'],
            ['Which is more formal?', ['Try and revise it.', 'Try to revise it.', 'Try revise it.', 'Try revising to it.'], 1, 'Try to revise is the explicit infinitive form.'],
            ['Do ___ patient with the slow scanner.', ['to be', 'being', 'be', 'been'], 2, 'Do + bare infinitive is emphatic.'],
            ['“Go and see” is most at home in:', ['casual conversation', 'a legal heading only', 'a passive clause', 'a noun phrase'], 0, 'The pattern has a conversational register.'],
            ['Choose the correct form after “Did you…”', ['Did you went?', 'Did you to go?', 'Did you go?', 'Did you going?'], 2, 'Do-support takes the base verb.'],
            ['“Come and look” contains:', ['a gerund', 'two coordinated base verbs', 'a passive infinitive', 'a noun complement'], 1, 'And links two base forms.'],
            ['For a formal report, choose:', ['Go and examine the sample.', 'Examine the sample.', 'Go examine and the sample.', 'Go to examining the sample.'], 1, 'The direct imperative is concise and formal.'],
            ['Which sentence is grammatical?', ['Do try to arrive early.', 'Do try arriving early to.', 'Do to try arrive early.', 'Do trying arrive early.'], 0, 'Do + try + to-infinitive is standard.']
          ]
        },
        {
          id: '4', title: '-ing forms after verbs', kicker: 'Gerunds behave like nouns',
          summary: 'Gerunds let an action behave like a noun. After certain verbs, the -ing form is not optional decoration but the required complement.',

                <div class="hero-actions"><a class="button button-primary" href="#lesson/${next.id}">Continue with ${next.id} <span>→</span></a><a class="button button-secondary" href="#answer-key">Read the answer key</a></div>
              </div>
              <div class="stats-card">
                <div class="stats-label">Your studio notes</div>
                <div class="stats-number"><strong>${completed}</strong><span>of 14 lessons<br>completed</span></div>
                <div class="progress-label"><span>Course progress</span><span>${Math.round(completed / 14 * 100)}%</span></div>
                <div class="progress-track"><div class="progress-fill" style="width:${completed / 14 * 100}%"></div></div>
                <div class="stats-foot"><div><strong>${average}<small style="font:15px var(--sans)">%</small></strong><span>average score</span></div><div><strong>140</strong><span>questions</span></div></div>
              </div>
            </section>
            <section class="section-rule">
              <div class="section-heading"><div><p class="section-kicker">The syllabus</p><h2>Fourteen decisions worth noticing.</h2></div><p>Move in order for a slow build, or jump directly to the structure your writing needs today.</p></div>
              <div class="lesson-grid">${LESSONS.map((lesson, index) => {
                const record = progress[lesson.id];
                return `<a class="lesson-card" href="#lesson/${lesson.id}"><div class="card-top"><span class="card-num">${lesson.id}</span>${record?.completed ? '<span class="card-check">✓</span>' : `<span class="card-num">0${index + 1}</span>`}</div><h3>${esc(lesson.title)}</h3><div class="card-bottom"><span>${record?.completed ? `Score ${record.score}%` : '10 questions'}</span><span class="card-arrow">→</span></div></a>`;
              }).join('')}</div>
            </section>
            <section class="section-rule" style="margin-top:64px"><div class="section-heading"><div><p class="section-kicker">How to use the lab</p><h2>Read. Compare. Choose.</h2></div></div><div class="lesson-grid" style="grid-template-columns:repeat(3,1fr)"><div><span class="card-num">01</span><h3 style="margin-top:16px">Read the pattern</h3><p style="color:var(--muted);font-size:13px">Each lesson starts with the small rule that changes the sentence.</p></div><div><span class="card-num">02</span><h3 style="margin-top:16px">Compare the meaning</h3><p style="color:var(--muted);font-size:13px">Examples put the form in a real academic context.</p></div><div><span class="card-num">03</span><h3 style="margin-top:16px">Make the call</h3><p style="color:var(--muted);font-size:13px">Ten questions turn recognition into a choice you can trust.</p></div></div></section>
          </main>
        `);
      }

      function renderLesson(lesson) {
        answers = {};
        submitted = false;
        const saved = progress[lesson.id];
        renderShell(`
          <main class="page">
            <div class="lesson-top no-print"><span class="meta">Lesson ${lesson.id} &nbsp;/&nbsp; ${LESSONS.findIndex((item) => item.id === lesson.id) + 1} of 14</span><button class="worksheet" onclick="window.print()">⇩&nbsp; Download worksheet PDF</button></div>
            <article id="lesson-print">
              <header class="lesson-header"><div class="lesson-kicker">${esc(lesson.kicker)}</div><h1>${esc(lesson.title)}</h1><p class="lesson-summary">${esc(lesson.summary)}</p></header>
              <section class="concepts">${lesson.concepts.map((concept, index) => `<div class="concept"><span class="concept-number">0${index + 1}</span><div><h3 style="font-family:var(--sans);font-size:15px;letter-spacing:0">${esc(concept[0])}</h3><p>${esc(concept[1])}</p></div></div>`).join('')}</section>
              <section class="examples-layout"><div class="examples"><div class="sub-label">In the margin</div><h2>Notice the shape.</h2><div class="example-list">${lesson.examples.map((example) => `<div class="example">${esc(example)}</div>`).join('')}</div></div><div class="note-box"><div class="sub-label">A note for writers</div><blockquote>Grammar is not a fence around meaning. It is the lens that tells your reader where to look.</blockquote><p>Read each example twice. On the second pass, ask what changed when the form changed: time, agency, purpose, or simply the speaker’s attitude.</p></div></section>
              <section class="practice" id="practice"><div class="practice-heading"><div><div class="sub-label" style="color:var(--coral)">Practice set</div><h2>Make the form do its work.</h2></div><span class="answered" id="answered-count">0 / 10 answered</span></div><div class="practice-progress"><div id="practice-fill" style="width:0%"></div></div><div class="questions">${lesson.questions.map((question, index) => `<div class="question" id="question-${index}"><div class="question-row"><span class="question-number">${String(index + 1).padStart(2, '0')}</span><div class="question-body"><p class="question-prompt">${esc(question[0])}</p><div class="options">${question[1].map((option, optionIndex) => `<label class="option" id="option-${index}-${optionIndex}"><input type="radio" name="question-${lesson.id}-${index}" value="${optionIndex}" onchange="chooseAnswer(${index},${optionIndex})"><span>${esc(option)}</span></label>`).join('')}</div><div class="rationale" id="rationale-${index}" hidden></div></div></div></div>`).join('')}</div><div class="feedback-row no-print"><div id="feedback">${saved?.completed ? `<div class="feedback">Previous score: ${saved.score}% — you can submit a new attempt.</div>` : ''}</div><button class="button button-primary" id="submit-button" onclick="submitLesson('${lesson.id}')" disabled>Submit answers <span>✓</span></button></div></section>
            </article>
            <nav class="lesson-nav no-print"><a href="#lesson/${LESSONS[Math.max(0, LESSONS.findIndex((item) => item.id === lesson.id) - 1)].id}"><small>Previous</small>${LESSONS[Math.max(0, LESSONS.findIndex((item) => item.id === lesson.id) - 1)].title}</a><a style="text-align:right" href="#lesson/${LESSONS[Math.min(LESSONS.length - 1, LESSONS.findIndex((item) => item.id === lesson.id) + 1)].id}"><small>Next</small>${LESSONS[Math.min(LESSONS.length - 1, LESSONS.findIndex((item) => item.id === lesson.id) + 1)].title}</a></nav>
          </main>
        `);
        window.scrollTo(0, 0);
      }

      function renderAnswerKey() {
        renderShell(`
          <main class="page">
            <div class="answer-intro"><div class="eyebrow" style="color:var(--coral)">Reference desk</div><h1 style="margin-top:30px">Final answer<br><span class="accent-text">key.</span></h1><p class="lede">A compact map back through the chapter. Use the rationale to understand the decision, not just to mark a box.</p></div>
            <div class="answer-list">${LESSONS.map((lesson) => `<details class="answer-item"><summary class="answer-summary"><span class="num">${lesson.id}</span><strong>${esc(lesson.title)}</strong></summary><div class="answer-content"><div><h4>Answers in order</h4><div class="answer-chips">${lesson.questions.map((question, index) => `<span class="answer-chip"><b>${index + 1}.</b>${String.fromCharCode(65 + question[2])}</span>`).join('')}</div></div><div><h4>Core idea</h4><p>${esc(lesson.summary)}</p></div></div></details>`).join('')}</div>
          </main>
        `);
      }

      function chooseAnswer(index, value) {
        answers[index] = value;
        document.querySelectorAll(`#question-${index} .option`).forEach((option, optionIndex) => option.classList.toggle('selected', optionIndex === value));
        const answered = Object.keys(answers).length;
        document.getElementById('answered-count').textContent = `${answered} / 10 answered`;
        document.getElementById('practice-fill').style.width = `${answered * 10}%`;
        document.getElementById('submit-button').disabled = answered < 10;
      }

      function submitLesson(id) {
        const lesson = LESSONS.find((item) => item.id === id);
        let correct = 0;
        lesson.questions.forEach((question, index) => {
          const questionElement = document.getElementById(`question-${index}`);
          const isCorrect = answers[index] === question[2];
          correct += isCorrect ? 1 : 0;
          questionElement.classList.toggle('correct', isCorrect);
          questionElement.classList.toggle('incorrect', !isCorrect);
          const rationale = document.getElementById(`rationale-${index}`);
          rationale.hidden = false;
          rationale.innerHTML = `<strong style="color:${isCorrect ? 'var(--teal)' : 'var(--coral)'}">${isCorrect ? 'Correct.' : 'Review.'}</strong> ${esc(question[3])}`;
        });
        const score = Math.round(correct / 10 * 100);
        progress[id] = { score, completed: true };
        saveProgress();
        document.getElementById('feedback').innerHTML = `<div class="feedback">${score}% · ${score >= 80 ? 'A confident reading.' : score >= 60 ? 'A useful first pass.' : 'Return to the examples and try again.'}</div>`;
        document.getElementById('submit-button').textContent = 'Update score ✓';
        submitted = true;
        document.getElementById('feedback').scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      function openSidebar() { sidebarOpen = true; document.getElementById('sidebar')?.classList.add('open'); }
      function closeSidebar() { sidebarOpen = false; document.getElementById('sidebar')?.classList.remove('open'); }

      function render() {
        const hash = currentHash();
        const lesson = currentLesson();
        if (lesson) renderLesson(lesson);
        else if (hash === 'answer-key') renderAnswerKey();
        else if (hash === 'overview') renderOverview();
        else { navigate('overview'); return; }
      }

      window.addEventListener('hashchange', render);
      render();
    </script>
  </body>
</html>
