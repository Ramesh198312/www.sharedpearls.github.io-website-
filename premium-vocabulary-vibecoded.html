        function playBritishAudio(wordText) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(wordText);
                utterance.lang = 'en-GB'; 
                utterance.rate = 0.9; 
                utterance.pitch = 1.0;

                const voices = window.speechSynthesis.getVoices();
                const britishVoice = voices.find(voice => voice.lang === 'en-GB' || voice.name.includes('UK English'));
                if (britishVoice) utterance.voice = britishVoice;

                window.speechSynthesis.speak(utterance);

                const btnIcon = document.getElementById('audio-icon');
                if(btnIcon) {
                    btnIcon.classList.remove('ph-speaker-high');
                    btnIcon.classList.add('ph-speaker-high', 'text-gold', 'animate-pulse');
                    utterance.onend = () => {
                        btnIcon.classList.remove('text-gold', 'animate-pulse');
                        btnIcon.classList.add('ph-speaker-high');
                    };
                }
            } else {
                alert("Text-to-Speech is not supported in this browser.");
            }
        }

        window.speechSynthesis.onvoiceschanged = function() {
            window.speechSynthesis.getVoices();

        function generateTierCard(level, title, colors, iconColor, count) {
            return `
                <div onclick="navigate('level', '${level}')" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:shadow-xl hover:-translate-y-1 transition cursor-pointer group">
                    <div class="w-12 h-12 rounded-xl ${colors} flex items-center justify-center font-bold text-xl mb-4 border">
                        ${level}
                    </div>
                    <h3 class="font-bold text-slate-800 text-lg group-hover:text-oxford transition">${title}</h3>
                    <p class="text-slate-500 text-sm mt-1">${count} words categorized</p>
                </div>
            `;
        }

        function renderLevelView(container, level) {
            const words = vocabData[level] || [];
            currentActiveWord = words[0]; 

            container.innerHTML = `
                <div class="fade-in h-full flex flex-col md:flex-row gap-8 max-w-7xl mx-auto">
                    <div class="w-full md:w-80 flex flex-col h-[40vh] md:h-full shrink-0">
                        <div class="bg-white rounded-t-2xl border border-slate-200 p-4 border-b-0 shadow-sm z-10 flex justify-between items-center">
                            <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">${words.length} Words Found</span>
                        </div>
                        <div class="bg-white border border-slate-200 rounded-b-2xl shadow-sm flex-1 overflow-y-auto custom-scroll p-2" id="word-list">
                            ${words.map(w => `
                                <button onclick="selectWord('${w.id}', '${level}')" id="btn-${w.id}" class="w-full text-left p-4 rounded-xl mb-1 transition-all ${w.id === currentActiveWord.id ? 'bg-oxford text-white shadow-md' : 'hover:bg-slate-50 text-slate-700'}">
                                    <div class="font-serif font-bold text-lg">${w.word}</div>
                                    <div class="text-xs mt-1 ${w.id === currentActiveWord.id ? 'text-white/70' : 'text-slate-400'} uppercase tracking-wider font-semibold">${w.pos}</div>
                                </button>
                            `).join('')}
                        </div>
                    </div>

                    <div class="flex-1 h-full overflow-y-auto pb-10 custom-scroll pr-2" id="word-detail-container">
                        </div>
                </div>
            `;
            
            if(currentActiveWord) {
                renderWordDetail(currentActiveWord);
            }
        }

        function selectWord(wordId, level) {
            const words = vocabData[level];
            currentActiveWord = words.find(w => w.id === wordId);
            
            document.querySelectorAll('#word-list button').forEach(btn => {
                btn.className = "w-full text-left p-4 rounded-xl mb-1 transition-all hover:bg-slate-50 text-slate-700";
                btn.querySelector('div:last-child').className = "text-xs mt-1 text-slate-400 uppercase tracking-wider font-semibold";
            });
            const activeBtn = document.getElementById(`btn-${wordId}`);
            activeBtn.className = "w-full text-left p-4 rounded-xl mb-1 transition-all bg-oxford text-white shadow-md";
            activeBtn.querySelector('div:last-child').className = "text-xs mt-1 text-white/70 uppercase tracking-wider font-semibold";

            renderWordDetail(currentActiveWord);
        }

        function renderWordDetail(wordObj) {
            const container = document.getElementById('word-detail-container');
            
            const highlightWord = (phrase, target) => {
                const regex = new RegExp(`(${target})`, 'gi');
                return phrase.replace(regex, `<span class="font-bold text-oxford">$1</span>`);
            };

            container.innerHTML = `
                <div class="bg-white rounded-3xl shadow-xl border border-slate-200 overflow-hidden fade-in relative">
                    <div class="bg-oxford p-10 relative overflow-hidden">
                        <div class="absolute right-0 top-0 opacity-10 transform translate-x-1/4 -translate-y-1/4">
                            <i class="ph-fill ph-quotes text-9xl"></i>
                        </div>
                        <div class="relative z-10 flex justify-between items-start">
                            <div>
                                <h2 class="text-5xl font-serif font-bold text-white mb-3 tracking-wide flex items-baseline gap-4">
                                    ${wordObj.word}
                                    ${wordObj.ph ? `<span class="text-2xl font-sans text-gold/80 font-normal tracking-normal">${wordObj.ph}</span>` : ''}
                                </h2>
                                <div class="flex flex-wrap items-center gap-3">
                                    <span class="bg-gold/20 text-gold border border-gold/30 px-3 py-1 rounded-md text-sm font-bold uppercase tracking-wider shadow-sm">
                                        ${wordObj.pos}
                                    </span>
                                    <span class="text-white/70 text-sm font-medium border-l border-white/20 pl-3">
                                        ${wordObj.form}
                                    </span>
                                </div>
                            </div>
                            <button onclick="playBritishAudio('${wordObj.word}')" class="bg-white hover:bg-slate-100 text-oxford w-16 h-16 rounded-full flex items-center justify-center shadow-2xl transition transform hover:scale-105 group border-2 border-transparent hover:border-gold">
                                <i id="audio-icon" class="ph-fill ph-speaker-high text-3xl group-hover:text-oxford transition"></i>
                            </button>
                        </div>
                    </div>

                    <div class="p-10">
                        <div class="mb-10">
                            <h3 class="text-sm font-bold uppercase tracking-widest text-slate-400 mb-3">Definition</h3>
                            <p class="text-2xl font-serif text-slate-800 leading-relaxed border-l-4 border-gold pl-6 py-1 bg-gradient-to-r from-gold/5 to-transparent rounded-r-xl">
                                ${wordObj.meaning}
                            </p>
                            ${wordObj.synonyms || wordObj.origin ? `
                                <div class="mt-6 pl-6 flex flex-wrap gap-4">
                                    ${wordObj.synonyms ? `<div class="bg-slate-50 border border-slate-200 px-4 py-2 rounded-lg shadow-sm"><span class="font-bold text-slate-400 uppercase tracking-widest text-xs block mb-1">Synonyms</span><span class="text-slate-700 font-medium text-sm">${wordObj.synonyms}</span></div>` : ''}
                                    ${wordObj.origin ? `<div class="bg-slate-50 border border-slate-200 px-4 py-2 rounded-lg shadow-sm"><span class="font-bold text-slate-400 uppercase tracking-widest text-xs block mb-1">Origin</span><span class="text-slate-700 font-medium text-sm">${wordObj.origin}</span></div>` : ''}
                                </div>
                            ` : ''}
                        </div>

                        <div class="mb-10">
                            <h3 class="text-sm font-bold uppercase tracking-widest text-slate-400 mb-3">Contextual Example</h3>
                            <div class="bg-slate-50 rounded-2xl p-6 border border-slate-100 text-lg text-slate-700 italic flex gap-4">
                                <i class="ph-fill ph-quotes text-gold text-2xl shrink-0 mt-1"></i>
                                <span>"${wordObj.example}"</span>
                            </div>
                        </div>

                        <div>
                            <h3 class="text-sm font-bold uppercase tracking-widest text-slate-400 mb-4 flex items-center gap-2">
                                <i class="ph-fill ph-link text-lg"></i> Natural Collocations
                            </h3>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                ${wordObj.collocations.map(col => `
                                    <div class="bg-white border border-slate-200 rounded-xl p-4 flex items-center justify-center text-center shadow-sm hover:border-oxford/30 transition cursor-default">
                                        <span class="font-medium text-slate-800">${highlightWord(col, wordObj.word)}</span>
                                    </div>
                                `).join('')}
                            </div>
                            <p class="text-xs text-slate-400 mt-4 text-center">Collocations are words that naturally go together in native British English.</p>
                        </div>
                    </div>
                </div>
            `;
        }

        document.getElementById('global-search').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            if (!term) return;
            for (const level in vocabData) {
                const found = vocabData[level].find(w => w.word.toLowerCase().includes(term));
                if (found) {
                    navigate('level', level);
                    setTimeout(() => selectWord(found.id, level), 50);
                    return;
                }
            }
        });

        // -------------------------------------------------------------
        // ROBUST INITIALIZATION ENGINE FOR COURSE PLATFORMS/SPAs
        // -------------------------------------------------------------
        function initApp() {
            // Guarantee Tailwind fallback loading if CDN hasn't executed
            if (typeof tailwind === 'undefined') {
                let script = document.createElement('script');
                script.src = 'https://cdn.tailwindcss.com';
                document.head.appendChild(script);
            }
            
            // Safety check: wait until our specific container is actually painted in the DOM
            if (!document.getElementById('content-container')) {
                setTimeout(initApp, 50);
                return;
            }
            
            navigate('dashboard');
        }

        // 1. If DOM is already fully loaded (e.g., Soft-Routing), fire immediately
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            initApp();
        } 
        // 2. If it's a hard page refresh, bind to standard browser events
        else {
            document.addEventListener('DOMContentLoaded', initApp);
            window.addEventListener('load', initApp);
        }
    </script>
</body>
</html>
