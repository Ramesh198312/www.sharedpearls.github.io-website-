        let state = {
            currentIdx: 0,
            score: 0,
            solved: []
        };

        function showDashboard() {
            document.getElementById('view-dashboard').classList.remove('hidden');
            document.getElementById('view-riddle').classList.add('hidden');
        }

        function startRiddles() {
            document.getElementById('view-dashboard').classList.add('hidden');
            document.getElementById('view-riddle').classList.remove('hidden');
            renderRiddle();
        }

        function renderRiddle() {
            const riddle = riddleData[state.currentIdx];
            if (!riddle) {
                document.getElementById('riddle-container').innerHTML = `<h2 class='text-center text-2xl font-serif'>Congratulations! You've mastered all 50 riddles. Your final score is ${state.score}.</h2><button onclick="location.reload()" class='block mx-auto mt-6 bg-[#8B4513] text-white px-8 py-3 rounded'>Restart Vault</button>`;
                return;
            }
            document.getElementById('riddle-text').innerText = riddle.text;
            document.getElementById('user-answer').value = "";
            document.getElementById('feedback').className = "mt-8 hidden p-4 rounded text-center font-semibold";
            document.getElementById('clue-box').classList.add('hidden'); 
            updateUI();
        }

        function checkAnswer() {
            const userAns = document.getElementById('user-answer').value.trim().toLowerCase();
            const correct = riddleData[state.currentIdx].answer.toLowerCase();
            const feedback = document.getElementById('feedback');

            if (userAns === correct) {
                state.score += 20;
                state.solved.push(riddleData[state.currentIdx].id);
                feedback.innerText = "Correct! Well done.";
                feedback.className = "mt-8 p-4 rounded text-center font-semibold bg-green-100 text-green-800";
                setTimeout(nextRiddle, 1500);
            } else {
                feedback.innerText = "Not quite, keep thinking!";
                feedback.className = "mt-8 p-4 rounded text-center font-semibold bg-red-100 text-red-800";
            }
            feedback.classList.remove('hidden');
            updateUI();
        }

        function showClue() {
            const riddle = riddleData[state.currentIdx];
            state.score = Math.max(0, state.score - 5);
            document.getElementById('clue-text').innerText = riddle.clue;
            document.getElementById('clue-box').classList.remove('hidden');
            updateUI();
        }

        function nextRiddle() {
            state.currentIdx++;
            renderRiddle();
        }

        function updateUI() {
            document.getElementById('current-score').innerText = state.score;
            document.getElementById('solved-count').innerText = state.solved.length;
            const progress = (state.solved.length / riddleData.length) * 100;
            document.getElementById('progress-bar-main').style.width = `${progress}%`;
        }
    </script>
