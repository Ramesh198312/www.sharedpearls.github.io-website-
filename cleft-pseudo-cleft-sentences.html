    {
      "id": 7,
      "code": "Module 07",
      "title": "Extended Focus Structures and Related Constructions",
      "cefr": "B2–C1",
      "summary": "Lexical head identifying constructions (The thing that..., The reason why..., The person who..., The place where..., The time when..., The way...), relative-clause distinctions, and comparing clefting with topicalisation/fronting, inversion, and introductory-it pattern.",
      "modelSentence": "The reason the project failed was that the estimates were inaccurate.",
      "learningObjectives": [
        "Construct extended identifying focus sentences using general head nouns (\"The person who...\", \"The reason (why)...\", \"The thing that...\", \"The place where...\", \"The way (in which)...\").",
        "Distinguish identifying focus constructions from ordinary modifying relative clauses.",
        "Avoid the ungrammatical double-causal error (\"*The reason why ... is because...\").",
        "Compare clefts systematically with fronting (topicalisation), negative/locative inversion, and introductory-it pattern."
      ],
      "foundationalCautions": [
        "Not every sentence containing a relative clause is a cleft or identifying construction (\"The person who called left a message\" is an ordinary clause with a modifying relative clause, not an identifying equation).",
        "Distinguish conversational discourse markers (\"The thing is, we’re late\") from structural identifying focus constructions (\"The thing that matters is accuracy\")."
      ],
      "subsections": [
        {
          "id": "m7-s1",
          "code": "7.1",
          "title": "Lexical Head Identifying Constructions (The Person Who, The Reason Why, The Thing That)",
          "cefr": "B2",
          "definition": "Because basic what-clefts cannot normally focus people (*\"Who called was Maya\"), places, or reasons directly with \"what\", English uses general lexical head nouns—such as \"the person (who)\", \"the thing (that)\", \"the reason (why/that)\", \"the place (where)\", \"the time (when)\", and \"the way (in which)\"—as the subject of an identifying copular clause.",
          "formationPattern": "[The person who / The reason (why/that) / The thing that / The place where + Relative Clause] + [is / was] + [Focused Complement]",
          "meaningAndPresupposition": "These constructions work just like what-clefts: the initial noun phrase + relative clause establishes a presupposed open variable (\"someone\", \"some reason\", \"some place\"), and the complement after \"be\" identifies its specific value.",
          "whenAppropriate": "Essential when you want the end-focus rhythm of a pseudo-cleft for a human agent (\"The person who designed the bridge was Brunel\"), a cause (\"The reason the project failed was that...\"), or a method (\"The way they solved the issue was by...\").",
          "examples": [
            {
              "sentence": "The reason the project failed was that the cost estimates were inaccurate.",
              "ordinaryEquivalent": "The project failed because the cost estimates were inaccurate.",
              "focusedConstituent": "that the cost estimates were inaccurate (Causal Complement Clause)",
              "presupposedProposition": "The project failed for some reason.",
              "pragmaticPurpose": "Formal causal identification using \"that\" (not *\"because\") after \"was\"."
            },
            {
              "sentence": "The person who first identified the virus was a clinical virologist.",
              "ordinaryEquivalent": "A clinical virologist first identified the virus.",
              "focusedConstituent": "a clinical virologist",
              "presupposedProposition": "Someone first identified the virus.",
              "pragmaticPurpose": "Provides end-focus for a human agent where a what-cleft cannot be used."
            },
            {
              "sentence": "The thing that impressed the examiners most was her clarity of argument.",
              "ordinaryEquivalent": "Her clarity of argument impressed the examiners most.",
              "focusedConstituent": "her clarity of argument",
              "presupposedProposition": "Something impressed the examiners most.",
              "pragmaticPurpose": "Explicit noun-headed alternative to \"What impressed the examiners most...\"."
            },
            {
              "sentence": "The place where the treaty was drafted is now a public museum.",
              "ordinaryEquivalent": "The treaty was drafted in a building that is now a public museum.",
              "focusedConstituent": "now a public museum (or reversed: \"This museum is the place where...\")",
              "presupposedProposition": "The treaty was drafted in a specific place.",
              "pragmaticPurpose": "Locative focus using \"the place where\"."
            },
            {
              "sentence": "The way in which the data are collected determines their reliability.",
              "ordinaryEquivalent": "How the data are collected determines their reliability.",
              "focusedConstituent": "manner/method of collection",
              "presupposedProposition": "Data are collected in some way.",
              "pragmaticPurpose": "Formal academic expression of manner (\"The way in which...\")."
            }
          ],
          "contextualComparisons": [
            {
              "context": "Comparing \"The thing is...\" (discourse marker) vs \"The thing that matters is...\" (identifying focus)",
              "ordinaryForm": "We do not have enough chairs for the guests.",
              "cleftForm": "The thing that matters most is that every guest has a seat.",
              "alternativeForm": "The thing is, we do not have enough chairs for the guests.",
              "comparisonNote": "\"The thing is, ...\" has no relative clause; it is an informal conversational preface introducing a problem. \"The thing that matters is...\" is a complete grammatical identifying construction."
            }
          ],
          "learnerErrors": [
            {
              "incorrectOrAwkward": "The reason why the project failed was because the estimates were inaccurate.",
              "status": "Non-idiomatic",
              "correctedVersion": "The reason (why) the project failed was that the estimates were inaccurate.",
              "diagnosticExplanation": "In formal written British English, avoid \"The reason ... is/was because ...\". Because \"The reason\" is a noun requiring a nominal complement, use a that-clause (\"was that...\") or a noun phrase (\"was the inaccuracy of the estimates\")."
            },
            {
              "incorrectOrAwkward": "The way how they solved the problem was ingenious.",
              "status": "Ungrammatical",
              "correctedVersion": "The way (that / in which) they solved the problem was ingenious. / How they solved the problem was ingenious.",
              "diagnosticExplanation": "Standard English never combines the head noun \"the way\" with the relative adverb \"how\" (*\"the way how\"). Use \"the way (that)\", \"the way in which\", or headless \"how\"."
            }
          ],
          "restrictionsAndExceptions": [
            "Formal Rule for \"The reason\": Follow \"The reason (why/that) ... is/was\" with \"that + clause\" or a noun phrase, not \"because\".",
            "Never write *\"the way how\" in standard English."
          ],
          "guidedPractice": {
            "taskTitle": "Reworking Causal and Personal Explanations",
            "instructions": "Rewrite each ordinary sentence using an appropriate lexical head construction.",
            "items": [

              }
            ]
          },
          "followUpQuestions": [
            {
              "id": "m7-s1-q1",
              "role": "Interpretation",
              "type": "mcq",
              "prompt": "Is every sentence containing a relative clause a cleft or identifying focus construction? Why or why not?",
              "options": [
                "No. In \"The person who called left a message\", the relative clause merely modifies the subject of an action verb (\"left\"); an identifying focus construction requires a copular equation (\"The person who called was the dean\").",
                "Yes. Every sentence with \"who\", \"which\", or \"that\" is a cleft sentence.",
                "Yes, if the verb is in the past tense.",
                "No, because relative clauses are never used in focus structures."
              ],
              "correctAnswer": "No. In \"The person who called left a message\", the relative clause merely modifies the subject of an action verb (\"left\"); an identifying focus construction requires a copular equation (\"The person who called was the dean\").",
              "explanation": "An ordinary modifying relative clause restricts a noun inside a normal predicate (\"left a message\"), whereas a pseudo-cleft/identifying construction equates two halves across the copula \"be\"."
            },
            {
              "id": "m7-s1-q2",
              "role": "Construction",
              "type": "rewrite",
              "prompt": "Rework the causal explanation “The bridge was closed because the river had flooded” using “The reason...” in formal academic style.",
              "correctAnswer": "The reason the bridge was closed was that the river had flooded.",
              "acceptableAlternatives": [
                "The reason why the bridge was closed was that the river had flooded.",
                "The reason that the bridge was closed was that the river had flooded."
              ],
              "explanation": "Formal style pairs \"The reason (why/that) [clause] was\" with a nominal \"that\"-clause (\"that the river had flooded\"), avoiding redundant \"because\"."
            },
            {
              "id": "m7-s1-q3",
              "role": "Recognition",
              "type": "mcq",
              "prompt": "Distinguish “The thing is, the train has been cancelled” from “The thing that disrupted the conference was the train cancellation”.",
              "options": [
                "The first uses \"The thing is\" as a fixed conversational discourse marker without a relative clause, whereas the second is a full identifying focus construction with a restrictive relative clause (\"that disrupted the conference\").",
                "The first is more formal than the second.",
                "The second is ungrammatical in written English.",
                "Both sentences have identical grammatical structures."
              ],
              "correctAnswer": "The first uses \"The thing is\" as a fixed conversational discourse marker without a relative clause, whereas the second is a full identifying focus construction with a restrictive relative clause (\"that disrupted the conference\").",
              "explanation": "Discourse-marker \"The thing is...\" introduces a whole statement in speech; \"The thing that [V] is [X]\" is a syntactic cousin of the what-cleft."
            }
          ]
        },
        {
          "id": "m7-s2",
          "code": "7.2",
          "title": "Comparing Clefting with Fronting (Topicalisation) and Inversion",
          "cefr": "C1",
          "definition": "English also achieves marked information packaging through single-clause reordering: Fronting/Topicalisation (moving an object or complement to initial position without inversion: \"This issue we have already resolved\") and Inversion (placing an auxiliary or main verb before the subject after negative/restrictive adverbials or locative expressions: \"Rarely have we seen such accuracy\").",
          "formationPattern": "Fronting: [Object/Complement + Subject + Verb] | Negative Inversion: [Negative/Restrictive Phrase + Aux + Subject + Verb] | It-cleft: [It + be + X + that + Clause]",
          "meaningAndPresupposition": "Fronting keeps the clause as a single finite unit and establishes a contrast or tight cohesive link with the previous sentence. Negative inversion (\"Not only did the sensor fail...\", \"Only later did they realise...\") intensifies rhetorical force without splitting the clause in two.",
          "whenAppropriate": "Choose fronting when contrasting two parallel items across adjacent sentences (\"The hardware we could salvage; the data we lost\"). Choose negative inversion in formal persuasive prose; choose an it-cleft when you want explicit identification without literary inversion.",
          "examples": [
            {
              "sentence": "Fronting: The preliminary figures we can release today; the full audit we must hold until Friday.",
              "ordinaryEquivalent": "We can release the preliminary figures today; we must hold the full audit until Friday.",
              "focusedConstituent": "The preliminary figures / the full audit (Contrastive Topics)",
              "presupposedProposition": "Both sets of documents are awaiting release decisions.",
              "pragmaticPurpose": "Creates balanced parallel contrast across two clauses without adding cleft verbs."
            },
            {
              "sentence": "Negative Inversion: Only after the third trial did the pattern become clear.",
              "ordinaryEquivalent": "The pattern became clear only after the third trial.",
              "focusedConstituent": "Only after the third trial",
              "presupposedProposition": "The pattern eventually became clear.",
              "pragmaticPurpose": "Single-clause rhetorical counterpart to \"It was only after the third trial that the pattern became clear\"."
            },
            {
              "sentence": "Locative Inversion: Opposite the library stands the original seventeenth-century observatory.",
              "ordinaryEquivalent": "The original seventeenth-century observatory stands opposite the library.",
              "focusedConstituent": "the original seventeenth-century observatory (End-focus via locative inversion)",
              "presupposedProposition": "The library has already been mentioned in the description.",
              "pragmaticPurpose": "Guides the reader’s visual perspective smoothly from a known landmark to a new one."
            },
            {
              "sentence": "Cleft Counterpart: It was only after the third trial that the pattern became clear.",
              "ordinaryEquivalent": "The pattern became clear only after the third trial.",
              "focusedConstituent": "only after the third trial",
              "presupposedProposition": "The pattern became clear at some point.",
              "pragmaticPurpose": "Achieves the same restrictive time focus via a two-clause cleft rather than auxiliary inversion."
            }
          ],
          "contextualComparisons": [
            {
              "context": "Comparing \"Only when...\" in Inversion vs It-cleft",
              "ordinaryForm": "We understood the scale of the problem only when the floodwaters receded.",
              "cleftForm": "It-cleft: It was only when the floodwaters receded that we understood the scale of the problem.",
              "alternativeForm": "Inversion: Only when the floodwaters receded did we understand the scale of the problem.",
              "comparisonNote": "In the inversion, \"did we understand\" inverts in the main clause. In the it-cleft, \"that we understood\" keeps normal declarative order because \"It was\" already provides the main-clause verb."
            }
          ],
          "learnerErrors": [
            {
              "incorrectOrAwkward": "It was only when the floodwaters receded did we understand the problem.",
              "status": "Ungrammatical",
              "correctedVersion": "It was only when the floodwaters receded that we understood the problem. / Only when the floodwaters receded did we understand the problem.",
              "diagnosticExplanation": "Hybrid error: do not blend an it-cleft (\"It was only when...\") with negative auxiliary inversion (\"...did we understand\"). Choose one construction or the other."
            }
          ],
          "restrictionsAndExceptions": [
            "Never combine \"It was only...\" with \"did + subject + verb\" instead of \"that + subject + verb\".",
            "Object fronting (\"This proposal the committee rejected\") does NOT invert subject and verb, whereas negative fronting (\"Not a single proposal did the committee accept\") DOES require auxiliary inversion."
          ],
          "guidedPractice": {
            "taskTitle": "Converting Between Negative Inversion and It-clefts",
            "instructions": "Rewrite each inverted sentence as an equivalent it-cleft, removing the auxiliary inversion.",
            "items": [
              {
                "prompt": "Inverted: Only by cross-checking the logs did the engineers locate the bug.",
                "targetFocus": "only by cross-checking the logs",
                "modelAnswer": "It was only by cross-checking the logs that the engineers located the bug.",
                "commentary": "Replaces \"did the engineers locate\" with \"that the engineers located\"."
              }
            ]
          },
          "followUpQuestions": [
            {
              "id": "m7-s2-q1",
              "role": "Recognition",
              "type": "mcq",
              "prompt": "Classify the grammatical construction of: “The hardware we replaced immediately; the cabling we left intact.”",
              "options": [
                "Object fronting (topicalisation) across parallel single clauses without subject–verb inversion.",
                "An it-cleft sentence.",
                "A reversed pseudo-cleft.",
                "Negative adverbial inversion."
              ],
              "correctAnswer": "Object fronting (topicalisation) across parallel single clauses without subject–verb inversion.",
              "explanation": "The direct objects (\"The hardware\", \"the cabling\") have been moved to the front of their respective clauses while keeping normal Subject–Verb order (\"we replaced\", \"we left\")."
            },
            {
              "id": "m7-s2-q2",
              "role": "Construction",
              "type": "rewrite",
              "prompt": "Transform the negative inversion “Not until the audit ended did the board discover the shortfall” into an accurate it-cleft.",
              "correctAnswer": "It was not until the audit ended that the board discovered the shortfall.",
              "explanation": "Introduces the focus with \"It was not until the audit ended\" and converts the inverted main clause \"did the board discover\" into the declarative subordinate clause \"that the board discovered\"."
            },
            {
              "id": "m7-s2-q3",
              "role": "Interpretation",
              "type": "mcq",
              "prompt": "Why is “*It was only after the meeting did she explain her decision” ungrammatical?",
              "options": [
                "Because it illegally blends two separate constructions—an it-cleft (\"It was only after X that...\") and negative adverbial inversion (\"Only after X did she...\").",
                "Because \"after the meeting\" is a place phrase.",
                "Because \"explain\" is an irregular verb.",
                "Because \"only\" cannot precede a preposition."
              ],
              "correctAnswer": "Because it illegally blends two separate constructions—an it-cleft (\"It was only after X that...\") and negative adverbial inversion (\"Only after X did she...\").",
              "explanation": "In an it-cleft, the second clause must be introduced by \"that\" with declarative word order (\"that she explained her decision\")."
            }
          ]
        },
        {
          "id": "m7-s3",
          "code": "7.3",
          "title": "Clefting versus Introductory-It Pattern and Selecting the Optimal Focus Strategy",
          "cefr": "C1",
          "definition": "Introductory-It Pattern uses dummy \"it\" to postpone a heavy clausal subject or object to the end of the sentence (\"It is clear that the policy works\" ← \"That the policy works is clear\"). Although both introductory-it pattern and it-clefts begin with \"It + be ... that\", their syntax and discourse functions are completely distinct.",
          "formationPattern": "Introductory-It Pattern: [It + be + Adjective/NP Predicate + that-clause / to-infinitive] (NO gap inside the that-clause) vs It-cleft: [It + be + Extracted Constituent + that/who + Clause with Gap]",
          "meaningAndPresupposition": "In introductory-it pattern (\"It surprised us that the results arrived yesterday\"), the that-clause is complete in itself (\"the results arrived yesterday\" has no missing constituent) and states the proposition being evaluated as surprising. In an it-cleft (\"It was yesterday that the results arrived\"), \"yesterday\" has been extracted from inside the subordinate clause.",
          "whenAppropriate": "Use introductory-it pattern when evaluating a whole proposition (\"It is vital that...\", \"It appears that...\"). Use clefting only when isolating a specific constituent or proposition for narrow identification or contrast.",
          "examples": [
            {
              "sentence": "Introductory-It Pattern: It is remarkable that the manuscript survived the fire.",
              "ordinaryEquivalent": "That the manuscript survived the fire is remarkable.",
              "focusedConstituent": "that the manuscript survived the fire (delayed-subject Subject Clause)",
              "presupposedProposition": "The manuscript survived the fire.",
              "pragmaticPurpose": "Evaluates the event as \"remarkable\" while placing the heavy clause at the end."
            },
            {
              "sentence": "It-cleft: It was the seventeenth-century manuscript that survived the fire.",
              "ordinaryEquivalent": "The seventeenth-century manuscript survived the fire.",
              "focusedConstituent": "the seventeenth-century manuscript (Extracted Subject NP)",
              "presupposedProposition": "Something survived the fire.",
              "pragmaticPurpose": "Identifies which item survived the fire."
            },
            {
              "sentence": "Object Introductory-It Pattern: The new software makes it easier to track inventory.",
              "ordinaryEquivalent": "Tracking inventory is made easier by the new software.",
              "focusedConstituent": "to track inventory (delayed-subject Infinitive Object)",
              "presupposedProposition": "Inventory is tracked.",
              "pragmaticPurpose": "Uses dummy object \"it\" before the object complement \"easier\"."
            },
            {
              "sentence": "Inferential It-cleft: It is not that the team lacks skill; it is that the deadline is unrealistic.",
              "ordinaryEquivalent": "The problem is not a lack of skill, but an unrealistic deadline.",
              "focusedConstituent": "that the deadline is unrealistic (Inferential Explanation)",
              "presupposedProposition": "There is a reason for the difficulty.",
              "pragmaticPurpose": "High-level C1 explanatory cleft rejecting one interpretation of a situation and supplying the true interpretation."
            }
          ],
          "contextualComparisons": [
            {
              "context": "Structural diagnostic between Introductory-It Pattern and It-cleft",
              "ordinaryForm": "Test sentence: It is obvious that the lock was forced.",
              "cleftForm": "Can we say *\"Obviously the lock was forced\" by deleting \"It is...that\"? No—because \"obvious\" is a predicate adjective, not a constituent extracted from inside \"the lock was forced\".",
              "alternativeForm": "True Cleft: It was the back lock that was forced. (Extracted from \"The back lock was forced\").",
              "comparisonNote": "Always check whether the subordinate clause has a syntactic gap corresponding to the phrase after \"It + be\"."
            }
          ],
          "learnerErrors": [
            {
              "incorrectOrAwkward": "Labelling \"It is likely that interest rates will fall\" as an it-cleft.",
              "status": "Ungrammatical",
              "correctedVersion": "Classify as subject introductory-it pattern (\"That interest rates will fall is likely\").",
              "diagnosticExplanation": "\"Likely\" is an evaluative adjective taking a clausal subject; nothing has been extracted from \"interest rates will fall\"."
            }
          ],
          "restrictionsAndExceptions": [
            "Exception — The \"It is (not) that...\" Inferential Construction: C1 English permits \"It is not that I disagree with the goal; it is just that the timeline is too short\", which focuses entire explanatory that-clauses."
          ],
          "guidedPractice": {
            "taskTitle": "Choose-the-Construction Clinic",
            "instructions": "Select the best construction (It-cleft, What-cleft, Introductory-It Pattern, or Fronting) for each communicative need.",
            "items": [
              {
                "prompt": "Goal: Evaluate the obligation to wear protective goggles without singling out any contrasting participant.",
                "targetFocus": "Introductory-It Pattern",
                "modelAnswer": "It is mandatory that all laboratory visitors wear protective goggles.",
                "commentary": "Introductory-It Pattern states institutional policy cleanly without false contrastive presuppositions."
              }
            ]
          },
          "followUpQuestions": [
            {
              "id": "m7-s3-q1",
              "role": "Recognition",
              "type": "mcq",
              "prompt": "How can you prove syntactically that “It is doubtful that the ferry will sail” is introductory-it pattern rather than an it-cleft?",
              "options": [
                "The clause \"the ferry will sail\" is already syntactically complete (no constituent has been extracted from it), and \"That the ferry will sail is doubtful\" is the underlying non-delayed-subject clause.",
                "Because \"ferry\" is a countable noun.",
                "Because \"will sail\" is in the future tense.",
                "Because \"doubtful\" begins with a consonant."
              ],
              "correctAnswer": "The clause \"the ferry will sail\" is already syntactically complete (no constituent has been extracted from it), and \"That the ferry will sail is doubtful\" is the underlying non-delayed-subject clause.",
              "explanation": "In introductory-it pattern, the that-clause has no internal gap and serves as the logical subject of the predicate \"is doubtful\"."
            },
            {
              "id": "m7-s3-q2",
              "role": "Construction",
              "type": "mcq",
              "prompt": "Which sentence correctly uses a lexical-head identifying construction to focus on the manner/method of an action in formal prose?",
              "options": [
                "The way in which the samples were stored explains the contamination.",
                "The way how the samples were stored explains the contamination.",
                "What the samples were stored explains the contamination.",
                "It was the way how that the samples were stored."
              ],
              "correctAnswer": "The way in which the samples were stored explains the contamination.",
              "explanation": "In formal British English, \"The way in which...\" (or \"The way that...\") is the standard construction; *\"the way how\" is ungrammatical."
            },
            {
              "id": "m7-s3-q3",
              "role": "Interpretation",
              "type": "mcq",
              "prompt": "What does the C1 inferential cleft “It is not that the data are inaccurate; it is that they have been misinterpreted” accomplish in an academic discussion?",
              "options": [

                "It claims that no data exist.",
                "It asks a direct question about data collection.",
                "It is an example of locative inversion."
              ],
              "correctAnswer": "It rejects one possible explanation of the problem (\"the data are inaccurate\") and substitutes the true explanation (\"they have been misinterpreted\").",
              "explanation": "Inferential \"It is not that [Clause A]; it is that [Clause B]\" contrasts two complete propositional explanations for a situation."
            }
          ]
        }

      "contextualisedApplication": {
        "title": "Choose-the-Construction Clinic: Selecting and Rejecting Focus Strategies",
        "scenario": "Review three communicative scenarios from a university policy review and select the most effective grammatical construction while explaining why unsuitable alternatives should be rejected.",
        "prompts": [
          {
            "situation": "Scenario 1: Identifying the specific person who founded the scholarship fund at the end of an introductory sentence",
            "baseSentence": "Dr Eleanor Vance founded the scholarship fund in 1984.",

            "pragmaticRationale": "Rejects *\"Who founded the fund was...\" (ungrammatical headless \"who\") and uses \"The person who...\" to place the founder’s name in end-focus."

      "summary": "Explicit and implied contrast, corrective it-clefts and what-clefts, focus particles (only, even, just), nuclear stress and prosody, pragmatic politeness, and interpersonal consequences of corrective clefting.",
      "modelSentence": "What the board rejected was the timetable, not the whole proposal.",
      "learningObjectives": [

      "foundationalCautions": [

        "Pay close attention to pronoun case and style in personal corrective clefts (\"It was she who...\" in very formal prose vs \"It was her that/who...\" in natural speech)."

      "subsections": [
        {
          "id": "m8-s1",
          "code": "8.1",
          "title": "Explicit and Implied Contrast in It-clefts and What-clefts",
          "cefr": "B2",
          "definition": "Contrastive focus occurs when a cleft construction selects one value from a set of contextually plausible alternatives and either implicitly excludes or explicitly rejects the competing alternatives.",
          "formationPattern": "Explicit What-cleft Contrast: [What + Clause + is/was + Focused X, not Rejected Y] | Explicit It-cleft Contrast: [It + is/was + Focused X, rather than Y, + that + Clause]",
          "meaningAndPresupposition": "In \"What the board rejected was the timetable, not the whole proposal\", the speaker presupposes that the board rejected something, corrects the false belief that the entire proposal was rejected, and narrows the rejection to \"the timetable\" alone.",
          "whenAppropriate": "Essential in negotiations, minutes of meetings, academic peer-review responses, and diplomatic clarifications when an audience has over-generalised or misunderstood a decision.",
          "examples": [
            {

              "ordinaryEquivalent": "The board rejected the timetable, not the whole proposal.",
              "focusedConstituent": "the timetable, not the whole proposal",
              "presupposedProposition": "The board rejected some aspect of the submission.",
              "pragmaticPurpose": "Reassures the project team that the core proposal remains alive."
            },
            {
              "sentence": "What we are proposing is a pilot study, rather than a permanent policy change.",
              "ordinaryEquivalent": "We are proposing a pilot study rather than a permanent policy change.",

              "presupposedProposition": "We are proposing some initiative.",
              "pragmaticPurpose": "De-escalates resistance by clarifying the modest scope of the proposal."
            },

              "focusedConstituent": "not the accuracy of the measurements, but their statistical interpretation",
              "presupposedProposition": "The reviewers questioned an aspect of the paper.",
              "pragmaticPurpose": "Places \"not Y, but X\" after the copula of a what-cleft for maximum analytical precision."
            }
          ],
          "contextualComparisons": [
            {
              "context": "Implied contrast vs Explicit contrast",
              "ordinaryForm": "Context: \"Did the CEO write that memo?\"",
              "cleftForm": "Implied Contrast: \"No, it was the communications director who wrote it.\" (\"not the CEO\" is understood from context)",
              "alternativeForm": "Explicit Contrast: \"It was the communications director, not the CEO, who wrote the memo.\" (Required when no prior question named the CEO)",

          "restrictionsAndExceptions": [

          "id": "m8-s2",
          "code": "8.2",
          "title": "Discourse Stress, Prosody and Focus-Sensitive Operators",
          "cefr": "B2",
          "definition": "In spoken English, syntactic clefting works together with nuclear tonic stress (the syllable carrying the main pitch movement). Usually the nuclear stress falls on the focused constituent itself, but in anaphoric clefts (\"That WAS what I said\") the stress can shift to the copula to assert polarity (truth) rather than identity.",
          "formationPattern": "Standard Cleft Stress: [It was MÁYA who prepared the report] | Polarity/Verum Stress: [That ÍS what we agreed]",
          "meaningAndPresupposition": "When nuclear stress falls on \"MÁYA\" in \"It was MÁYA who prepared the report\", the speaker contrasts Maya with other people. When nuclear stress falls on \"ÍS\" in \"That ÍS what we agreed\", both \"That\" and \"what we agreed\" are already mentioned, and the speaker is insisting that the equation between them is true.",
          "whenAppropriate": "Understanding the interplay of syntax and stress helps learners read dialogues aloud naturally and recognise why written clefts must place focus particles (\"only\", \"just\", \"precisely\", \"chiefly\") immediately adjacent to the intended constituent.",
          "examples": [
            {
              "sentence": "It is CHIEFLY in rural districts that broadband speeds remain inadequate.",
              "ordinaryEquivalent": "Broadband speeds remain inadequate chiefly in rural districts.",
              "focusedConstituent": "chiefly in rural districts",
              "presupposedProposition": "Broadband speeds remain inadequate in some areas.",
              "pragmaticPurpose": "Focus adverb \"chiefly\" qualifies the exhaustiveness of the cleft so it does not claim 100% exclusivity."
            },
            {
              "sentence": "It was PRECISELY because the guidelines were vague that we sought legal advice.",
              "ordinaryEquivalent": "We sought legal advice precisely because the guidelines were vague.",
              "focusedConstituent": "precisely because the guidelines were vague",
              "presupposedProposition": "We sought legal advice for a reason.",
              "pragmaticPurpose": "Intensifies the exactness of the causal identification."
            },
            {
              "sentence": "What they needed most was SIMPLY a clear point of contact.",
              "ordinaryEquivalent": "They simply needed a clear point of contact most.",
              "focusedConstituent": "simply a clear point of contact",
              "presupposedProposition": "They needed something most.",
              "pragmaticPurpose": "Uses \"simply\" inside the focused complement to highlight how straightforward the solution was."
            },
            {
              "sentence": "It was partly through luck and partly through persistence that the manuscript was recovered.",
              "ordinaryEquivalent": "The manuscript was recovered partly through luck and partly through persistence.",
              "focusedConstituent": "partly through luck and partly through persistence",
              "presupposedProposition": "The manuscript was recovered by some means.",
              "pragmaticPurpose": "Demonstrates that clefts need not imply sole exclusivity when modified by \"partly ... and partly ...\"."
            }
          ],
          "contextualComparisons": [
            {
              "context": "Avoiding false claims of absolute exclusivity",
              "ordinaryForm": "Cost and reliability influenced our choice.",
              "cleftForm": "Absolute Cleft: It was cost that influenced our choice. (Implies cost was the sole or overriding factor)",
              "alternativeForm": "Qualified Cleft: It was primarily cost that influenced our choice. (Explicitly allows for secondary factors)",
              "comparisonNote": "As noted in the course foundations, clefts often imply exhaustiveness by conversational implicature, but adverbs like \"primarily\", \"chiefly\", \"partly\", or \"above all\" allow a writer to highlight a primary factor without claiming no other factors existed."
            }

            }
          ],
          "restrictionsAndExceptions": [
            "Clefts do NOT always entail 100% logical exclusivity: modifiers like \"partly\", \"largely\", \"chiefly\", and \"primarily\" frequently appear in the focus slot in authentic academic English."
          ],
          "guidedPractice": {

            "instructions": "Add an appropriate focus qualifier (\"primarily\", \"precisely\", \"partly\") to reflect the intended meaning.",
            "items": [

        {
          "id": "m8-s3",

          "title": "Politeness, Hedging and Interactional Consequences in Corrective Dialogues",
          "cefr": "C1",
          "definition": "In professional and academic interaction, correcting a speaker’s factual error requires balancing propositional clarity (making sure the error is repaired) with interpersonal politeness (preserving collaborative rapport). Combining cleft structures with epistemic hedges or shifting from personal focus to issue/action focus prevents unnecessary friction.",
          "formationPattern": "Blunt Personal Cleft: [It wasn’t you who X; it was Y] → Diplomatic Issue-Focused Cleft: [I think what actually happened was that... / If I recall correctly, it was the X department that...]",
          "meaningAndPresupposition": "Shifting from a negative personal it-cleft (\"It wasn’t you who found that\") to an event-focused or issue-focused what-cleft (\"What actually resolved the issue was the patch from the Bristol team\") repairs the factual record without framing the correction as a personal attack.",
          "whenAppropriate": "Use diplomatic prefaces (\"If I’m not mistaken, it was...\", \"What the report actually states is...\") in client meetings, panel discussions, and workplace emails.",
          "examples": [
            {
              "sentence": "If I remember rightly, it was the Bristol branch, rather than Manchester, that piloted the scheme.",

            },

            {

              "focusedConstituent": "the calibration protocol",
              "presupposedProposition": "Something in the measurement system needs reviewing.",
              "pragmaticPurpose": "Uses modal hedging (\"It may well be...\") inside an it-cleft to propose an alternative diagnosis politely."
            },
            {
              "sentence": "What we are hoping to clarify today is how the two budgets will be coordinated.",

              "focusedConstituent": "how the two budgets will be coordinated",
              "presupposedProposition": "We are hoping to clarify something today.",
              "pragmaticPurpose": "Sets a constructive agenda in a cross-departmental meeting."

          "contextualComparisons": [

          "guidedPractice": {

          "id": "m9-s1",
          "code": "9.1",
          "title": "Given-Before-New, End-Focus and End-Weight Principles",
          "cefr": "B2",
          "definition": "Information packaging refers to how a writer distributes known (given) and unfamiliar (new) content across a clause. In English discourse, readers expect sentences to move from Given Topic (at the start) to New Focus (at the end — the Principle of End-Focus), and from shorter, simpler phrases to longer, syntactically complex constituents (the Principle of End-Weight).",
          "formationPattern": "Optimal Discourse Flow: [Given / Short Frame (What-clause or Anaphoric Subject)] → [Copula / Verb] → [New / Heavy Constituent (End-Focus & End-Weight)]",
          "meaningAndPresupposition": "In \"The initial trials produced consistent readings. What prompted further analysis was an unexpected pattern in the third dataset\", the opening what-clause (\"What prompted further analysis\") bridges from the trial context (given), while the complex new noun phrase (\"an unexpected pattern in the third dataset\") sits in natural end-focus.",
          "whenAppropriate": "Use a what-cleft when the action or cognitive frame is already predictable from the paragraph topic and the new information is a heavy noun phrase or clause.",
          "examples": [

            {
              "sentence": "What made the negotiation particularly delicate was that both companies shared the same supplier.",

              "focusedConstituent": "that both companies shared the same supplier (End-Weight)",

              "pragmaticPurpose": "Uses an it-cleft with \"this very...\" to spotlight the just-mentioned item as the decisive trigger."

          "cefr": "C1",
          "definition": "Thematic progression describes how sentence themes (the initial starting points of clauses) connect across a paragraph. Two classic patterns are: (1) Constant Theme Progression (keeping the same topic at the start of successive sentences) and (2) Linear/Zigzag Progression (where the new end-focus of Sentence A becomes the given initial theme of Sentence B).",

          "whenAppropriate": "Use an anaphoric it-cleft (\"It was this X that...\") or anaphoric reversed pseudo-cleft (\"This was what...\") when turning the end-focus of one sentence into the causal pivot of the next.",
          "examples": [

              "pragmaticPurpose": "Creates a strong linear thematic link from the end of Sentence 1 to the start of Sentence 2."
            },
            {

              "presupposedProposition": "Something explained these readings.",
              "pragmaticPurpose": "Embeds the anaphoric phrase (\"these readings\") inside the opening what-clause to preserve linear progression."

              "presupposedProposition": "They examined something next.",
              "pragmaticPurpose": "Maintains constant theme (\"The committee\" / \"they\") while marking a deliberate stage transition."

              "sentence": "Non-cleft Passive Cohesion: The prototype was tested in sub-zero conditions. It was then dismantled and inspected for micro-fractures.",

          "definition": "Cleft density refers to the frequency of cleft constructions within a passage. Because every cleft forces the reader to process a two-clause presupposition-assertion equation, skilled academic and professional writers typically limit clefts to key thesis statements, corrective contrasts, or major transitions.",

    {
      "id": 10,
      "code": "Module 10",
      "title": "Grammar, Agreement and Structural Restrictions",
      "cefr": "B2–C1",
      "summary": "Subject–verb agreement in it-clefts and pseudo-clefts, pronoun case and style (It was I who... vs It was me that...), preposition placement (fronting vs stranding), relative marker restrictions, malformed pseudo-clefts, and distinguishing ungrammatical forms from stylistic preferences.",
      "modelSentence": "What she needs is a clear explanation. / It was yesterday that the form was submitted.",
      "learningObjectives": [
        "Identify the agreement controller in both it-clefts (both clauses) and what-clefts.",
        "Apply pronoun case and verb-person agreement rules across formal and conversational writing and speaking styles (\"It is I who am...\" vs \"It’s me who/that is...\").",
        "Handle preposition fronting (\"It was to the dean that...\") and preposition stranding (\"It was the dean that I spoke to\") accurately.",
        "Distinguish genuine grammatical errors from style-dependent stylistic preferences."
      ],
      "foundationalCautions": [
        "Distinguish true grammatical errors (such as *\"It were the students who...\", *\"What did she want was...\", *\"The way how...\") from style preferences (such as preposition stranding or omitting object \"that\" in speech).",
        "In a subject-focus it-cleft (\"It is the guidelines that require revision\"), the introductory copula (\"is\") agrees with singular \"It\", while the subordinate verb (\"require\") agrees with the focused subject (\"the guidelines\")."
      ],
      "subsections": [
        {
          "id": "m10-s1",
          "code": "10.1",
          "title": "Dual Agreement Controllers in It-clefts and What-clefts",
          "cefr": "B2",
          "definition": "Cleft sentences contain two finite verbs, each governed by its own agreement rule: (1) In an it-cleft, the first verb (\"It is/was\") is ALWAYS singular, while the verb inside a subject-focus relative clause agrees in number and person with the focused noun phrase or pronoun. (2) In a what-cleft, the what-clause itself is normally singular (\"What they want is...\"), though a plural noun phrase complement after \"be\" can attract a plural copula (\"What we need are/is new tools\").",
          "formationPattern": "It-cleft Subject Focus: [It + is/was (always singular) + Plural NP + who/that + Plural Verb] | What-cleft: [What + Plural S + Plural V + is/was (singular before clause/singular NP) + Complement]",
          "meaningAndPresupposition": "Writers frequently make \"attraction errors\" when a plural noun sits inside a what-clause (\"What the students want IS a clearer timetable\", NOT *\"What the students want ARE a clearer timetable\") or when a plural noun is focused in an it-cleft (\"It WAS the sensors that failed\", NOT *\"It WERE the sensors that failed\").",
          "whenAppropriate": "Essential for grammatical accuracy in Cambridge C1 Advanced, IELTS Academic writing, and professional editing.",
          "examples": [
            {
              "sentence": "What they want is a clear explanation of the fee structure.",
              "ordinaryEquivalent": "They want a clear explanation of the fee structure.",
              "focusedConstituent": "a clear explanation of the fee structure (Singular NP)",
              "presupposedProposition": "They want something.",
              "pragmaticPurpose": "Even though \"they want\" is plural inside the what-clause, the main copula \"is\" must be singular."
            },
            {
              "sentence": "It is the regional branches that manage customer inquiries directly.",
              "ordinaryEquivalent": "The regional branches manage customer inquiries directly.",
              "focusedConstituent": "the regional branches (Plural Subject)",
              "presupposedProposition": "Some part of the organisation manages customer inquiries directly.",
              "pragmaticPurpose": "Main copula \"is\" agrees with \"It\" (singular); relative verb \"manage\" agrees with \"the regional branches\" (plural)."
            },
            {
              "sentence": "It is the chief executive, not the board members, who signs the annual declaration.",
              "ordinaryEquivalent": "The chief executive, not the board members, signs the annual declaration.",
              "focusedConstituent": "the chief executive",
              "presupposedProposition": "Someone signs the annual declaration.",
              "pragmaticPurpose": "Relative verb \"signs\" agrees with singular head \"the chief executive\", ignoring parenthetical \"not the board members\"."
            },
            {
              "sentence": "What the technicians have requested are two additional oscilloscopes.",
              "ordinaryEquivalent": "The technicians have requested two additional oscilloscopes.",
              "focusedConstituent": "two additional oscilloscopes (Plural NP Complement)",
              "presupposedProposition": "The technicians have requested something.",
              "pragmaticPurpose": "Plural noun phrase complement after the copula permits plural \"are\" in formal prose."
            }
          ],
          "contextualComparisons": [
            {
              "context": "Comparing agreement when the plural noun is inside the what-clause vs after the copula",
              "ordinaryForm": "The reviewers want a shorter introduction.",
              "cleftForm": "Singular complement: What the reviewers want IS a shorter introduction. (\"are\" is ungrammatical here)",
              "alternativeForm": "Plural complement: What the reviewer wants ARE/IS clearer diagrams. (Plural \"are\" or singular \"is\" possible)",
              "comparisonNote": "Never let a plural subject inside the what-clause (\"the reviewers\") trick you into using \"are\" when the post-copular complement is singular (\"a shorter introduction\")."
            }
          ],
          "learnerErrors": [
            {
              "incorrectOrAwkward": "What the employees want are a four-day working week.",
              "status": "Ungrammatical",
              "correctedVersion": "What the employees want is a four-day working week.",
              "diagnosticExplanation": "Both the fused relative clause (\"What the employees want\" = the thing that they want) and the complement (\"a four-day working week\") are singular; \"are\" is a false attraction error triggered by \"employees\"."
            },
            {
              "incorrectOrAwkward": "It is the new regulations that causes the delay.",
              "status": "Ungrammatical",
              "correctedVersion": "It is the new regulations that cause the delay.",
              "diagnosticExplanation": "In a subject-focus it-cleft, the verb in the relative clause must agree in number with the focused subject (\"the new regulations\" → plural \"cause\")."
            }
          ],
          "restrictionsAndExceptions": [
            "Controller Rule 1: In \"It is/was [NP] who/that [V]\", \"It\" controls \"is/was\" (always singular), and \"[NP]\" controls \"[V]\" (singular or plural).",
            "Controller Rule 2: In \"What [S + V] is/are [Complement]\", a singular or clausal complement strictly requires singular \"is/was\"."
          ],
          "guidedPractice": {
            "taskTitle": "Agreement Controller Diagnostic",
            "instructions": "Identify the agreement controller for each blank and select the accurate verb form.",
            "items": [
              {
                "prompt": "It (is / are) the local authorities that (funds / fund) the shelter.",
                "targetFocus": "is ... fund",

          "followUpQuestions": [
            {
              "id": "m10-s1-q1",

              "correctAnswer": "The fused nominal relative clause \"What they want\" (= the single thing that they want), supported by the singular complement \"a clear explanation\", requiring singular \"is\".",
              "explanation": "The embedded subject \"they\" governs \"want\" inside the relative clause, not the main clause copula \"is\"."

            {

              "role": "Interpretation",
              "type": "mcq",
              "prompt": "Why is “*What the delegates proposed were that the vote should be postponed” ungrammatical?",
              "options": [
                "Because when the complement of a what-cleft is a finite clause (\"that the vote should be postponed\"), the main copula must be singular (\"was\"), regardless of the plural noun \"delegates\".",
                "Because \"delegates\" is an uncountable noun.",
                "Because \"should\" cannot appear in a that-clause.",

              "correctAnswer": "Because when the complement of a what-cleft is a finite clause (\"that the vote should be postponed\"), the main copula must be singular (\"was\"), regardless of the plural noun \"delegates\".",

        },
        {
          "id": "m10-s2",
          "code": "10.2",
          "title": "Pronoun Case, Relative Marker Selection and Preposition Placement",
          "cefr": "C1",
          "definition": "When personal pronouns or prepositional phrases are focused in an it-cleft, grammar and style interact closely across three areas: (1) Subjective vs Objective pronoun case (\"It was I who...\" vs \"It was me that/who...\"), (2) Relative marker choice (\"who\", \"that\", \"which\"), and (3) Preposition fronting vs stranding.",
          "formationPattern": "High Formal: [It is I/she/they + who + Verb agreeing with pronoun] vs Neutral/Conversational: [It is me/her/them + that/who + 3rd-person Verb] | Prepositions: [It was to X that S V] vs [It was X (that) S V to]",
          "meaningAndPresupposition": "In high formal or ceremonial prose, subjective pronouns are used for subject focus and the relative verb agrees in person with the pronoun (\"It is I who am responsible\"; \"It was she who led the inquiry\"). In everyday educated speech and neutral writing, objective pronouns are natural (\"It’s me that’s responsible\"; \"It was her who led the inquiry\").",
          "whenAppropriate": "In formal academic or legal writing, either avoid first-person pronoun clefts by using a noun phrase (\"It is the present author who...\") or use the formal subjective pattern consistently. With prepositions, front the entire prepositional phrase (\"It is on this principle that the argument rests\") in formal prose.",
          "examples": [
            {
              "sentence": "Formal Preposition Fronting: It is on this assumption that the entire forecast depends.",
              "ordinaryEquivalent": "The entire forecast depends on this assumption.",
              "focusedConstituent": "on this assumption (Prepositional Phrase)",
              "presupposedProposition": "The entire forecast depends on something.",
              "pragmaticPurpose": "Keeps the preposition attached to its complement in formal academic style."
            },
            {
              "sentence": "Conversational Preposition Stranding: It was the second charity (that) we donated the proceeds to.",
              "ordinaryEquivalent": "We donated the proceeds to the second charity.",
              "focusedConstituent": "the second charity",
              "presupposedProposition": "We donated the proceeds to a charity.",
              "pragmaticPurpose": "Leaves \"to\" at the end of the relative clause; natural in speech and informal writing."
            },
            {
              "sentence": "Formal Pronoun Case: It was she who first questioned the validity of the contract.",
              "ordinaryEquivalent": "She first questioned the validity of the contract.",
              "focusedConstituent": "she (Subjective Pronoun)",
              "presupposedProposition": "Someone first questioned the validity of the contract.",
              "pragmaticPurpose": "formal literary or legal style."
            },
            {
              "sentence": "Conversational Pronoun Case: It was him that/who left the message on the answerphone.",
