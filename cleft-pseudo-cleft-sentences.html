          "title": "Interrogative It-clefts and Focus-Sensitive Particles (Only, Even, Just)",
          "cefr": "B2",
          "definition": "Interrogative it-clefts invert \"be\" and \"it\" (\"Is it / Was it X that...?\" or \"Who was it that...?\") to question the identity of the focused element while still presupposing the background clause. Focus-sensitive particles such as \"only\", \"just\", and \"even\" can modify the focused phrase to add exclusivity or scalar surprise.",
          "formationPattern": "Yes/No Cleft: [Is/Was + it + Focused X + that/who + Clause?] | Wh-Question Cleft: [Wh-word + is/was + it + that + Clause?] | Particle Cleft: [It + is/was + only/just + X + that + Clause]",
          "meaningAndPresupposition": "Asking \"Was it the timetable that changed?\" takes for granted that something changed and checks whether that thing was the timetable. Adding \"only\" (\"It was only in the final chapter that the author addressed the counter-argument\") makes exclusivity explicit.",
          "whenAppropriate": "Use interrogative clefts in interviews, diagnostic troubleshooting, and polite verification. Use \"only\" or \"just\" inside an it-cleft when you want to restrict a claim to a single time, cause, or group.",
          "examples": [
            {
              "sentence": "Was it the venue that caused the attendance drop?",
              "ordinaryEquivalent": "Did the venue cause the attendance drop?",
              "focusedConstituent": "the venue (queried cause)",
              "presupposedProposition": "Something caused the attendance drop.",
              "pragmaticPurpose": "Tests one specific hypothesis when the attendance drop and the existence of a cause are already accepted."
            },
            {
              "sentence": "Who was it that authorised the emergency payment?",
              "ordinaryEquivalent": "Who authorised the emergency payment?",
              "focusedConstituent": "Who (queried agent)",
              "presupposedProposition": "Someone authorised the emergency payment.",
              "pragmaticPurpose": "Adds insistent or investigative emphasis to a wh-question."
            },
            {
              "sentence": "It is only when the temperature exceeds eighty degrees that the alarm sounds.",
              "ordinaryEquivalent": "The alarm sounds only when the temperature exceeds eighty degrees.",
              "focusedConstituent": "only when the temperature exceeds eighty degrees",
              "presupposedProposition": "The alarm sounds under a specific condition.",
              "pragmaticPurpose": "Establishes a strict necessary condition in technical documentation."
            },
            {
              "sentence": "It was just a minor typographical error that delayed the printing.",
              "ordinaryEquivalent": "Just a minor typographical error delayed the printing.",
              "focusedConstituent": "just a minor typographical error",
              "presupposedProposition": "Something delayed the printing.",
              "pragmaticPurpose": "Minimises the scale of the cause while acknowledging the delay."
            }
          ],
          "contextualComparisons": [
            {
              "context": "Comparing ordinary \"When did...\" with \"When was it that...\"",
              "ordinaryForm": "When did you first notice the symptoms?",
              "cleftForm": "When was it that you first noticed the symptoms?",
              "alternativeForm": "Was it on Tuesday that you first noticed the symptoms?",
              "comparisonNote": "\"When was it that...?\" signals that the speaker knows the listener noticed the symptoms and is gently prompting them to recall the precise occasion."
            }
          ],
          "learnerErrors": [
            {
              "incorrectOrAwkward": "Was itonly the manager who did she sign the letter?",
              "status": "Ungrammatical",
              "correctedVersion": "Was it only the manager who signed the letter?",
              "diagnosticExplanation": "In an interrogative it-cleft, inversion occurs ONLY in the main clause (\"Was it...\"), never inside the subordinate relative clause."
            },
            {
              "incorrectOrAwkward": "Not until midnight it was that the rain stopped.",
              "status": "Ungrammatical",
              "correctedVersion": "It was not until midnight that the rain stopped. / Not until midnight did the rain stop.",
              "diagnosticExplanation": "Do not confuse a negative time-cleft (\"It was not until X that Y\") with negative adverbial inversion (\"Not until X did Y\")."
            }
          ],
          "restrictionsAndExceptions": [
            "Notice that while \"Not until midnight did the rain stop\" requires auxiliary inversion in a single clause, \"It was not until midnight that the rain stopped\" does NOT invert the verb in the that-clause because the negation belongs to the cleft frame.",
            "The particle \"even\" rarely sits comfortably inside the focal slot of a standard it-cleft (*\"It was even Maya who agreed\"); speakers prefer ordinary clause position (\"Even Maya agreed\")."
          ],
          "guidedPractice": {
            "taskTitle": "Distinguishing Cleft \"Not Until\" from Inverted \"Not Until\"",
            "instructions": "Convert the sentence between negative adverbial inversion and an it-cleft.",
            "items": [
              {
                "prompt": "Inverted form: Not until the archive was opened did historians understand the treaty.",
                "targetFocus": "until the archive was opened",
                "modelAnswer": "It was not until the archive was opened that historians understood the treaty.",
                "commentary": "Notice that \"did historians understand\" reverts to normal declarative order (\"that historians understood\") inside the cleft."
              }
            ]
          },
          "followUpQuestions": [
            {
              "id": "m3-s2-q1",
              "role": "Recognition",
              "type": "mcq",
              "prompt": "Why does “even” behave differently from “only” in an it-cleft (e.g. “It was only on Friday that...” vs “*It was even on Friday that...”)?",
              "options": [
                "Because an it-cleft identifies a specific or exhaustive value, which aligns naturally with restrictive \"only\" but clashes with additive scalar \"even\".",
                "Because \"even\" is a verb rather than a focus particle.",
                "Because \"only\" cannot modify prepositional phrases.",
                "Because \"even\" is restricted to past-tense clauses."
              ],
              "correctAnswer": "Because an it-cleft identifies a specific or exhaustive value, which aligns naturally with restrictive \"only\" but clashes with additive scalar \"even\".",
              "explanation": "It-clefts narrow down identification, matching restrictive particles like \"only\" and \"just\", whereas \"even\" implies inclusion at the extreme end of an open scale."
            },
            {
              "id": "m3-s2-q2",
              "role": "Construction",
              "type": "mcq",
              "prompt": "Choose the grammatically accurate completion: “It was not until the second semester ___ the students began their laboratory placements.”",
              "options": [
                "that the students began",
                "did the students begin",
                "when did the students begin",
                "which the students began"
              ],
              "correctAnswer": "that the students began",
              "explanation": "In \"It was not until X that...\", the subordinate clause follows normal declarative word order (\"that the students began\"), without subject–auxiliary inversion."
            },
            {
              "id": "m3-s2-q3",
              "role": "Interpretation",
              "type": "mcq",
              "prompt": "What pragmatic effect is created by asking “Where was it that you parked the van?” instead of “Where did you park the van?”",
              "options": [
                "It treats the act of parking the van as an established, shared memory and asks the listener to retrieve or confirm the specific location.",
                "It accuses the listener of stealing the van.",
                "It implies the van was never parked.",
                "It changes the question from past to future time."
              ],
              "correctAnswer": "It treats the act of parking the van as an established, shared memory and asks the listener to retrieve or confirm the specific location.",
              "explanation": "Wh-interrogative clefts (\"Where was it that...?\") highlight that the event itself is familiar to both interlocutors, often used when trying to recall a forgotten detail."
            }
          ]
        },
        {
          "id": "m3-s3",
          "code": "3.3",
          "title": "Contrastive Pairing (Not X, But Y) and Complex Focused Noun Phrases",
          "cefr": "C1",
          "definition": "At C1 level, it-clefts frequently house complex coordinated or contrasted noun phrases (\"It was the methodology, not the findings, that...\" or \"It is not X, but rather Y, that...\") to draw sharp analytical distinctions in academic and professional arguments.",
          "formationPattern": "[It + is/was + Focused X, not Alternative Y, + that/who + Clause] OR [It + is/was + not Rejected Y, but Focused X, + that/who + Clause]",
          "meaningAndPresupposition": "These structures perform two discourse operations simultaneously inside a single sentence: they explicitly reject a plausible misconception (Y) and substitute the accurate explanation or factor (X), while holding the background proposition constant.",
          "whenAppropriate": "Highly effective in literature reviews, policy critiques, legal summaries, and board discussions when distinguishing between two closely related factors (e.g. correlation vs causation, methodology vs findings, capital cost vs maintenance cost).",
          "examples": [
            {
              "sentence": "It was the methodology, not the findings, that concerned the peer reviewers.",
              "ordinaryEquivalent": "The methodology, rather than the findings, concerned the peer reviewers.",
              "focusedConstituent": "the methodology, not the findings",
              "presupposedProposition": "An aspect of the study concerned the peer reviewers.",
              "pragmaticPurpose": "Separates the valid results from the flawed research design."
            },
            {
              "sentence": "It is not the volume of data, but the quality of the sampling, that determines reliability.",
              "ordinaryEquivalent": "The quality of the sampling, not the volume of data, determines reliability.",
              "focusedConstituent": "not the volume of data, but the quality of the sampling",
              "presupposedProposition": "Some property of the study determines reliability.",
              "pragmaticPurpose": "Reorders the contrast so the rejected assumption is dismissed first."
            },
            {
              "sentence": "It was the sudden withdrawal of the main sponsor, rather than poor ticket sales, that forced the festival to close.",
              "ordinaryEquivalent": "The sudden withdrawal of the main sponsor forced the festival to close.",
              "focusedConstituent": "the sudden withdrawal of the main sponsor, rather than poor ticket sales",
              "presupposedProposition": "Something forced the festival to close.",
              "pragmaticPurpose": "Uses a heavy, post-modified noun phrase in focus to refute a public rumour."
            },
            {
              "sentence": "It is precisely those municipalities with ageing water infrastructure that face the steepest repair bills.",
              "ordinaryEquivalent": "Municipalities with ageing water infrastructure face the steepest repair bills.",
              "focusedConstituent": "precisely those municipalities with ageing water infrastructure",
              "presupposedProposition": "Certain municipalities face the steepest repair bills.",
              "pragmaticPurpose": "Focuses a complex demonstrative noun phrase modified by a prepositional phrase."
            }
          ],
          "contextualComparisons": [
            {
              "context": "Comparing \"It was X, not Y, that...\" with \"It was not Y, but X, that...\"",
              "ordinaryForm": "Implementation speed, not cost, worried the board.",
              "cleftForm": "It was implementation speed, not cost, that worried the board.",
              "alternativeForm": "It was not cost, but implementation speed, that worried the board.",
              "comparisonNote": "Placing \"not cost, but implementation speed\" puts the positive replacement (\"implementation speed\") closer to the verb and gives it stronger rhetorical climax."
            }
          ],
          "learnerErrors": [
            {
              "incorrectOrAwkward": "It was the methodology, not the findings, which they concerned the reviewers.",
              "status": "Ungrammatical",
              "correctedVersion": "It was the methodology, not the findings, that concerned the reviewers.",
              "diagnosticExplanation": "Do not insert a resumptive pronoun (\"they\") inside the relative clause; the relative marker \"that\" already acts as the subject of \"concerned\"."
            },
            {
              "incorrectOrAwkward": "It was not the price, however the delivery time, that delayed the order.",
              "status": "Ungrammatical",
              "correctedVersion": "It was not the price, but the delivery time, that delayed the order.",
              "diagnosticExplanation": "Correlative negation \"not X...\" requires the coordinator \"but\" (or \"but rather\"), never the conjunctive adverb \"however\"."
            }
          ],
          "restrictionsAndExceptions": [
            "When a parenthetical negative contrast (\", not the findings,\") is inserted after a singular focused noun phrase, the verb inside a subject-focus relative clause agrees with the positive focused head (\"It is the methodology, not the preliminary notes, that requires revision\").",
            "Never leave a resumptive pronoun inside the background clause to duplicate the focused phrase."
          ],
          "guidedPractice": {
            "taskTitle": "Constructing Analytical Contrastive Clefts",
            "instructions": "Combine the rejected assumption and the true factor into a single contrastive it-cleft.",
            "items": [
              {
                "prompt": "Background: Something caused the software crash. Rejected assumption: low memory. Actual cause: a corrupted driver.",
                "targetFocus": "not low memory, but a corrupted driver",
                "modelAnswer": "It was not low memory, but a corrupted driver, that caused the software crash.",
                "commentary": "Dismisses the false diagnosis first and highlights the true cause before the presupposed clause."
              }
            ]
          },
          "followUpQuestions": [
            {
              "id": "m3-s3-q1",
              "role": "Recognition",
              "type": "mcq",
              "prompt": "In “It was the methodology, not the findings, that concerned the reviewers”, what is the communicative role of “not the findings”?",
              "options": [
                "It explicitly rejects a competing candidate focus while keeping the presupposition (\"something concerned the reviewers\") intact.",
                "It negates the verb \"concerned\" so that the reviewers were completely satisfied.",
                "It turns the sentence into a direct question.",
                "It functions as the main verb of the sentence."
              ],
              "correctAnswer": "It explicitly rejects a competing candidate focus while keeping the presupposition (\"something concerned the reviewers\") intact.",
              "explanation": "The parenthetical \"not the findings\" rules out an alternative interpretation while asserting \"the methodology\" as the true focus."
            },
            {
              "id": "m3-s3-q2",
              "role": "Construction",
              "type": "cloze",
              "prompt": "Complete the contrastive cleft with the correct verb form: “It is the distribution network, not the individual retail stores, that ___ (require) immediate investment.”",
              "correctAnswer": "requires",
              "explanation": "In a subject-focus cleft, the verb in the relative clause agrees with the positive focused head noun (\"the distribution network\" → singular \"requires\"), not the parenthetical negative phrase (\"not the individual retail stores\")."
            },
            {
              "id": "m3-s3-q3",
              "role": "Interpretation",
              "type": "mcq",
              "prompt": "Why is “*It was the contract which the lawyer signed it yesterday” ungrammatical?",
              "options": [
                "Because the object pronoun \"it\" illegally duplicates the focused object \"the contract\", which is already represented by the relative clause gap.",
                "Because \"yesterday\" must appear at the start of the sentence.",
                "Because \"the lawyer\" is singular.",
                "Because \"signed\" is a regular verb."
              ],
              "correctAnswer": "Because the object pronoun \"it\" illegally duplicates the focused object \"the contract\", which is already represented by the relative clause gap.",
              "explanation": "Cleft relative clauses contain a syntactic gap corresponding to the focused constituent; adding a resumptive pronoun (\"it\") is ungrammatical."
            }
          ]
        }
      ],
      "contextualisedApplication": {
        "title": "Meeting Correction Role-play: Repairing Three False Assumptions",
        "scenario": "During a project post-mortem, a committee member makes three inaccurate claims about a delayed product launch. Repair each false assumption without denying the underlying event.",
        "prompts": [
          {
            "situation": "False claim 1: \"The engineering team missed the October deadline.\" (Fact: The external supplier missed it.)",
            "baseSentence": "Someone missed the October deadline.",
            "modelTransformation": "It wasn’t the engineering team that missed the October deadline; it was the external supplier.",
            "pragmaticRationale": "Acknowledges the missed deadline while shifting accountability accurately."
          },
          {
            "situation": "False claim 2: \"The board rejected the entire product design.\" (Fact: They only rejected the packaging.)",
            "baseSentence": "The board rejected part of the submission.",
            "modelTransformation": "It was the packaging, not the entire product design, that the board rejected.",
            "pragmaticRationale": "Uses \"X, not Y\" contrast to prevent unnecessary redesign work."
          },
          {
            "situation": "False claim 3: \"We knew about the supply shortage in August.\" (Fact: We only discovered it in late September.)",
            "baseSentence": "We discovered the supply shortage at some point.",
            "modelTransformation": "It wasn’t until late September that we discovered the supply shortage.",
            "pragmaticRationale": "Uses \"It wasn’t until... that\" to correct the timeline precisely."
          }
        ]
      },

    {
      "id": 4,
      "code": "Module 04",
      "title": "Wh-cleft and Pseudo-cleft Sentences",
      "cefr": "B1–C1",
      "summary": "Basic and advanced what-clefts (pseudo-clefts); fused nominal relative clauses versus embedded interrogatives; noun phrase, infinitive, and finite clausal complements; action focus with \"do\"; agreement and discourse rhythm.",
      "modelSentence": "What the investigation revealed was that the evidence was incomplete.",
      "learningObjectives": [
        "Construct basic and advanced what-clefts (\"What I need is...\", \"What happened was...\", \"What concerns me is...\").",
        "Distinguish fused nominal relative clauses (\"what they discovered\" = the thing that they discovered) from direct and indirect questions.",
        "Select accurate noun phrase, bare/to-infinitive, and finite that-clause complements after the copula.",
        "Use \"do\" in the what-clause (\"What she did was...\") to focus actions and verb phrases."
      ],
      "foundationalCautions": [
        "Not every clause beginning with \"what\" is a pseudo-cleft: direct questions (\"What did they discover?\") and embedded interrogative object clauses (\"I asked what they discovered\") are not pseudo-clefts.",
        "Unlike it-clefts, basic what-clefts place the focused constituent at the END of the sentence (after \"be\"), aligning with the natural principle of end-focus and end-weight."
      ],
      "subsections": [
        {
          "id": "m4-s1",
          "code": "4.1",
          "title": "Core What-cleft Structure and Fused Relatives vs Questions",
          "cefr": "B1",
          "definition": "A basic wh-cleft (most commonly a what-cleft or pseudo-cleft) consists of a fused nominal relative clause beginning with \"what\" (meaning \"the thing(s) that\") functioning as the grammatical subject, followed by a form of the copula \"be\", and completed by the focused constituent.",
          "formationPattern": "[What + Subject + Verb (+ Object) / What + Verb] + [is / was] + [Focused Complement (NP / Infinitive / Clause)]",
          "meaningAndPresupposition": "In \"What I need is more time\", the fused relative \"What I need\" establishes the known frame (\"I need something\") as the sentence topic, and the complement after \"is\" (\"more time\") supplies the focused new value at the end of the clause.",
          "whenAppropriate": "Ideal for introducing a key point in presentations, meetings, and essays because the opening \"What...\" clause alerts the listener or reader to the category of information before delivering the main point at the end.",
          "examples": [
            {
              "sentence": "What I need is more time to verify the figures.",
              "ordinaryEquivalent": "I need more time to verify the figures.",
              "focusedConstituent": "more time to verify the figures (Noun Phrase)",
              "presupposedProposition": "I need something.",
              "pragmaticPurpose": "Clearly states a practical requirement in a project meeting."
            },
            {
              "sentence": "What concerns me is the lack of independent oversight.",
              "ordinaryEquivalent": "The lack of independent oversight concerns me.",
              "focusedConstituent": "the lack of independent oversight (Subject of underlying verb)",
              "presupposedProposition": "Something concerns me.",
              "pragmaticPurpose": "Moves a heavy, important subject to end-focus position."
            },
            {
              "sentence": "What the researchers found was an unexpected correlation.",
              "ordinaryEquivalent": "The researchers found an unexpected correlation.",
              "focusedConstituent": "an unexpected correlation",
              "presupposedProposition": "The researchers found something.",
              "pragmaticPurpose": "Highlights an empirical discovery in a research summary."
            },
            {
              "sentence": "What surprised us was the speed of the recovery.",
              "ordinaryEquivalent": "The speed of the recovery surprised us.",
              "focusedConstituent": "the speed of the recovery",
              "presupposedProposition": "Something surprised us.",
              "pragmaticPurpose": "Frames the emotional/cognitive reaction first and names the stimulus at the end."
            }
          ],
          "contextualComparisons": [
            {
              "context": "Distinguishing a fused relative in a pseudo-cleft from a direct or indirect question",
              "ordinaryForm": "Direct question: What did they discover? (Seeks unknown information)",
              "cleftForm": "Pseudo-cleft: What they discovered was a rare mineral. (\"What\" = the thing that; asserts identity)",
              "alternativeForm": "Indirect question: The journalist asked what they had discovered. (Complement of \"asked\")",
              "comparisonNote": "In a pseudo-cleft, the what-clause does not invert subject and auxiliary (\"What they discovered\", NOT *\"What did they discover was...\"), and it serves as the subject of the equating verb \"be\"."
            }
          ],
          "learnerErrors": [
            {
              "incorrectOrAwkward": "What did I need was more time.",
              "status": "Ungrammatical",
              "correctedVersion": "What I needed was more time.",
              "diagnosticExplanation": "The initial what-clause in a pseudo-cleft is a fused nominal relative clause, not a direct question; never use question inversion (\"did I need\") inside it."
            },
            {
              "incorrectOrAwkward": "What the manager who we met yesterday was very helpful.",
              "status": "Ungrammatical",
              "correctedVersion": "What the manager suggested yesterday was very helpful. / The manager who we met yesterday was very helpful.",
              "diagnosticExplanation": "\"What\" is normally restricted to non-human things, actions, or propositions; do not use \"What\" to refer to a person (*\"What I met was the manager\")."
            }
          ],
          "restrictionsAndExceptions": [
            "Standard English does not use \"who\" as a fused relative opener in a basic pseudo-cleft for people (*\"Who prepared the report was Maya\" is ungrammatical in standard British English; use \"The person who prepared the report was Maya\" or \"It was Maya who prepared the report\").",
            "\"What\" fuses the antecedent and the relative pronoun into a single word (\"what\" = \"that which\" / \"the thing that\"), so never place a noun immediately before \"what\"."
          ],
          "guidedPractice": {
            "taskTitle": "Recasting Ordinary Clauses into What-clefts",
            "instructions": "Transform each ordinary statement into a basic what-cleft.",
            "items": [
              {
                "prompt": "Base: An unexpected result surprised us.",
                "targetFocus": "an unexpected result",
                "modelAnswer": "What surprised us was an unexpected result.",
                "commentary": "Moves the subject \"an unexpected result\" into end-focus position after \"What surprised us was\"."
              }
            ]
          },
          "followUpQuestions": [
            {
              "id": "m4-s1-q1",
              "role": "Recognition",
              "type": "mcq",
              "prompt": "Identify the focal constituent in “What I need is more time”.",
              "options": [
                "more time",
                "What I need",
                "I",
                "need is"
              ],
              "correctAnswer": "more time",
              "explanation": "In a basic what-cleft, the constituent placed after the copula \"is\" (\"more time\") carries the primary information focus."
            },
            {
              "id": "m4-s1-q2",
              "role": "Interpretation",
              "type": "mcq",
              "prompt": "Is “What did they discover?” a pseudo-cleft? Explain why or why not.",
              "options": [
                "No. It is a single-clause wh-interrogative with subject–auxiliary inversion (\"did they discover\") asking a question, whereas a pseudo-cleft uses a non-inverted fused relative clause as the subject of \"be\" (e.g. \"What they discovered was...\").",
                "Yes. Every sentence that starts with the word \"What\" is a pseudo-cleft.",
                "Yes, because \"discover\" is a transitive verb.",
                "No, because pseudo-clefts can only be formed in the present tense."
              ],
              "correctAnswer": "No. It is a single-clause wh-interrogative with subject–auxiliary inversion (\"did they discover\") asking a question, whereas a pseudo-cleft uses a non-inverted fused relative clause as the subject of \"be\" (e.g. \"What they discovered was...\").",
              "explanation": "A pseudo-cleft requires two clauses joined by an identifying copula (\"be\"), where the what-clause has declarative word order."
            },
            {
              "id": "m4-s1-q3",
              "role": "Construction",
              "type": "rewrite",
              "prompt": "Recast “An unexpected result surprised us” with a what-cleft.",
              "correctAnswer": "What surprised us was an unexpected result.",
              "acceptableAlternatives": [],
              "explanation": "The predicate \"surprised us\" forms the fused relative subject \"What surprised us\", followed by past-tense \"was\" and the focused noun phrase \"an unexpected result\"."
            }
          ]
        },
        {
          "id": "m4-s2",
          "code": "4.2",
          "title": "Focusing Actions and Events: Infinitive and Clausal Complements",
          "cefr": "B2",
          "definition": "Unlike it-clefts, what-clefts can easily focus actions, whole events, and propositions by using pro-verb \"do\" (\"What she did was...\") or \"happen\" (\"What happened was...\") in the what-clause, followed by an infinitive or finite clause after \"be\".",
          "formationPattern": "Action Focus: [What + S + do/did + is/was + (to) V-inf] | Event/Claim Focus: [What + happened / Verb + is/was + (that) + Finite Clause]",
          "meaningAndPresupposition": "When \"do\" appears in the what-clause (\"What the team did was redesign the interface\"), the presupposition is that the team took some action, and the infinitive phrase (\"(to) redesign the interface\") specifies the action. When \"happen\" or a reporting verb is used (\"What the investigation revealed was that the evidence was incomplete\"), a full finite clause delivers the focused proposition.",
          "whenAppropriate": "Use \"What [S] did was...\" to highlight a decisive step or intervention. Use \"What [S] showed/revealed/argued is/was that...\" in academic and professional writing to introduce major findings or conclusions with high clarity.",
          "examples": [
            {
              "sentence": "What the investigation revealed was that the evidence was incomplete.",
              "ordinaryEquivalent": "The investigation revealed that the evidence was incomplete.",
              "focusedConstituent": "that the evidence was incomplete (Finite That-clause)",
              "presupposedProposition": "The investigation revealed something.",
              "pragmaticPurpose": "Gives strong end-weight and emphasis to a major finding in a formal report."
            },
            {
              "sentence": "What the engineers did was recalibrate the sensors manually.",
              "ordinaryEquivalent": "The engineers recalibrated the sensors manually.",
              "focusedConstituent": "(to) recalibrate the sensors manually (Infinitive Clause)",
              "presupposedProposition": "The engineers took some action.",
              "pragmaticPurpose": "Focuses a verb phrase—something an it-cleft cannot do."
            },
            {
              "sentence": "What happened next was that the backup generator failed.",
              "ordinaryEquivalent": "Next, the backup generator failed.",
              "focusedConstituent": "that the backup generator failed (Whole Event Clause)",
              "presupposedProposition": "Something happened next.",
              "pragmaticPurpose": "Stages a critical turning point in an incident narrative."
            },
            {
              "sentence": "What they are doing is building a temporary footbridge.",
              "ordinaryEquivalent": "They are building a temporary footbridge.",
              "focusedConstituent": "building a temporary footbridge (-ing Participle Complement)",
              "presupposedProposition": "They are doing something.",
              "pragmaticPurpose": "Matches progressive \"are doing\" in the what-clause with an -ing participle after \"is\"."
            },
            {
              "sentence": "What they have done is (to) simplify the application form.",
              "ordinaryEquivalent": "They have simplified the application form.",
              "focusedConstituent": "(to) simplify the application form",
              "presupposedProposition": "They have done something.",
              "pragmaticPurpose": "Even after \"have done\", British English commonly uses the bare or to-infinitive (\"simplify\" / \"to simplify\") after \"is\"."
            }
          ],
          "contextualComparisons": [
            {
              "context": "Bare infinitive vs to-infinitive after \"What [S] did was...\"",
              "ordinaryForm": "She contacted the ombudsman.",
              "cleftForm": "What she did was contact the ombudsman. (Bare infinitive — most common)",
              "alternativeForm": "What she did was to contact the ombudsman. (To-infinitive — formal option)",
              "comparisonNote": "Both the bare infinitive (\"contact\") and the to-infinitive (\"to contact\") are fully grammatical after \"do + be\". The bare infinitive is more frequent in contemporary British usage."
            }
          ],
          "learnerErrors": [
            {
              "incorrectOrAwkward": "What the technician did was replaced the fuse.",
              "status": "Non-idiomatic",
              "correctedVersion": "What the technician did was (to) replace the fuse.",
              "diagnosticExplanation": "In formal written English, use the bare infinitive (\"replace\") or to-infinitive (\"to replace\") after \"What [S] did was...\", not a finite past-tense verb (\"replaced\")."
            },
            {
              "incorrectOrAwkward": "What we are doing is simplify the process.",
              "status": "Ungrammatical",
              "correctedVersion": "What we are doing is simplifying the process. / What we do is simplify the process.",
              "diagnosticExplanation": "When \"doing\" is in the progressive (-ing) form in the what-clause, the complement after \"be\" must also use the -ing form (\"simplifying\")."
            }
          ],
          "restrictionsAndExceptions": [
            "Aspect Matching Rule: After simple \"do/does/did\", use the bare or to-infinitive (\"What he did was leave\"). After progressive \"be doing\", use the -ing participle (\"What he is doing is leaving\").",
            "When focusing a finite clause (\"What happened was that...\"), \"that\" is retained in formal writing but often omitted in informal speech."
          ],
          "guidedPractice": {
            "taskTitle": "Action and Finding Reformulation",
            "instructions": "Rewrite each sentence as a what-cleft using either \"do\" (for action focus) or a finite that-clause (for finding focus).",
            "items": [
              {
                "prompt": "Base: The audit team cross-checked every invoice against the delivery notes. (Focus on the action)",
                "targetFocus": "cross-check every invoice against the delivery notes",
                "modelAnswer": "What the audit team did was (to) cross-check every invoice against the delivery notes.",
                "commentary": "Uses \"What the audit team did was\" + infinitive to focus the entire verb phrase."
              }
            ]
          },
          "followUpQuestions": [
            {
              "id": "m4-s2-q1",
              "role": "Recognition",
              "type": "mcq",
              "prompt": "In “What the investigation revealed was that the evidence was incomplete”, what grammatical unit occupies the focused position after “was”?",
              "options": [
                "A finite nominal that-clause (\"that the evidence was incomplete\").",
                "A prepositional phrase.",
                "An adverb of manner.",
                "A relative clause modifying \"investigation\"."
              ],
              "correctAnswer": "A finite nominal that-clause (\"that the evidence was incomplete\").",
              "explanation": "The focused complement after the copula \"was\" is the complete finite content clause \"that the evidence was incomplete\"."
            },
            {
              "id": "m4-s2-q2",
              "role": "Construction",
              "type": "cloze",
              "prompt": "Complete the progressive pseudo-cleft accurately: “What the council is doing ___ (upgrade) the street lighting in phases.”",
              "correctAnswer": "is upgrading",
              "explanation": "The singular what-clause requires \"is\", and progressive \"is doing\" requires an -ing participle complement (\"upgrading\")."
            },
            {
              "id": "m4-s2-q3",
              "role": "Interpretation",
              "type": "mcq",
              "prompt": "Why must a writer choose a what-cleft (“What the committee did was postpone the vote”) rather than an it-cleft if the intended focus is the verb phrase “postpone the vote”?",
              "options": [
                "Because standard English grammar does not permit bare verb phrases in the focused slot of an it-cleft (*\"It was postpone the vote that the committee did\"), whereas a what-cleft with \"did\" focuses verb phrases naturally.",
                "Because \"postpone\" is an intransitive verb.",
                "Because \"committee\" cannot appear in an it-cleft.",
                "Because it-clefts can only be used in spoken English."
              ],
              "correctAnswer": "Because standard English grammar does not permit bare verb phrases in the focused slot of an it-cleft (*\"It was postpone the vote that the committee did\"), whereas a what-cleft with \"did\" focuses verb phrases naturally.",
              "explanation": "Action/verb-phrase focus is one of the primary functional advantages of the what-cleft over the it-cleft."
            }
          ]
        },
        {
          "id": "m4-s3",
          "code": "4.3",
          "title": "Agreement, Complex Embedded What-clauses and Discourse Applications",
          "cefr": "C1",
          "definition": "In complex what-clefts, the what-clause may contain embedded subordinate clauses (\"What the researchers claimed had happened was...\"), and number agreement on \"be\" depends on whether the what-clause and post-copular complement are singular clauses/nouns or plural noun phrases.",
          "formationPattern": "[What + S + Reporting/Cognitive Verb + Embedded Clause] + [is/was (or are/were before plural NP)] + [Focused Complement]",
          "meaningAndPresupposition": "Unlike it-clefts (which always take singular \"It is/was\"), a what-cleft followed by a plural noun phrase (\"What we need are clearer guidelines\" / \"What we need is clearer guidelines\") allows either plural agreement (matching the plural complement) or singular agreement (matching the singular clause concept), though singular \"is/was\" is always required before a clause or infinitive.",
          "whenAppropriate": "Use complex what-clefts at the transitions of academic sections or executive summaries to encapsulate prior discussion in the opening what-clause and pivot to the new thesis or recommendation after \"be\".",
          "examples": [
            {
              "sentence": "What the longitudinal data suggest is that early intervention reduces attrition.",
              "ordinaryEquivalent": "The longitudinal data suggest that early intervention reduces attrition.",
              "focusedConstituent": "that early intervention reduces attrition",
              "presupposedProposition": "The longitudinal data suggest something.",
              "pragmaticPurpose": "Note that even though \"data suggest\" is plural inside the what-clause, the main copula \"is\" is singular because the complement is a that-clause."
            },
            {
              "sentence": "What we now require are two independent laboratory confirmations.",
              "ordinaryEquivalent": "We now require two independent laboratory confirmations.",
              "focusedConstituent": "two independent laboratory confirmations (Plural NP)",
              "presupposedProposition": "We now require something.",
              "pragmaticPurpose": "Shows plural copula \"are\" attracted to the plural noun phrase complement (\"is\" also occurs in speech)."
            },
            {
              "sentence": "What the panel believed had caused the delay was a breakdown in communication.",
              "ordinaryEquivalent": "The panel believed that a breakdown in communication had caused the delay.",
              "focusedConstituent": "a breakdown in communication",
              "presupposedProposition": "The panel believed something had caused the delay.",
              "pragmaticPurpose": "Complex what-clause with an embedded finite clause (\"had caused the delay\")."
            },
            {
              "sentence": "What remains unclear is whether the effect persists over five years.",
              "ordinaryEquivalent": "Whether the effect persists over five years remains unclear.",
              "focusedConstituent": "whether the effect persists over five years (Interrogative Complement Clause)",
              "presupposedProposition": "Something remains unclear.",
              "pragmaticPurpose": "Identifies an open research question at the end of a literature review."
            }
          ],
          "contextualComparisons": [
            {
              "context": "Comparing end-weight management in academic prose",
              "ordinaryForm": "That the control group also showed significant improvement under identical conditions surprised the investigators.",
              "cleftForm": "What surprised the investigators was that the control group also showed significant improvement under identical conditions.",
              "alternativeForm": "It surprised the investigators that the control group also showed significant improvement under identical conditions.",
              "comparisonNote": "Placing a long, heavy that-clause at the start of an ordinary sentence makes it difficult to read. Both the what-cleft and introductory-it pattern solve this by shifting the heavy clause to the end; the what-cleft additionally places stronger thematic prominence on \"What surprised the investigators\"."
            }
          ],
          "learnerErrors": [
            {
              "incorrectOrAwkward": "What the data show are that the hypothesis is flawed.",
              "status": "Ungrammatical",
              "correctedVersion": "What the data show is that the hypothesis is flawed.",
              "diagnosticExplanation": "When the focused complement after \"be\" is a finite clause (\"that the hypothesis is flawed\") or an infinitive, the main copula MUST be singular (\"is\" / \"was\")."
            },
            {
              "incorrectOrAwkward": "What it concerns the committee is the rising cost.",
              "status": "Ungrammatical",
              "correctedVersion": "What concerns the committee is the rising cost.",
              "diagnosticExplanation": "Inside \"What concerns the committee\", \"What\" is already the subject of \"concerns\"; inserting dummy \"it\" creates a double subject."
            }
          ],
          "restrictionsAndExceptions": [
            "Agreement Rule: Before a finite clause or infinitive phrase, the main copula in a what-cleft is strictly singular (\"is\" / \"was\"). Before a plural noun phrase (\"What we need is/are new textbooks\"), plural \"are/were\" is preferred in formal editing when \"what\" is interpreted as \"the things that\", while singular \"is/was\" is also widely accepted when \"what we need\" is treated as a single situation.",
            "Never duplicate the role of \"what\" with a pronoun inside the what-clause (*\"What I bought it was a laptop\")."
          ],
          "guidedPractice": {
            "taskTitle": "Report-Findings Reformulation",
            "instructions": "Reformulate each heavy academic sentence into a clear what-cleft that places the new claim in end-focus position.",
            "items": [
              {
                "prompt": "Base: That the battery capacity degrades rapidly below freezing was demonstrated by the winter trials.",
                "targetFocus": "that the battery capacity degrades rapidly below freezing",
                "modelAnswer": "What the winter trials demonstrated was that the battery capacity degrades rapidly below freezing.",
                "commentary": "Eliminates the awkward front-heavy subject clause and places the empirical finding in natural end-focus position."
              }
            ]
          },
          "followUpQuestions": [
            {
              "id": "m4-s3-q1",
              "role": "Recognition",
              "type": "mcq",
              "prompt": "Why must the main verb be singular (“is”) in “What the survey responses indicate ___ that staff morale has improved”?",
              "options": [
                "Because both the fused relative clause (\"What the survey responses indicate\") and the complement (\"that staff morale has improved\") are clausal, requiring singular agreement on the copula.",
                "Because \"responses\" is an uncountable noun.",
                "Because \"indicate\" is in the past tense.",
                "Because \"morale\" is plural."
              ],
              "correctAnswer": "Because both the fused relative clause (\"What the survey responses indicate\") and the complement (\"that staff morale has improved\") are clausal, requiring singular agreement on the copula.",
              "explanation": "A plural noun inside the what-clause (\"responses\") does not make the whole what-clause plural when it equates to a singular that-clause."
            },
            {
              "id": "m4-s3-q2",
              "role": "Construction",
              "type": "rewrite",
              "prompt": "Rewrite “Whether the funding will continue next year remains uncertain” as a what-cleft beginning with “What remains uncertain...”.",
              "correctAnswer": "What remains uncertain is whether the funding will continue next year.",
              "explanation": "Moves the heavy embedded interrogative clause (\"whether the funding will continue next year\") to the focused post-copular slot after \"What remains uncertain is\"."
            },
            {
              "id": "m4-s3-q3",
              "role": "Interpretation",
              "type": "mcq",
              "prompt": "How does a what-cleft support the principle of “end-weight” in formal writing?",
              "options": [
                "It packages the concise framing verb at the start (\"What the study showed was...\") and places the longer, syntactically complex finding at the end of the sentence.",
                "It puts the longest clause at the very first word of the paragraph.",
                "It deletes all subordinate clauses from the sentence.",
                "It replaces all nouns with pronouns."
              ],
              "correctAnswer": "It packages the concise framing verb at the start (\"What the study showed was...\") and places the longer, syntactically complex finding at the end of the sentence.",
              "explanation": "English readers process sentences more easily when lighter, familiar framing comes first and heavier, more complex clauses appear at the end (end-weight)."
            }
          ]
        }
      ],
      "contextualisedApplication": {
        "title": "Report-Findings Reformulation Workshop",
        "scenario": "You are editing an executive research report. Reformulate dense or flat statements into purposeful what-clefts so that the key finding or recommended action receives clear end-focus.",
        "prompts": [
          {
            "situation": "Introducing a surprising empirical finding in a summary section",
            "baseSentence": "The interviews revealed that remote workers actually logged more overtime hours.",
            "modelTransformation": "What the interviews revealed was that remote workers actually logged more overtime hours.",
            "pragmaticRationale": "Frames \"the interviews revealed something\" as the expected report topic and spotlights the counter-intuitive finding at the end."
          },
          {
            "situation": "Highlighting a specific corrective action taken by the engineering team",
            "baseSentence": "The engineering team isolated the affected server cluster immediately.",
            "modelTransformation": "What the engineering team did was isolate the affected server cluster immediately.",
            "pragmaticRationale": "Uses \"What [S] did was + bare infinitive\" to focus the decisive remedial action."
          },
          {
            "situation": "Identifying the primary obstacle at the close of a briefing",
            "baseSentence": "A shortage of certified inspectors is delaying the final sign-off.",
            "modelTransformation": "What is delaying the final sign-off is a shortage of certified inspectors.",
            "pragmaticRationale": "Treats \"the delay to the final sign-off\" as given context and places the newly identified cause at the end."
          }
        ]
      },

        {
          "id": "m4-a6",
          "moduleId": 4,

    {
      "id": 5,
      "code": "Module 05",
      "title": "Reversed Pseudo-clefts",
      "cefr": "B2–C1",
      "summary": "Ordinary versus reversed pseudo-clefts (X + be + what-clause), fronted focus versus anaphoric topic linking, subject–verb number agreement, and structural limitations on reversal.",
      "modelSentence": "Additional funding was what the team needed.",
      "learningObjectives": [
        "Transform standard what-clefts (\"What the team needed was additional funding\") into reversed pseudo-clefts (\"Additional funding was what the team needed\") and vice versa.",
        "Analyse how reversing a pseudo-cleft changes information flow in a paragraph.",
        "Apply strict subject–verb number agreement when a plural noun phrase occupies the initial subject position.",
        "Recognise which complements (such as bare infinitives or finite that-clauses) resist reversal."
      ],
      "foundationalCautions": [
        "Reversal does not always preserve identical information flow: a reversed pseudo-cleft either places marked initial focus on X (\"HONESTY was what she valued\") or uses X as a cohesive link back to the preceding sentence (\"That was what she valued\").",
        "While \"What we need is/are new computers\" allows singular \"is\" in speech, the reversed form \"New computers ARE what we need\" strictly requires plural \"are/were\"."
      ],
      "subsections": [
        {
          "id": "m5-s1",
          "code": "5.1",
          "title": "Formation of Reversed Pseudo-clefts and Two-Way Transformation",
          "cefr": "B2",
          "definition": "A reversed pseudo-cleft (also called an inverted pseudo-cleft) places the identified constituent (typically a noun phrase or demonstrative pronoun) in initial subject position before \"be\", and moves the fused nominal relative what-clause to the post-copular complement position.",
          "formationPattern": "[Focused / Linked Noun Phrase X] + [is / are / was / were] + [what + Subject + Verb / what + Verb]",
          "meaningAndPresupposition": "Both \"What she valued was honesty\" and \"Honesty was what she valued\" equate the same two elements and share the presupposition that she valued something. However, the reversed order places \"Honesty\" first—either giving it immediate initial prominence or linking directly to a concept just mentioned.",
          "whenAppropriate": "Particularly effective when the initial phrase summarises the previous sentence (\"A complete redesign was what the clients demanded\") or when contrasting a specific noun phrase directly at the start of a statement.",
          "examples": [
            {
              "sentence": "Additional funding was what the team needed.",
              "ordinaryEquivalent": "The team needed additional funding.",
              "focusedConstituent": "Additional funding (Fronted Focus)",
              "presupposedProposition": "The team needed something.",
              "pragmaticPurpose": "Fronts the key resource requirement for immediate prominence."
            },
            {
              "sentence": "Honesty was what she valued above all else.",
              "ordinaryEquivalent": "She valued honesty above all else.",
              "focusedConstituent": "Honesty",
              "presupposedProposition": "She valued some quality above all else.",
              "pragmaticPurpose": "Reverses \"What she valued above all else was honesty\"."
            },
            {
              "sentence": "Clearer safety protocols were what the union representatives demanded.",
              "ordinaryEquivalent": "The union representatives demanded clearer safety protocols.",
              "focusedConstituent": "Clearer safety protocols (Plural Subject)",
              "presupposedProposition": "The union representatives demanded something.",
              "pragmaticPurpose": "Shows mandatory plural verb \"were\" agreeing with the plural fronted noun phrase."
            },
            {
              "sentence": "That is exactly what the preliminary study suggested.",
              "ordinaryEquivalent": "The preliminary study suggested that exact point.",
              "focusedConstituent": "what the preliminary study suggested (End-focus on authority)",
              "presupposedProposition": "A point has just been stated in the discourse.",
              "pragmaticPurpose": "Demonstrative \"That\" links back to the previous sentence while the what-clause provides corroboration."
            },
            {
              "sentence": "A ten-minute delay was what caused the missed connection.",
              "ordinaryEquivalent": "A ten-minute delay caused the missed connection.",
              "focusedConstituent": "A ten-minute delay",
              "presupposedProposition": "Something caused the missed connection.",
              "pragmaticPurpose": "Highlights how small the causal factor was."
            }
          ],
          "contextualComparisons": [
            {
              "context": "Comparing standard and reversed pseudo-clefts in a report opening",
              "ordinaryForm": "The survey highlights a need for flexible working hours.",
              "cleftForm": "Standard: What the survey highlights is a need for flexible working hours.",
              "alternativeForm": "Reversed: Flexible working hours are what the survey highlights.",
              "comparisonNote": "At the very start of a report section about \"the survey\", the standard what-cleft (\"What the survey highlights is...\") is usually clearer because \"the survey\" is the known topic and the finding comes as new end-focus."
            }
          ],
          "learnerErrors": [
            {
              "incorrectOrAwkward": "Clearer guidelines was what the staff asked for.",
              "status": "Ungrammatical",
              "correctedVersion": "Clearer guidelines were what the staff asked for.",
              "diagnosticExplanation": "When a plural noun phrase (\"Clearer guidelines\") is placed before the copula as the grammatical subject, the verb MUST be plural (\"were\" / \"are\")."
            },
            {
              "incorrectOrAwkward": "Honesty was that she valued.",
              "status": "Ungrammatical",
              "correctedVersion": "Honesty was what she valued. / It was honesty that she valued.",
              "diagnosticExplanation": "Do not confuse a reversed pseudo-cleft (which requires the fused relative \"what\") with an it-cleft (which requires introductory \"It was ... that\")."
            }
          ],
          "restrictionsAndExceptions": [
            "Strict Agreement Rule: In [Plural NP + be + what-clause], the verb \"be\" is always plural (\"New turbines are what the plant needs\").",
            "Never omit \"It\" from an it-cleft thinking it has become a reversed pseudo-cleft (*\"Honesty was that she valued\")."
          ],
          "guidedPractice": {
            "taskTitle": "Two-Way Pseudo-cleft Reversal",
            "instructions": "Reverse each pseudo-cleft while checking subject–verb number agreement.",
            "items": [
              {
                "prompt": "Standard: What she valued was honesty.",
                "targetFocus": "Honesty",
                "modelAnswer": "Honesty was what she valued.",

                "modelAnswer": "Two new centrifuges are what the laboratory needs.",

            ]
          },
          "followUpQuestions": [
            {
              "id": "m5-s1-q1",

            },
            {
              "id": "m5-s1-q2",
              "role": "Interpretation",

              "options": [

                "No, because reversing a pseudo-cleft changes the sentence from positive to negative.",
                "No, because reversed pseudo-clefts are only used in questions."
              ],
              "correctAnswer": "No. A standard what-cleft places the what-clause topic first and the new focus at the end, whereas a reversed pseudo-cleft either fronts the focused noun phrase for immediate emphasis or uses an initial demonstrative (\"That is what...\") to link back to prior text.",
              "explanation": "Information packaging depends on which element is already active in the reader’s mind and which element needs end-focus or anaphoric linking."

              "correctAnswer": "What the staff survey revealed was a widespread shortage of training time.",

            }

        {
          "id": "m5-s2",
          "code": "5.2",
          "title": "Information-Order Distinctions and Anaphoric Demonstrative Clefts",
          "cefr": "B2",
          "definition": "Reversed pseudo-clefts serve two distinct discourse functions depending on what occupies the initial slot: (1) Marked Fronted Focus when a full noun phrase is stressed at the start, or (2) Anaphoric Cohesion when a demonstrative pronoun (\"This\", \"That\", \"These\") points back to the preceding clause and the what-clause itself carries the new comment.",
          "formationPattern": "Type 1 (Fronted Focus): [STRESSED NP + is/was + what-clause (given)] | Type 2 (Anaphoric Link): [This/That (given) + is/was + what/why/how-clause (NEW FOCUS)]",
          "meaningAndPresupposition": "In \"We must reduce carbon emissions. That is what the treaty requires\", the demonstrative \"That\" is given information (referring back to reducing carbon emissions), and the new focus falls at the end on \"what the treaty requires\".",
          "whenAppropriate": "Use \"This/That is what...\" in presentations, essays, and explanations to bridge two sentences cohesively while evaluating or explaining the significance of the previous statement.",
          "examples": [
            {
              "sentence": "The samples were left unrefrigerated for four hours. That was what ruined the experiment.",
              "ordinaryEquivalent": "Leaving the samples unrefrigerated for four hours ruined the experiment.",
              "focusedConstituent": "what ruined the experiment (or contrastive \"That\")",
              "presupposedProposition": "Something ruined the experiment.",
              "pragmaticPurpose": "Cohesively identifies the preceding event as the cause of the failure."
            },
            {
              "sentence": "Transparency is what the shareholders have been asking for all year.",
              "ordinaryEquivalent": "The shareholders have been asking for transparency all year.",
              "focusedConstituent": "Transparency (Fronted Noun Phrase)",
              "presupposedProposition": "The shareholders have been asking for something all year.",
              "pragmaticPurpose": "Places an abstract value noun in initial focal position."
            },
            {
              "sentence": "Regular calibration is what keeps the instrument accurate.",
              "ordinaryEquivalent": "Regular calibration keeps the instrument accurate.",
              "focusedConstituent": "Regular calibration",
              "presupposedProposition": "Something keeps the instrument accurate.",
              "pragmaticPurpose": "Emphasises a maintenance requirement in a technical manual."
            },
            {
              "sentence": "These two clauses are what caused the legal dispute.",
              "ordinaryEquivalent": "These two clauses caused the legal dispute.",
              "focusedConstituent": "These two clauses",
              "presupposedProposition": "Something caused the legal dispute.",
              "pragmaticPurpose": "Plural demonstrative noun phrase with plural copula \"are\"."
            }
          ],
          "contextualComparisons": [
            {
              "context": "Bridging from a problem description to its solution",
              "ordinaryForm": "The software crashes when large files are uploaded. A memory patch will fix this.",
              "cleftForm": "The software crashes when large files are uploaded. What will fix this is a memory patch.",
              "alternativeForm": "The software crashes when large files are uploaded. A memory patch is what we need to fix this.",
              "comparisonNote": "Both cleft versions work well, but \"What will fix this is a memory patch\" starts with the anaphoric link (\"this\") inside the what-clause and ends with the new solution (\"a memory patch\")."
            }
          ],
          "learnerErrors": [
            {
              "incorrectOrAwkward": "These two clauses is what caused the legal dispute.",
              "status": "Ungrammatical",
              "correctedVersion": "These two clauses are what caused the legal dispute.",
              "diagnosticExplanation": "A plural subject before \"be\" (\"These two clauses\") requires the plural verb \"are\"."
            }
          ],
          "restrictionsAndExceptions": [
            "When \"This\" or \"That\" begins a reversed pseudo-cleft (\"That is what I meant\"), it is overwhelmingly more natural than the non-reversed *\"What I meant is that\"."
          ],
          "guidedPractice": {
            "taskTitle": "Analyzing Anaphoric vs Fronted-Focus Reversed Pseudo-clefts",
            "instructions": "Determine whether the initial phrase introduces new fronted focus or links back to previous text.",
            "items": [

        {
          "id": "m5-s3",
          "code": "5.3",
          "title": "Structural Limitations: When Pseudo-clefts Cannot Be Reversed",
          "cefr": "C1",
          "definition": "Not every standard what-cleft can be grammatically or naturally reversed. While noun phrases and gerund (-ing) phrases reverse readily, bare infinitives, to-infinitives, and finite that-clauses are either ungrammatical or highly awkward in the initial subject slot of a reversed pseudo-cleft.",
          "formationPattern": "Grammatical Reversal: [NP / -ing phrase + be + what-clause] | Blocked Reversal: *[Bare Infinitive + be + what S did] / ?*[That-clause + be + what-clause]",
          "meaningAndPresupposition": "Standard English allows \"What she did was resign\", where the bare infinitive \"resign\" follows \"was\". However, reversing this to *\"Resign was what she did\" is ungrammatical because a bare infinitive cannot function as the subject of a finite clause.",
          "whenAppropriate": "Keep action-focused pseudo-clefts (\"What she did was resign\") and clause-focused pseudo-clefts (\"What the study showed was that...\") in standard (non-reversed) order.",
          "examples": [
            {
              "sentence": "What the director did was resign immediately. (Standard — Natural)",
              "ordinaryEquivalent": "The director resigned immediately.",
              "focusedConstituent": "resign immediately (Bare Infinitive)",
              "presupposedProposition": "The director did something.",
              "pragmaticPurpose": "Must remain in standard order; *\"Resign immediately was what the director did\" is ungrammatical."
            },

              "sentence": "Rewriting the entire chapter was what the editor recommended. (Reversed — Natural with -ing)",

              "presupposedProposition": "The editor recommended something.",
              "pragmaticPurpose": "A nominal -ing phrase functions smoothly as the subject of a reversed pseudo-cleft."

              "presupposedProposition": "The audit revealed something.",
              "pragmaticPurpose": "Reversing a heavy that-clause before \"was what...\" is stylistically clumsy and avoided in good prose."
            },
            {

              "ordinaryEquivalent": "Swimming every morning keeps him fit.",
              "focusedConstituent": "Swimming every morning (-ing Clause)",
              "presupposedProposition": "Something keeps him fit.",
              "pragmaticPurpose": "Gerund clauses reverse naturally because they behave like noun phrases."
            }
          ],
          "contextualComparisons": [
            {
              "context": "Comparing reversal of Noun Phrase vs Bare Infinitive",
              "ordinaryForm": "The team leader apologised to the clients.",
              "cleftForm": "Standard Action Cleft: What the team leader did was apologise to the clients.",
              "alternativeForm": "Nominalised Reversal: An apology to the clients was what the team leader offered.",
              "comparisonNote": "If you want a reversed pseudo-cleft for an action, convert the verb into a noun phrase (\"An apology...\") or an -ing phrase (\"Apologising...\"), never a bare infinitive (*\"Apologise...\")."
            }

          "learnerErrors": [
            {

              "status": "Ungrammatical",
              "correctedVersion": "What the board did was cancel the contract. / Cancelling the contract was what the board decided to do.",
              "diagnosticExplanation": "A bare infinitive phrase (\"Cancel the contract\") cannot occupy the grammatical subject position before \"was\"."

          "restrictionsAndExceptions": [

            "Gerund-participle (-ing) phrases (\"Checking the oil was what he did first\") and noun phrases reverse freely."

          "guidedPractice": {

          "id": "m6-s1",
          "code": "6.1",
          "title": "Core All-cleft Patterns: Restriction, Exhaustiveness and Sufficiency",
          "cefr": "B1",
          "definition": "An all-cleft is a pseudo-cleft variant in which \"All (that)\" replaces \"What\" at the start of the nominal relative clause. Here \"All\" means \"the only thing that\" (singular/exhaustive), rather than \"every member of a group\".",
          "formationPattern": "[All + (that) + Subject + Verb] + [is / was] + [Focused Complement (NP / Infinitive / That-clause)]",
          "meaningAndPresupposition": "While \"What I need is a quiet room\" identifies what is needed, \"All I need is a quiet room\" adds a downward-limiting meaning: \"I need a quiet room, and I need nothing more than that.\" In instructions (\"All you have to do is press this button\"), it reassures the listener that the required action is simple and sufficient.",
          "whenAppropriate": "Use all-clefts in user guides, reassuring explanations, and negotiations when you want to emphasise that a requirement is modest, a step is straightforward, or an outcome was limited.",
          "examples": [

              "sentence": "All I need is a quiet room for twenty minutes.",
              "ordinaryEquivalent": "I only need a quiet room for twenty minutes.",
              "focusedConstituent": "a quiet room for twenty minutes",

              "pragmaticPurpose": "Emphasises that the speaker’s requirement is modest and easily satisfied."

              "correctAnswer": "All the residents asked for was better street lighting.",
              "explanation": "In \"All (that) the residents asked for was better street lighting\", \"All\" means \"The only thing that\" and takes singular \"was\". In the other three sentences, \"All the [plural noun]\" means \"Every [noun]\"."

        {
          "id": "m6-s3",
          "code": "6.3",
          "title": "Infinitival Variants, Style and Pragmatic Caution in All-clefts",
          "cefr": "C1",
          "definition": "When an all-cleft focuses an action (\"All I did was...\", \"All you need to do is...\"), the post-copular verb appears as a bare infinitive or a to-infinitive. After \"All that remains is...\", however, a to-infinitive is obligatory because the relative clause does not contain the pro-verb \"do\".",
          "formationPattern": "With \"do\": [All (that) + S + do/did + is/was + (to) V-inf] | Without \"do\": [All that remains / is needed + is/was + to V-inf]",
          "meaningAndPresupposition": "Because all-clefts strongly frame the focused item as small, easy, or minimal, they carry interpersonal weight. Saying \"All you have to do is complete Form 4B\" is helpful if Form 4B takes two minutes, but patronising if Form 4B is thirty pages long.",
          "whenAppropriate": "Use \"All that remains is to...\" in formal academic conclusions and procedural writing. Use \"All you have to do is...\" in supportive instructions only when the step is genuinely straightforward.",
          "examples": [
            {
              "sentence": "All that remains is to verify the calibration under field conditions.",
              "ordinaryEquivalent": "Only verifying the calibration under field conditions remains.",
              "focusedConstituent": "to verify the calibration under field conditions (Obligatory to-infinitive)",
              "presupposedProposition": "One final task remains.",
              "pragmaticPurpose": "Formal academic transition to future work."
            },
            {
              "sentence": "All the software update does is patch the security vulnerability.",
              "ordinaryEquivalent": "The software update only patches the security vulnerability.",
              "focusedConstituent": "patch the security vulnerability (Bare infinitive after \"does\")",
              "presupposedProposition": "The software update does something.",
              "pragmaticPurpose": "Reassures users that the update will not alter their interface."
            },
            {
              "sentence": "All the witness could do was describe the vehicle’s colour.",
              "ordinaryEquivalent": "The witness could only describe the vehicle’s colour.",
              "focusedConstituent": "describe the vehicle’s colour",
              "presupposedProposition": "The witness could do something limited.",
              "pragmaticPurpose": "Expresses limited capability in an investigative report."
            },
            {
              "sentence": "All we are asking for is a two-week extension.",
              "ordinaryEquivalent": "We are only asking for a two-week extension.",
              "focusedConstituent": "a two-week extension",
              "presupposedProposition": "We are asking for something.",
              "pragmaticPurpose": "Frames a negotiation request as reasonable and moderate."
            }
          ],
          "contextualComparisons": [
            {
              "context": "Comparing \"All I did was...\" vs \"All that remains is...\" infinitive requirements",
              "ordinaryForm": "We now only need to sign the contract.",
              "cleftForm": "With \"do\": All we have to do now is (to) sign the contract. (\"to\" optional)",
              "alternativeForm": "With \"remains\": All that remains now is to sign the contract. (\"to\" obligatory)",
              "comparisonNote": "The bare infinitive is licensed only when a form of \"do\" appears in the subject clause (\"All we have to do...\"). After verbs like \"remain\", the full to-infinitive (\"to sign\") is required."
            }
          ],
          "learnerErrors": [
            {
              "incorrectOrAwkward": "All that remains is sign the contract.",
              "status": "Ungrammatical",
              "correctedVersion": "All that remains is to sign the contract.",
              "diagnosticExplanation": "Because the subject clause uses \"remains\" rather than \"do\", the post-copular infinitive must retain \"to\" (\"to sign\")."
            },

              "incorrectOrAwkward": "In a surgical manual: \"All the surgeon has to do is reconstruct the damaged artery.\"",

            }
          ],
          "restrictionsAndExceptions": [
            "Bare infinitive licensing rule: A bare infinitive after \"be\" requires a form of the auxiliary/pro-verb \"do\" in the relative clause.",
            "Avoid \"All you need to do is...\" when addressing complex, high-effort tasks in professional or academic styles."
          ],
          "guidedPractice": {
            "taskTitle": "Checking Infinitive Licensing and Pragmatic Tone",

            {
              "id": "m6-s3-q1",

              "prompt": "Why is “to” obligatory in “All that remains is to submit the dossier”, whereas it is optional in “All we have to do is (to) submit the dossier”?",
              "options": [
