<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cleft and Pseudo-cleft Sentences (CEFR B1–C1) | Shared Pearls of Wisdom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Merriweather:ital,wght@0,700;0,900;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bc-navy: #1E064E;
      --bc-navy-dark: #120330;
      --bc-blue: #004494;
      --bc-blue-bright: #0057B8;
      --bc-green: #006B34;
      --bc-magenta: #9E0031;
      --bc-burgundy: #8B1E3F;
      --bc-canvas: #EEF2F7;
      --bc-surface: #FFFFFF;
      --bc-lavender: #F2EFF9;
      --bc-ice: #EBF4FC;
      --bc-sage: #EBF3F0;
      --bc-text: #0F172A;
      --bc-muted: #1E293B;
      --bc-border: #BAC7DC;
    }

    * {
      box-sizing: border-box;
    }

    html {
      font-size: 15.75px;
      scroll-behavior: smooth;
      overflow-x: hidden;
    }

    @media (min-width: 1280px) {
      html {
        font-size: 16.25px;
      }
    }

    body {
      font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bc-canvas);
      color: var(--bc-text);
      line-height: 1.65;
      margin: 0;
      padding: 0;
      font-weight: 500;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, .serif-heading {
      font-family: "Merriweather", Georgia, "Times New Roman", serif;
      margin-top: 0;
      line-height: 1.35;
    }

    /* Crisp white headings inside dark blue hero stage & top navigation bar */
    .hero-3d h1,
    .hero-3d h2,
    .hero-3d h3,
    .hero-3d .serif-heading,
    .topbar .serif-heading {
      color: #FFFFFF !important;
    }

    code, pre {
      font-family: "JetBrains Mono", Consolas, monospace;
    }

    /* Sticky Top Bar with Formal Crest */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--bc-navy);
      color: #FFFFFF;
      border-bottom: 4px solid var(--bc-blue);
      padding: 0.75rem 2.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      box-shadow: 0 10px 24px -4px rgba(18, 3, 48, 0.45);
    }

    .logo-lockup {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: #FFFFFF;
    }

    .logo-crest-ring {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      padding: 2px;
      background: linear-gradient(135deg, #FFF3B8, #C89B2B, #6B4A09);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.45);
    }

    .nav-links {
      display: flex;
      gap: 0.55rem;
      flex-wrap: wrap;
    }

    .nav-btn {
      background: #2D0C70;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-bottom: 4px solid #090119;
      color: #FFFFFF;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 0.45rem 0.9rem;
      border-radius: 0.65rem;
      cursor: pointer;
      transition: transform 120ms ease;
    }

    .nav-btn:hover {
      transform: translateY(-1px);
    }

    .nav-btn.active {
      background: #FEF08A;
      color: #1E064E;
      border-color: #FFFFFF;
    }

    /* 3D Hero Architecture on the Landing Page */
    .hero-3d {
      position: relative;
      background:
        radial-gradient(circle at 82% 22%, rgba(0, 140, 255, 0.28) 0%, transparent 48%),
        radial-gradient(circle at 18% 80%, rgba(139, 30, 63, 0.32) 0%, transparent 50%),
        linear-gradient(135deg, #140338 0%, #23085A 48%, #003A80 100%);
      color: #FFFFFF;
      padding: 2.25rem 2.25rem;
      border-bottom: 6px solid #0B0220;
      box-shadow: 0 18px 40px -10px rgba(18, 3, 48, 0.45);
      overflow: hidden;
    }

    .prism-3d-card {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.06) 100%);
      border: 2px solid rgba(255, 255, 255, 0.32);
      border-bottom: 7px solid #090119;
      border-right: 5px solid #090119;
      border-radius: 1.15rem;
      padding: 1.35rem;
      box-shadow: 0 22px 44px -12px rgba(0, 0, 0, 0.52);
    }

    .prism-3d-block {
      border-radius: 0.75rem;
      border: 2px solid rgba(255, 255, 255, 0.85);
      border-bottom: 5px solid rgba(9, 2, 28, 0.85);
      border-right: 3px solid rgba(9, 2, 28, 0.75);
      padding: 0.65rem 0.75rem;
      box-shadow: 0 10px 18px -4px rgba(0, 0, 0, 0.35);
    }

    .container {
      max-width: 1220px;
      margin: 0 auto;
      padding: 2rem 2.25rem;
    }

    @media (max-width: 640px) {
      .container {
        padding: 1.25rem 1rem;
      }
      .topbar, .hero-3d {
        padding-left: 1rem;
        padding-right: 1rem;
      }
    }

    .card-3d {
      background: var(--bc-surface);
      border: 2px solid var(--bc-border);
      border-bottom: 6px solid var(--bc-navy);
      border-right: 4px solid #301170;
      border-radius: 1rem;
      padding: 1.75rem 2rem;
      box-shadow: 0 14px 28px -6px rgba(30, 6, 78, 0.14);
      margin-bottom: 1.5rem;
    }

    /* Framed Desk Surface & Publication Sheet with >= 1-Inch Right-Hand Margin */
    .document-desk-frame {
      background: linear-gradient(180deg, #E2E8F0 0%, #EDF2F7 100%);
      border: 2px solid #BAC7DC;
      border-radius: 1.15rem;
      padding: 2.25rem 1in;
      box-shadow: inset 0 2px 6px rgba(15, 23, 42, 0.08);
      margin-top: 1.5rem;
      margin-bottom: 2rem;
    }

    .paper-sheet {
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      background: #FFFFFF;
      border: 2px solid #CBD5E1;
      border-bottom: 8px solid #1C2331;
      border-right: 5px solid #1C2331;
      border-radius: 0.75rem;
      /* Strictly >= 1.15 inches on the right-hand side and 1.0 inch on the left-hand side */
      padding: 2rem 1.15in 2.25rem 1in;
      box-shadow: 0 18px 36px -8px rgba(15, 23, 42, 0.16);
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    @media (max-width: 768px) {
      .document-desk-frame {
        padding: 1rem;
      }
      .paper-sheet {
        padding: 1.5rem 0.65in 1.5rem 0.5in;
      }
    }

    .slab-3d {
      background: #F8FAFC;
      border: 1.5px solid #B8C4D9;
      border-bottom: 4px solid #334155;
      border-right: 3px solid #475569;
      border-radius: 0.85rem;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }

    .btn {
      display: inline-block;
      padding: 0.5rem 1rem;
      border-radius: 0.65rem;
      font-size: 0.82rem;
      font-weight: 700;
      border: 1px solid var(--bc-border);
      border-bottom: 4px solid rgba(0, 0, 0, 0.45);
      border-right: 2px solid rgba(0, 0, 0, 0.35);
      cursor: pointer;
      background: #FFFFFF;
      color: var(--bc-navy);
      transition: transform 120ms ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary { background: var(--bc-navy); color: #FFFFFF; border-color: var(--bc-navy); }
    .btn-blue { background: var(--bc-blue); color: #FFFFFF; border-color: var(--bc-blue); }
    .btn-green { background: var(--bc-green); color: #FFFFFF; border-color: var(--bc-green); }
    .btn-burgundy { background: var(--bc-burgundy); color: #FFFFFF; border-color: var(--bc-burgundy); }
    .btn-yellow { background: #FEF08A; color: #1E064E; border-color: #FFFFFF; font-weight: 800; }

    .grid-12 {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 1.5rem;
    }
    .col-3 { grid-column: span 3; }
    .col-4 { grid-column: span 4; }
    .col-5 { grid-column: span 5; }
    .col-6 { grid-column: span 6; }
    .col-7 { grid-column: span 7; }
    .col-9 { grid-column: span 9; }
    .col-12 { grid-column: span 12; }

    @media (max-width: 960px) {
      .col-3, .col-4, .col-5, .col-6, .col-7, .col-9 {
        grid-column: span 12;
      }
    }

    table {
      width: 100%;
      max-width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      word-wrap: break-word;
      overflow-wrap: anywhere;
      margin: 0.85rem 0 1.4rem 0;
      font-size: 0.9rem;
    }

    th {
      background: #1C2331;
      color: #FFFFFF;
      text-align: left;
      padding: 0.65rem 0.75rem;
      border: 1px solid #1C2331;
      line-height: 1.4;
    }

    td {
      padding: 0.7rem 0.75rem;
      border: 1px solid #CBD5E1;
      vertical-align: top;
      color: #0F172A;
      background: #FFFFFF;
      line-height: 1.55;
    }

    .annotation-box {
      background: #EBF3F0;
      border-left: 5px solid #2C6E63;
      border-top: 1px solid #C6DFD7;
      border-right: 1px solid #C6DFD7;
      border-bottom: 1px solid #C6DFD7;
      padding: 1.1rem 1.25rem;
      margin: 1.15rem 0;
      border-radius: 0.45rem;
    }

    .running-header {
      border-bottom: 2px solid #8B1E3F;
      padding-bottom: 0.5rem;
      margin-bottom: 1.5rem;
      color: #374151;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .tile-3d {
      display: inline-block;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      border: 2px solid #94A3B8;
      border-bottom: 5px solid #1E064E;
      border-right: 3px solid #1E064E;
      background: #FFFFFF;
      cursor: pointer;
      margin: 0.25rem;
      text-align: left;
      transition: transform 140ms ease;
    }

    .tile-3d:hover {
      transform: translateY(-2px);
    }

    .tile-3d.active {
      background: var(--bc-navy);
      color: #FFFFFF;
      border-color: #38BDF8;
    }

    .input-text {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border: 2px solid #94A3B8;
      border-radius: 0.65rem;
      font-size: 0.95rem;
      margin-top: 0.35rem;
      font-family: inherit;
    }

    .feedback-ok {
      background: #EBF3F0;
      border: 2px solid #006B34;
      color: #004D25;
      padding: 0.85rem;
      border-radius: 0.65rem;
      margin-top: 0.5rem;
    }

    .feedback-err {
      background: #FFF5F7;
      border: 2px solid #9E0031;
      color: #7A0026;
      padding: 0.85rem;
      border-radius: 0.65rem;
      margin-top: 0.5rem;
    }

    .certificate-frame {
      background: radial-gradient(circle at 50% 25%, #FFFFFF 0%, #FAFAF7 100%);
      border: 6px double #1E064E;
      box-shadow: 0 20px 48px -10px rgba(18, 3, 48, 0.22), inset 0 0 0 3px #FBF3D5, inset 0 0 0 5px #C89B2B;
      border-radius: 1.15rem;
      padding: 3rem 2.5rem 2.5rem 2.5rem;
      max-width: 960px;
      margin: 1.5rem auto 2rem auto;
      text-align: center;
      position: relative;
    }
    @media (max-width: 768px) {
      .certificate-frame {
        padding: 1.75rem 1rem;
      }
    }

    @media print {
      @page {
        size: A4 portrait;
        margin: 0.4in;
      }
      .no-print {
        display: none !important;
      }
      body {
        background: #FFFFFF !important;
      }
      .card-3d, .document-desk-frame {
        box-shadow: none !important;
        background: #FFFFFF !important;
        padding: 0 !important;
        border: none !important;
      }
      .certificate-frame {
        border: 5px double #1E064E !important;
        box-shadow: none !important;
        page-break-inside: avoid !important;
        padding: 2rem 1.5rem !important;
        margin: 0 auto !important;
      }
    }
  </style>
</head>

  "modules": [
    {
      "id": 1,
      "code": "Module 01",
      "title": "Foundations of Clefting and Information Focus",
      "cefr": "B1",
      "summary": "Ordinary SVO word order, identifying focused versus backgrounded information, neutral versus marked sentence patterns, basic cleft recognition, and the distinction between grammatical focus and spoken stress.",
      "modelSentence": "The research assistant found the error. → It was the research assistant who found the error.",
      "learningObjectives": [
        "Distinguish ordinary Subject–Verb–Object (SVO) clauses from grammatically marked focus patterns.",
        "Separate focused (new or highlighted) information from presupposed (assumed or backgrounded) information.",
        "Recognise basic it-clefts and what-clefts and distinguish them from dummy-it weather/time clauses.",
        "Compare grammatical clefting with prosodic stress, passive voice, questions, and fronting."
      ],
      "foundationalCautions": [
        "Not every sentence beginning with \"It is\" or \"It was\" is a cleft; weather, time, and delayed-subject clauses (\"It is raining\", \"It is important to check\") do not cleave a single clause into two parts.",
        "In spoken English, stress alone can shift focus without changing word order; in written English, clefting makes the focus unambiguous on the page."
      ],
      "subsections": [
        {
          "id": "m1-s1",
          "code": "1.1",
          "title": "Ordinary Word Order, Clause Constituents and Neutral Focus",
          "cefr": "B1",
          "definition": "An ordinary English declarative clause typically follows Subject–Verb–Object–Adjunct (SVOA) order. When spoken without special contrastive intonation, the sentence carries broad or end-placed neutral focus, presenting the event as a whole or placing the newest piece of information near the end of the clause.",
          "formationPattern": "[Subject (Agent/Topic)] + [Finite Verb] + [Object / Complement] + [Adjunct of Place / Time / Reason]",
          "meaningAndPresupposition": "In an ordinary clause such as \"The research assistant found the error yesterday\", the writer normally treats the subject (\"the research assistant\") as the known starting point (given topic) and presents the predicate (\"found the error yesterday\") as new commentary. No single constituent is grammatically isolated as the sole answer to a hidden question.",
          "whenAppropriate": "Ordinary SVOA order is the default choice in narrative reporting, routine business emails, and clear academic prose whenever the context does not require correcting a misunderstanding or singling out one participant, time, or cause.",
          "examples": [
            {
              "sentence": "The research assistant found the error in the spreadsheet.",
              "ordinaryEquivalent": "The research assistant found the error in the spreadsheet.",
              "focusedConstituent": "found the error in the spreadsheet (broad predicate focus)",
              "presupposedProposition": "A research assistant was reviewing the work.",
              "pragmaticPurpose": "Reports an event neutrally in chronological sequence."
            },
            {
              "sentence": "Elena sent the revised contract to the client on Tuesday.",
              "ordinaryEquivalent": "Elena sent the revised contract to the client on Tuesday.",
              "focusedConstituent": "on Tuesday (natural end-focus)",
              "presupposedProposition": "Elena was responsible for sending the revised contract.",
              "pragmaticPurpose": "Answers a general inquiry about when the routine action occurred."
            },
            {
              "sentence": "Our logistics team relocated the warehouse to Bristol last autumn.",
              "ordinaryEquivalent": "Our logistics team relocated the warehouse to Bristol last autumn.",
              "focusedConstituent": "to Bristol last autumn (neutral end-placed adjuncts)",
              "presupposedProposition": "The company has a logistics team and a warehouse.",
              "pragmaticPurpose": "Provides straightforward factual background in a company report."
            },
            {
              "sentence": "The regional director approved the training budget after the audit.",
              "ordinaryEquivalent": "The regional director approved the training budget after the audit.",
              "focusedConstituent": "approved the training budget after the audit",
              "presupposedProposition": "A training budget awaited approval.",
              "pragmaticPurpose": "States an administrative decision without implying prior dispute."
            },
            {
              "sentence": "Several laboratory technicians noticed the temperature drop at midnight.",
              "ordinaryEquivalent": "Several laboratory technicians noticed the temperature drop at midnight.",
              "focusedConstituent": "the temperature drop at midnight",
              "presupposedProposition": "Technicians were monitoring the laboratory.",
              "pragmaticPurpose": "Describes an observation in a laboratory incident log."
            }
          ],
          "contextualComparisons": [
            {
              "context": "Answering the general question \"What happened at the meeting?\"",
              "ordinaryForm": "The treasurer presented the annual audit.",
              "cleftForm": "It was the treasurer who presented the annual audit.",
              "alternativeForm": "The annual audit was presented by the treasurer.",
              "comparisonNote": "When the whole event is new (\"What happened?\"), the ordinary SVO form is natural. The it-cleft sounds unnatural here because nobody has yet assumed that someone presented the annual audit."
            }
          ],
          "learnerErrors": [
            {
              "incorrectOrAwkward": "Q: What happened this morning? A: It was the server that crashed at nine o’clock.",
              "status": "Contextually Inappropriate",
              "correctedVersion": "Q: What happened this morning? A: The server crashed at nine o’clock.",
              "diagnosticExplanation": "An it-cleft presupposes that the listener already knows something crashed at nine o’clock. To report an entirely new event, use ordinary SVO word order."
            },
            {
              "incorrectOrAwkward": "Yesterday found the research assistant the error in the table.",
              "status": "Ungrammatical",
              "correctedVersion": "Yesterday, the research assistant found the error in the table.",
              "diagnosticExplanation": "Fronting a time adjunct (\"Yesterday\") in a standard declarative clause does not trigger subject–verb inversion in English."
            }
          ],
          "restrictionsAndExceptions": [
            "English fixed word order prevents moving a direct object immediately before the verb without changing the grammatical structure.",
            "While spoken English can highlight any word through vocal pitch and volume (\"THE RESEARCH ASSISTANT found the error\"), written English relies on structural choices because readers cannot hear the writer’s voice."
          ],
          "guidedPractice": {
            "taskTitle": "Constituent Role and Question Pairing",
            "instructions": "Examine each ordinary sentence and determine which constituent answers the specific question in brackets.",
            "items": [
              {
                "prompt": "Dr Patel signed the discharge summary at noon. [Question: Who signed the summary?]",
                "targetFocus": "Dr Patel (Subject)",
                "modelAnswer": "Focused constituent: \"Dr Patel\" | Assumed background: Someone signed the discharge summary at noon.",
                "commentary": "When the question asks \"Who?\", the subject carries narrow information focus."
              },
              {
                "prompt": "Dr Patel signed the discharge summary at noon. [Question: Which document did Dr Patel sign?]",
                "targetFocus": "the discharge summary (Direct Object)",
                "modelAnswer": "Focused constituent: \"the discharge summary\" | Assumed background: Dr Patel signed a document at noon.",
                "commentary": "When the question asks \"Which document?\", the direct object becomes the focused constituent."
              }
            ]
          },
          "followUpQuestions": [
            {
              "id": "m1-s1-q1",
              "role": "Recognition",
              "type": "mcq",
              "prompt": "What receives focus in “It was yesterday that the results arrived”?",
              "options": [
                "yesterday (the time adjunct)",
                "the results (the grammatical subject)",
                "arrived (the lexical verb)",
                "It was (the introductory dummy clause)"
              ],
              "correctAnswer": "yesterday (the time adjunct)",
              "explanation": "In an it-cleft, the constituent placed immediately between \"It + be\" and the relative clause (\"yesterday\") receives narrow grammatical focus."
            },
            {
              "id": "m1-s1-q2",
              "role": "Interpretation",
              "type": "mcq",
              "prompt": "In “It was yesterday that the results arrived”, what information remains assumed or backgrounded?",
              "options": [
                "That the results arrived at some time.",
                "That the results were inaccurate.",
                "That nobody expected the results to arrive.",
                "That the results will arrive again tomorrow."
              ],
              "correctAnswer": "That the results arrived at some time.",
              "explanation": "The subordinate that-clause (\"that the results arrived\") expresses the presupposed proposition already treated as shared background knowledge."
            },
            {
              "id": "m1-s1-q3",
              "role": "Construction",
              "type": "mcq",
              "prompt": "Base sentence: “The research assistant found the error.” Which version would correct a mistaken assumption about the person who found it?",
              "options": [
                "It was the research assistant who found the error.",
                "It was the error that the research assistant found.",
                "What the research assistant did was find the error.",
                "It was important that the research assistant found the error."
              ],
              "correctAnswer": "It was the research assistant who found the error.",
              "explanation": "Placing \"the research assistant\" in the focal slot after \"It was\" and introducing the background clause with \"who\" highlights the person and repairs a false assumption about who found the error."
            }
          ]
        },
        {
          "id": "m1-s2",
          "code": "1.2",
          "title": "Given versus New Information and the Principle of Clefting",
          "cefr": "B1",
          "definition": "To \"cleave\" means to divide a single clause into two grammatical sections so that one constituent is explicitly spotlighted (focused) while the rest of the proposition is packaged as known or presupposed background.",
          "formationPattern": "Single Clause [X did Y] → Divided Cleft Structure: [Focal Frame highlighting X] + [Background Clause presupposing Y]",
          "meaningAndPresupposition": "Every cleft sentence divides meaning into two layers: (1) the Assertion (the focused identity or choice), and (2) the Presupposition (the background event that remains true even if the listener disagrees about the focused item).",
          "whenAppropriate": "Use a cleft when the listener or reader already knows (or can reasonably infer) that an action took place, and the communicative priority is to identify the exact person, object, time, place, or reason involved.",
          "examples": [
            {
              "sentence": "It was the catering manager who ordered the extra chairs.",
              "ordinaryEquivalent": "The catering manager ordered the extra chairs.",
              "focusedConstituent": "the catering manager",
              "presupposedProposition": "Someone ordered the extra chairs.",
              "pragmaticPurpose": "Identifies the specific staff member responsible for a known order."
            },
            {
              "sentence": "It was the faulty valve that caused the pressure drop.",
              "ordinaryEquivalent": "The faulty valve caused the pressure drop.",
              "focusedConstituent": "the faulty valve",
              "presupposedProposition": "Something caused the pressure drop.",
              "pragmaticPurpose": "Pinpoints the mechanical cause during a maintenance briefing."
            },
            {
              "sentence": "What the students requested was a clearer marking scheme.",
              "ordinaryEquivalent": "The students requested a clearer marking scheme.",
              "focusedConstituent": "a clearer marking scheme",
              "presupposedProposition": "The students requested something.",
              "pragmaticPurpose": "Places the new information at the end of the sentence after announcing the topic."
            },
            {
              "sentence": "It was in Glasgow that the two engineers first collaborated.",
              "ordinaryEquivalent": "The two engineers first collaborated in Glasgow.",
              "focusedConstituent": "in Glasgow",
              "presupposedProposition": "The two engineers first collaborated somewhere.",
              "pragmaticPurpose": "Highlights the city of their first collaboration."
            }
          ],
          "contextualComparisons": [
            {
              "context": "Distinguishing true clefts from introductory-it pattern and weather/description \"it\"",
              "ordinaryForm": "To back up the database daily is essential.",
              "cleftForm": "It is the database that we back up daily. (True it-cleft)",
              "alternativeForm": "It is essential to back up the database daily. (Introductory-It Pattern — NOT a cleft)",
              "comparisonNote": "Test for a true it-cleft: remove \"It + be\" and the relative marker (\"that/who\"), then restore the remaining words into a single clause (\"We back up the database daily\"). You cannot do this with \"It is raining\" or \"It is essential to check\"."
            }
          ],
          "learnerErrors": [
            {
              "incorrectOrAwkward": "Student analysis: \"It is cold in the lecture hall\" is an it-cleft focusing on \"cold\".",
              "status": "Ungrammatical",
              "correctedVersion": "Analysis: \"It is cold in the lecture hall\" is an ambient dummy-it clause, not a cleft.",
              "diagnosticExplanation": "Adjectives like \"cold\" cannot be combined with \"in the lecture hall\" to form a complete single clause (*\"Cold in the lecture hall\"). There is no relative clause following \"cold\"."
            },
            {
              "incorrectOrAwkward": "It was the printer was broken this morning.",
              "status": "Ungrammatical",
              "correctedVersion": "It was the printer that was broken this morning.",
              "diagnosticExplanation": "When focusing on the grammatical subject in an it-cleft, the relative marker (\"that\" or \"who\") cannot be omitted in standard British English."
            }
          ],
          "restrictionsAndExceptions": [
            "A true it-cleft always contains two finite verbs: a form of \"be\" after \"It\", and the verb inside the subordinate relative clause.",
            "Predicative adjectives alone (*\"It was exhausted that she felt\") are generally resisted in standard English it-clefts; speakers prefer ordinary intensifiers (\"She felt completely exhausted\") or pseudo-clefts."
          ],
          "guidedPractice": {
            "taskTitle": "Cleft Recognition vs Dummy-It Diagnostic",
            "instructions": "Apply the removal test (delete \"It + be + that/who\") to verify whether each sentence is a genuine cleft.",
            "items": [
              {
                "prompt": "It was the finance committee that delayed the proposal.",
                "targetFocus": "Genuine it-cleft",
                "modelAnswer": "Remove \"It was ... that\" → \"The finance committee delayed the proposal.\" (Complete single clause = True it-cleft).",
                "commentary": "Passes the single-clause reduction test."
              },
              {
                "prompt": "It was obvious that the train would be late.",
                "targetFocus": "delayed-subject adjective clause (Not a cleft)",
                "modelAnswer": "Removing \"It was ... that\" leaves *\"obvious the train would be late\". Instead, the clause \"That the train would be late was obvious\" has been delayed-subject.",
                "commentary": "Introductory-It Pattern moves a heavy subject clause to the end; it does not cleave an existing clause."
              }
            ]
          },
          "followUpQuestions": [
            {
              "id": "m1-s2-q1",
              "role": "Recognition",
              "type": "mcq",
              "prompt": "Which of the following sentences is a genuine it-cleft construction?",
              "options": [
                "It was the senior technician who calibrated the microscope.",
                "It was fortunate that the rain stopped before the ceremony.",
                "It is twenty miles from the station to the research centre.",
                "It appears that the software update has finished."
              ],
              "correctAnswer": "It was the senior technician who calibrated the microscope.",
              "explanation": "Only \"It was the senior technician who calibrated the microscope\" divides a single underlying clause (\"The senior technician calibrated the microscope\") into a focused constituent and a backgrounded relative clause."
            },
            {
              "id": "m1-s2-q2",
              "role": "Construction",
              "type": "rewrite",
              "prompt": "Rewrite the ordinary sentence “The acoustics in the hall ruined the recording” as an it-cleft focusing on “the acoustics in the hall”.",
              "correctAnswer": "It was the acoustics in the hall that ruined the recording.",
              "acceptableAlternatives": [
                "It was the acoustics in the hall which ruined the recording."
              ],
              "explanation": "Place the subject noun phrase \"the acoustics in the hall\" after \"It was\" (singular \"was\" is standard in it-clefts regardless of plural noun phrases) followed by \"that ruined the recording\"."
            },
            {
              "id": "m1-s2-q3",
              "role": "Interpretation",
              "type": "mcq",
              "prompt": "Why is “It is essential that all visitors sign the style” NOT classified as an it-cleft?",
              "options": [
                "Because \"essential\" is an adjective licensing an delayed-subject subject clause (\"That all visitors sign the style is essential\"), not a constituent extracted from inside the subordinate clause.",
                "Because it uses the present tense \"is\" rather than the past tense \"was\".",
                "Because \"visitors\" is plural and cannot appear in a cleft.",
                "Because \"that\" can never be used in cleft sentences."
              ],
              "correctAnswer": "Because \"essential\" is an adjective licensing an delayed-subject subject clause (\"That all visitors sign the style is essential\"), not a constituent extracted from inside the subordinate clause.",
              "explanation": "In introductory-it pattern, the that-clause functions as the logical subject of \"is essential\". Nothing has been extracted from inside \"all visitors sign the style\"."
            }
          ]
        },
        {
          "id": "m1-s3",
          "code": "1.3",
          "title": "Comparing Clefts with Spoken Stress, Passive Voice and Fronting",
          "cefr": "B1",
          "definition": "English offers several ways to organise emphasis and information flow: prosodic stress (in speech), passive voice (reordering agent and patient), fronting (moving an element to the start of the clause), and clefting (dividing one clause into two).",
          "formationPattern": "Neutral: [S + V + O] | Passive: [O + be + V-ed + by S] | Fronting: [O/Adjunct + S + V] | It-cleft: [It + be + X + that/who + clause]",
          "meaningAndPresupposition": "While passive voice shifts the patient to topic position and places the agent at the end (\"The error was found by the research assistant\"), an it-cleft creates an explicit identifying equation (\"It was the research assistant who found the error\") with a stronger presupposition and narrower focus.",
          "whenAppropriate": "Choose passive voice when the action or affected object is the natural paragraph topic; choose clefting when you need to single out one specific element for identification or contrast in writing.",
          "examples": [
            {
              "sentence": "Passive: The error was found by the research assistant.",
              "ordinaryEquivalent": "The research assistant found the error.",
              "focusedConstituent": "by the research assistant (end-focus)",
              "presupposedProposition": "An error is under discussion.",
              "pragmaticPurpose": "Maintains \"the error\" as the grammatical subject and discourse topic."
            },
            {
              "sentence": "It-cleft: It was the research assistant who found the error.",
              "ordinaryEquivalent": "The research assistant found the error.",
              "focusedConstituent": "the research assistant (marked fronted focus)",
              "presupposedProposition": "Someone found the error.",
              "pragmaticPurpose": "Specifically identifies or corrects who discovered the error."
            },
            {
              "sentence": "What-cleft: What the research assistant found was a calculation error.",
              "ordinaryEquivalent": "The research assistant found a calculation error.",
              "focusedConstituent": "a calculation error (end-focus after copula)",
              "presupposedProposition": "The research assistant found something.",
              "pragmaticPurpose": "Builds anticipation before naming the specific discovery."
            },
            {
              "sentence": "Fronting: This particular error the assistant spotted immediately.",
              "ordinaryEquivalent": "The assistant spotted this particular error immediately.",
              "focusedConstituent": "This particular error (thematic link) + immediately (end-focus)",
              "presupposedProposition": "Several errors or items were being checked.",
              "pragmaticPurpose": "Links directly to a previously mentioned item without adding a second verb."
            }
          ],
          "contextualComparisons": [
            {
              "context": "Continuing a paragraph that is already discussing \"the faulty sensor\"",
              "ordinaryForm": "A technician replaced the faulty sensor on Friday.",
              "cleftForm": "It was a technician who replaced the faulty sensor on Friday.",
              "alternativeForm": "The faulty sensor was replaced on Friday by a junior technician.",
              "comparisonNote": "If the paragraph topic is \"the faulty sensor\", the passive keeps the topic at the start of the sentence smoothly, whereas an it-cleft unnecessarily interrupts topic continuity unless someone disputed who replaced it."
            }
          ],
          "learnerErrors": [
            {
              "incorrectOrAwkward": "It was found the error by the research assistant.",
              "status": "Ungrammatical",
              "correctedVersion": "The error was found by the research assistant. / It was the research assistant who found the error.",
              "diagnosticExplanation": "Do not blend passive inversion with an incomplete it-cleft. Either use a standard passive clause or a complete it-cleft with a focused noun phrase and relative clause."
            },
            {
              "incorrectOrAwkward": "In every sentence of an essay, using an it-cleft to sound more advanced.",
              "status": "Non-idiomatic",
              "correctedVersion": "Reserve clefts for genuine points of contrast, clarification, or transition.",
              "diagnosticExplanation": "Overusing clefts makes prose heavy and artificial because every sentence demands special attention."
            }
          ],
          "restrictionsAndExceptions": [
            "In spoken conversation, prosodic prominence (\"MÁYA prepared the report\") often accomplishes what an it-cleft does in print.",
            "Passive voice is restricted to transitive verbs, whereas it-clefts can focus time, place, or reason adjuncts even with intransitive verbs (\"It was at dawn that the ferry departed\")."
          ],
          "guidedPractice": {
            "taskTitle": "Selecting Between Passive, Ordinary Order, and Clefting",
            "instructions": "Decide which structure fits each communicative goal best.",
            "items": [
              {
                "prompt": "Context: Colleague says, \"I think Marcus wrote the summary.\" You know Hannah wrote it.",
                "targetFocus": "Corrective identification of the agent",
                "modelAnswer": "It was Hannah who wrote the summary (not Marcus).",
                "commentary": "An it-cleft directly repairs the mistaken identity while preserving the shared assumption that the summary was written."
              },
              {
                "prompt": "Context: Describing a laboratory process where the identity of the worker does not matter.",
                "targetFocus": "Process description",
                "modelAnswer": "The samples are heated to sixty degrees for twenty minutes.",
                "commentary": "The agentless passive is ideal here; a cleft would be inappropriate."
              }
            ]
          },
          "followUpQuestions": [
            {
              "id": "m1-s3-q1",
              "role": "Recognition",
              "type": "mcq",
              "prompt": "Which grammatical device highlights a constituent by dividing a single clause into two clauses, each with its own finite verb?",
              "options": [
                "Clefting (e.g. \"It was Clara who locked the office.\")",
                "Passive voice (e.g. \"The office was locked by Clara.\")",
                "Adverbial fronting (e.g. \"Every evening, Clara locks the office.\")",
                "Yes/No interrogation (e.g. \"Did Clara lock the office?\")"
              ],
              "correctAnswer": "Clefting (e.g. \"It was Clara who locked the office.\")",
              "explanation": "Clefting splits one clause into two finite clauses (\"It was Clara\" + \"who locked the office\"), whereas passive voice, fronting, and interrogation remain single-clause constructions."
            },
            {
              "id": "m1-s3-q2",
              "role": "Construction",
              "type": "mcq",
              "prompt": "Which sentence uses a basic what-cleft (pseudo-cleft) to focus on “a quiet workspace”?",
              "options": [
                "What the editor needs is a quiet workspace.",
                "It is a quiet workspace that the editor needs.",
                "A quiet workspace is needed by the editor.",
                "Why does the editor need a quiet workspace?"
              ],
              "correctAnswer": "What the editor needs is a quiet workspace.",
              "explanation": "A basic what-cleft packages the backgrounded proposition in a nominal relative clause (\"What the editor needs\") and places the focused element (\"a quiet workspace\") after the copula \"is\"."
            },
            {
              "id": "m1-s3-q3",
              "role": "Interpretation",
              "type": "mcq",
              "prompt": "In spoken English, why might a speaker say “THE ASSISTANT found the error” instead of using a full it-cleft?",
              "options": [
                "Because vocal stress (pitch and loudness) on \"the assistant\" can signal narrow contrastive focus directly without changing the grammatical structure.",
                "Because it-clefts are ungrammatical in spoken British English.",
                "Because \"the assistant\" is an object rather than a subject.",
                "Because spoken English does not allow relative clauses."
              ],
              "correctAnswer": "Because vocal stress (pitch and loudness) on \"the assistant\" can signal narrow contrastive focus directly without changing the grammatical structure.",
              "explanation": "Spoken prosody can mark focus on any word in situ; written prose lacks audible intonation and therefore relies more heavily on syntactic clefting to make narrow focus unmistakable."
            }
          ]
        }

    {
      "id": 2,
      "code": "Module 02",
      "title": "It-cleft Sentences: Core Structures",
      "cefr": "B1–B2",
      "summary": "Core grammatical patterns of it-clefts across subject, object, time, place, and reason focus; choice and optional omission of relative markers; tense alignment and singular agreement.",
      "modelSentence": "It was Maya who prepared the report. / It was on Monday that Maya prepared it.",
      "learningObjectives": [
        "Construct accurate it-clefts focusing on subjects, direct/indirect objects, and time, place, or reason adjuncts.",
        "Select appropriately between \"who\" and \"that\" and recognise when \"that\" can be omitted in informal object/adjunct focus.",
        "Maintain tense harmony between the introductory \"It + be\" clause and the subordinate clause.",
        "Apply singular agreement (\"It is/was\") even when the focused noun phrase is plural."
      ],
      "foundationalCautions": [
        "Avoid presenting \"when\" or \"where\" after time/place focus in it-clefts as universal grammatical errors; while \"that\" is the core structural marker (\"It was on Monday that...\"), \"when\" and \"where\" occur in authentic speech after noun phrases, though \"that\" remains safest in formal examinations.",
        "Never omit the relative marker when the focused element is the subject of the following clause."
      ],
      "subsections": [
        {
          "id": "m2-s1",
          "code": "2.1",
          "title": "Subject Focus versus Object Focus in It-clefts",
          "cefr": "B1",
          "definition": "An it-cleft can extract either the grammatical subject or an object (direct, indirect, or prepositional) from an ordinary clause and place it immediately after \"It + be\" as the focused constituent.",
          "formationPattern": "Subject Focus: [It + is/was + Subject NP + who/that + Verb + ...] | Object Focus: [It + is/was + Object NP + (that) + Subject + Verb + ...]",
          "meaningAndPresupposition": "In subject focus (\"It was Maya who prepared the report\"), the agent is identified against the presupposition that someone prepared the report. In object focus (\"It was the report that Maya prepared\"), the item produced or affected is identified against the presupposition that Maya prepared something.",
          "whenAppropriate": "Use subject focus to clarify authorship, responsibility, or agency; use object focus to specify which item, person, or document was affected by a known action.",
          "examples": [
            {
              "sentence": "It was Maya who prepared the quarterly report.",
              "ordinaryEquivalent": "Maya prepared the quarterly report.",
              "focusedConstituent": "Maya (Subject)",
              "presupposedProposition": "Someone prepared the quarterly report.",
              "pragmaticPurpose": "Credits Maya specifically for the preparation of the report."
            },
            {
              "sentence": "It was the quarterly report that Maya prepared.",
              "ordinaryEquivalent": "Maya prepared the quarterly report.",
              "focusedConstituent": "the quarterly report (Direct Object)",
              "presupposedProposition": "Maya prepared a document.",
              "pragmaticPurpose": "Clarifies which document Maya prepared."
            },
            {
              "sentence": "It was the external auditors who requested the receipts.",
              "ordinaryEquivalent": "The external auditors requested the receipts.",
              "focusedConstituent": "the external auditors (Plural Subject)",
              "presupposedProposition": "Someone requested the receipts.",
              "pragmaticPurpose": "Note that \"It was\" remains singular even though \"the external auditors\" is plural."
            },
            {
              "sentence": "It was to the regional manager that we sent the complaint.",
              "ordinaryEquivalent": "We sent the complaint to the regional manager.",
              "focusedConstituent": "to the regional manager (Prepositional Recipient)",
              "presupposedProposition": "We sent the complaint to someone.",
              "pragmaticPurpose": "Formal specification of the recipient."
            },
            {
              "sentence": "It was the second prototype (that) the engineers tested yesterday.",
              "ordinaryEquivalent": "The engineers tested the second prototype yesterday.",
              "focusedConstituent": "the second prototype (Direct Object with optional \"that\")",
              "presupposedProposition": "The engineers tested a prototype yesterday.",
              "pragmaticPurpose": "Shows optional omission of \"that\" when focusing an object."
            }
          ],
          "contextualComparisons": [
            {
              "context": "Comparing relative markers in human Subject vs Object focus",
              "ordinaryForm": "Professor Lin interviewed the candidate.",
              "cleftForm": "Subject Focus: It was Professor Lin who/that interviewed the candidate.",
              "alternativeForm": "Object Focus: It was the candidate that/who(m) Professor Lin interviewed.",
              "comparisonNote": "For human subjects, \"who\" is strongly preferred in formal prose. For human objects, \"that\" (or \"who\" in speech, \"whom\" in very formal writing) is used."
            }
          ],
          "learnerErrors": [
            {
              "incorrectOrAwkward": "It were the external auditors who requested the receipts.",
              "status": "Ungrammatical",
              "correctedVersion": "It was the external auditors who requested the receipts.",
              "diagnosticExplanation": "In English, the verb \"be\" in an it-cleft agrees with the singular dummy subject \"It\" (\"It is\" / \"It was\"), never with a plural focused noun phrase."
            },
            {
              "incorrectOrAwkward": "It was Maya prepared the report.",
              "status": "Ungrammatical",
              "correctedVersion": "It was Maya who prepared the report.",
              "diagnosticExplanation": "Relative-marker omission is ungrammatical in standard English when the focused constituent is the subject of the subordinate clause."
            }
          ],
          "restrictionsAndExceptions": [
            "In object-focus it-clefts (\"It was the form (that) Amira submitted\"), the marker \"that\" can be omitted in conversational and moderately formal English because the subordinate clause still has its own explicit subject (\"Amira\").",
            "In subject-focus it-clefts, omitting \"who/that\" is restricted to very casual regional speech and is treated as an error in standard written English."
          ],
          "guidedPractice": {
            "taskTitle": "Subject vs Object Transformation Practice",
            "instructions": "Transform the base sentence to focus on the specified constituent.",
            "items": [
              {
                "prompt": "Base: Amira submitted the form. → Focus on \"Amira\".",
                "targetFocus": "Amira (Subject)",
                "modelAnswer": "It was Amira who submitted the form.",
                "commentary": "Uses singular \"was\" and personal subject marker \"who\"."
              },
              {
                "prompt": "Base: Amira submitted the form. → Focus on \"the form\".",
                "targetFocus": "the form (Direct Object)",
                "modelAnswer": "It was the form that Amira submitted.",
                "commentary": "Uses \"that\" followed by subject + verb (\"Amira submitted\")."
              }
            ]
          },
          "followUpQuestions": [
            {
              "id": "m2-s1-q1",
              "role": "Construction",
              "type": "rewrite",
              "prompt": "Transform “Amira submitted the form” into an it-cleft to focus on Amira.",
              "correctAnswer": "It was Amira who submitted the form.",
              "acceptableAlternatives": [
                "It was Amira that submitted the form."
              ],
              "explanation": "To focus on the subject \"Amira\", place \"Amira\" after \"It was\" and introduce the subordinate clause with \"who\" (or \"that\")."
            },
            {
              "id": "m2-s1-q2",
              "role": "Construction",
              "type": "rewrite",
              "prompt": "Transform “Amira submitted the form” into an it-cleft to focus on the form.",
              "correctAnswer": "It was the form that Amira submitted.",
              "acceptableAlternatives": [
                "It was the form which Amira submitted.",
                "It was the form Amira submitted."
              ],
              "explanation": "To focus on the direct object \"the form\", place it after \"It was\" and follow it with the clause \"that Amira submitted\"."
            },
            {
              "id": "m2-s1-q3",
              "role": "Recognition",
              "type": "mcq",
              "prompt": "In both “It was Amira who submitted the form” and “It was the form that Amira submitted”, which clause conveys the event information assumed as background in each version?",
              "options": [
                "The subordinate clause introduced by \"who\" or \"that\" (\"who submitted the form\" / \"that Amira submitted\").",
                "The introductory clause (\"It was Amira\" / \"It was the form\").",
                "Neither clause conveys assumed information.",
                "Only the word \"It\" conveys the assumed event."
              ],
              "correctAnswer": "The subordinate clause introduced by \"who\" or \"that\" (\"who submitted the form\" / \"that Amira submitted\").",
              "explanation": "In every it-cleft, the subordinate relative clause expresses the presupposed background proposition, while the element after \"It + be\" supplies the focused value."
            }
          ]
        },
        {
          "id": "m2-s2",
          "code": "2.2",
          "title": "Focusing Adjuncts of Time, Place and Reason",
          "cefr": "B1",
          "definition": "Unlike ordinary relative clauses—which attach to noun phrases—an it-cleft can focus prepositional phrases, adverb phrases, and adverbial clauses expressing time, place, manner, or reason.",
          "formationPattern": "[It + is/was + Time / Place / Reason Adjunct + that + Subject + Verb + ...]",
          "meaningAndPresupposition": "Focusing an adjunct presupposes that the entire event occurred and narrows the assertion solely to when, where, how, or why it happened (e.g. \"It was on Monday that Maya prepared it\" presupposes that Maya prepared it on some day).",
          "whenAppropriate": "Use adjunct-focused it-clefts in historical narratives, incident investigations, and academic explanations when establishing exact dates, locations, or causal triggers.",
          "examples": [
            {
              "sentence": "It was on Monday that Maya prepared the report.",
              "ordinaryEquivalent": "Maya prepared the report on Monday.",
              "focusedConstituent": "on Monday (Time Prepositional Phrase)",
              "presupposedProposition": "Maya prepared the report at some time.",
              "pragmaticPurpose": "Specifies the exact day of preparation."
            },
            {
              "sentence": "It was in the chemistry laboratory that the leak was first detected.",
              "ordinaryEquivalent": "The leak was first detected in the chemistry laboratory.",
              "focusedConstituent": "in the chemistry laboratory (Place Prepositional Phrase)",
              "presupposedProposition": "The leak was first detected somewhere.",
              "pragmaticPurpose": "Pinpoints the location of the incident."
            },
            {
              "sentence": "It was because of the rail strike that the conference was postponed.",
              "ordinaryEquivalent": "The conference was postponed because of the rail strike.",
              "focusedConstituent": "because of the rail strike (Reason Phrase)",
              "presupposedProposition": "The conference was postponed for some reason.",
              "pragmaticPurpose": "Highlights the causal factor behind the postponement."
            },
            {
              "sentence": "It was only after the third trial that the pattern became clear.",
              "ordinaryEquivalent": "The pattern became clear only after the third trial.",
              "focusedConstituent": "only after the third trial (Restricted Time Adjunct)",
              "presupposedProposition": "The pattern eventually became clear.",
              "pragmaticPurpose": "Emphasises the threshold point in an experimental sequence."
            },
            {
              "sentence": "It was because the sample was contaminated that we repeated the test.",
              "ordinaryEquivalent": "We repeated the test because the sample was contaminated.",
              "focusedConstituent": "because the sample was contaminated (Finite Reason Clause)",
              "presupposedProposition": "We repeated the test for a specific reason.",
              "pragmaticPurpose": "Focuses a complete subordinate reason clause."
            }
          ],
          "contextualComparisons": [
            {
              "context": "Using \"that\" versus \"when/where\" after focused adjuncts",
              "ordinaryForm": "We signed the lease in September.",
              "cleftForm": "It was in September that we signed the lease. (Standard & preferred)",
              "alternativeForm": "It was September when we signed the lease. (Informal / noun-focused variant)",
              "comparisonNote": "When a prepositional phrase (\"in September\", \"in London\") is focused, standard British grammar strongly prefers \"that\" rather than \"when\" or \"where\"."
            }
          ],
          "learnerErrors": [
            {
              "incorrectOrAwkward": "It was because of the rain why the match was cancelled.",
              "status": "Ungrammatical",
              "correctedVersion": "It was because of the rain that the match was cancelled.",
              "diagnosticExplanation": "Never pair a focused reason phrase (\"because of...\") with \"why\" in an it-cleft; the subordinate clause in an it-cleft must be introduced by \"that\"."
            },
            {
              "incorrectOrAwkward": "It was in the main hall where the exam took place.",
              "status": "Non-idiomatic",
              "correctedVersion": "It was in the main hall that the exam took place.",
              "diagnosticExplanation": "Because the preposition \"in\" is already present in the focused phrase (\"in the main hall\"), using \"that\" avoids redundant locative marking in formal writing."
            }
          ],
          "restrictionsAndExceptions": [
            "Always use \"that\" (not \"which\", \"where\", or \"why\") when the focused constituent is a prepositional phrase or adverbial clause.",
            "In informal speech, \"that\" is occasionally omitted after simple time adjuncts (\"It was yesterday I saw her\"), but retaining \"that\" is standard in formal writing."
          ],
          "guidedPractice": {

                "commentary": "Entire finite reason clause placed before \"that she resigned\"."

            {

          "title": "Tense Harmony, Aspect and Naturalness Across Speech and Writing",
          "cefr": "B2",
          "definition": "In standard English it-clefts, the tense of the introductory copula (\"It is\", \"It was\", \"It has been\") normally matches the time reference of the verb in the subordinate clause, although present-tense \"It is\" can introduce a past event when the speaker treats the identification as a current truth.",
          "formationPattern": "Past Event: [It was + X + that/who + Past Verb] | Present Truth/State: [It is + X + that/who + Present/Past Verb]",
          "meaningAndPresupposition": "Matching past with past (\"It was in 1998 that the institute opened\") situates both the identification and the event in the past. Using \"It is\" with a past verb (\"It is her early research that laid the foundation\") frames the focused entity as relevant right now.",
          "whenAppropriate": "Use tense harmony (\"It was ... that + past\"; \"It is ... that + present\") as your default rule. Reserve \"It is ... that + past\" for formal analytical writing where the focused subject still exists or holds current significance.",
          "examples": [
            {
              "sentence": "It was in 2019 that the department introduced the new curriculum.",
              "ordinaryEquivalent": "The department introduced the new curriculum in 2019.",
              "focusedConstituent": "in 2019",
              "presupposedProposition": "The department introduced the new curriculum.",
              "pragmaticPurpose": "Standard past-tense alignment for a completed historical event."
            },
            {
              "sentence": "It is the clinical trial data that supports this conclusion today.",
              "ordinaryEquivalent": "The clinical trial data supports this conclusion today.",
              "focusedConstituent": "the clinical trial data",
              "presupposedProposition": "Something supports this conclusion today.",
              "pragmaticPurpose": "Present-tense alignment for an ongoing academic argument."
            },
            {
              "sentence": "It has been the lack of affordable housing that has driven the policy debate.",
              "ordinaryEquivalent": "The lack of affordable housing has driven the policy debate.",
              "focusedConstituent": "the lack of affordable housing",
              "presupposedProposition": "Something has driven the policy debate.",
              "pragmaticPurpose": "Present perfect alignment showing a continuing situation."
            },
            {
              "sentence": "It will be the local council that decides the final route.",
              "ordinaryEquivalent": "The local council will decide the final route.",
              "focusedConstituent": "the local council",
              "presupposedProposition": "Some body will decide the final route.",
              "pragmaticPurpose": "Future reference in the introductory clause paired with present simple in the subordinate clause."
            }
          ],
          "contextualComparisons": [
            {
              "context": "Spoken omission of \"that\" vs formal written retention",
              "ordinaryForm": "I left my umbrella at the dentist’s.",
              "cleftForm": "Written/Formal: It was at the dentist’s that I left my umbrella.",
              "alternativeForm": "Spoken/Conversational: It was at the dentist’s I left my umbrella.",
              "comparisonNote": "In rapid conversation, speakers frequently drop \"that\" after an object or time/place adjunct. In formal reports and examination essays, retaining \"that\" improves clarity."
            }
          ],
          "learnerErrors": [
            {
              "incorrectOrAwkward": "It was next month that the board will announce the results.",
              "status": "Ungrammatical",
              "correctedVersion": "It is next month that the board will announce the results.",
              "diagnosticExplanation": "Past-tense \"It was\" clashes with future time reference (\"next month ... will announce\"). Use \"It is\" (or \"It will be\")."
            },
            {
              "incorrectOrAwkward": "It was run the marathon that David did.",
              "status": "Ungrammatical",
              "correctedVersion": "What David did was run the marathon.",
              "diagnosticExplanation": "Standard English does not allow focusing a bare verb phrase (\"run the marathon\") inside an it-cleft. To focus an action or verb phrase, use a what-cleft (\"What David did was...\")."
            }
          ],
          "restrictionsAndExceptions": [
            "Key Structural Restriction: An it-cleft cannot normally focus a finite verb or verb phrase alone (*\"It was resigned that the director did\"). Use a pseudo-cleft (\"What the director did was resign\") instead.",
            "When \"It will be\" is used in the main clause, the subordinate clause normally uses the present simple (\"It will be Maya who presents the findings tomorrow\"), just as in time and conditional clauses."
          ],
          "guidedPractice": {

            "instructions": "Diagnose each sentence and supply a natural, grammatically accurate version.",

          "followUpQuestions": [

              "id": "m2-s3-q1",

      "foundationalCautions": [
        "Do not confuse main-clause cleft negation (\"It wasn’t Sara who called\" → someone else called) with subordinate-clause negation (\"It was Sara who didn’t call\" → Sara was the person who failed to call).",
        "Remember that clefts do not automatically require \"only\", and when \"only\" is added, it explicitly restricts the truth of the proposition to that single value."
      ],

          "title": "Negative It-clefts and the Preservation of Presupposition",
          "cefr": "B2",
          "definition": "A negative it-cleft places negation on the introductory copula (\"It isn’t / It wasn’t X that/who...\"). Crucially, the negation scopes only over the focused constituent X; the subordinate clause remains presupposed as true.",
          "formationPattern": "Main-Clause Negation: [It + isn’t/wasn’t + Focused X + that/who + Positive Clause] vs Subordinate Negation: [It + is/was + Focused X + that/who + Negative Clause]",
          "meaningAndPresupposition": "Compare \"Sara didn’t call\" (ordinary negation: denies that any call from Sara took place; nobody may have called at all) with \"It wasn’t Sara who called\" (negative it-cleft: presupposes that someone definitely called, and denies only that the caller was Sara).",
          "whenAppropriate": "Use a negative it-cleft in professional meetings, academic critiques, and everyday clarification when you agree that an event or problem exists, but you need to reject a mistaken attribution of who, what, or why.",
          "examples": [
            {
              "sentence": "It wasn’t Sara who called the client this morning.",
              "ordinaryEquivalent": "Someone called the client this morning, but that person was not Sara.",
              "focusedConstituent": "Sara (negated identity)",
              "presupposedProposition": "Someone called the client this morning.",
              "pragmaticPurpose": "Corrects a mistaken assumption about the caller without denying the call."
            },

              "pragmaticPurpose": "Redirects a budget discussion away from a false culprit."

              "presupposedProposition": "The server eventually came back online.",
              "pragmaticPurpose": "Emphasises the lateness of the recovery (\"not until\" cleft)."
